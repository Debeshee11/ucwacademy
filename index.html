<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UpperCrust Academy · 75 Days 80 Lacs</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,500&family=DM+Mono:wght@400;500&family=Playfair+Display:wght@500;600;700&family=Noto+Serif+Devanagari:wght@500;600&family=Noto+Serif+Gujarati:wght@500;600&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Gujarati:wght@400;600&display=swap" rel="stylesheet">
<style>/* ===== styles.css — UpperCrust design system: cream and paper surfaces, deep gold accent, warm near-black type. Tokens first, brand layer last. ===== */
/* Layout: paper top bar (welcome · points · streak) and paper sidebar around a cream workspace; white cards; status shown as metallic tier cards and engraved medals. */
:root{
  /* ===== UpperCrust design tokens — fonts, colours, shape and spacing are defined once here and reused everywhere ===== */
  /* fonts: DM Sans for UI and body, DM Mono for numbers and data, Playfair Display for large headings and lesson titles only */
  --font-sans:"DM Sans","Noto Sans Devanagari","Noto Sans Gujarati",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  --font-display:"Playfair Display","Noto Serif Devanagari","Noto Serif Gujarati",Georgia,serif;
  /* deep gold is the one signature colour */
  --gold:#7c6118; --gold-hi:#a37e20; --gold-dark:#5a470f; --gold-rgb:124,97,24; --gold-soft:#f4ecd6;
  /* warm neutrals: cream page, white cards, paper bars, beige borders */
  --ink:#1c1812; --muted:#6b604f; --bg:#f0ebe0; --paper:#f8f5ee; --surface:#ffffff; --line:#e4ddd0; --empty:#ece5d6;
  /* status: green = correct / progress, red = wrong / alert, amber = caution — always soft tints, never neon */
  --ok:#1a6e3a; --ok-soft:#e5f0e8; --bad:#b83228; --bad-soft:#f8e6e3; --warn:#9a5208; --warn-soft:#f7ead7;
  /* shape, depth and spacing */
  --radius:5px; --shadow-sm:0 1px 2px rgba(28,24,18,.05); --shadow-md:0 8px 22px -16px rgba(28,24,18,.30);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  /* chart and phase colours */
  --p1:#7c6118; --p2:#2f6f62; --p3:#8b5e34; --p4:#5f6b7a; --p5:#7a5c8a; --p6:#a89a7c;
  --ph1:#7c6118; --ph2:#2f6f62; --ph3:#6f7a2f; --ph4:#8b5e34; --ph5:#7a5c8a; --ph6:#b05a3c;
  /* names the rest of the stylesheet already uses, mapped onto the tokens above */
  --serif:var(--font-display); --sans:var(--font-sans); --mono:var(--font-mono);
  --navy:var(--ink); --navy-2:#2a241a;
  --accent:var(--gold); --accent-2:var(--gold-dark); --accent-ink:#ffffff;
  --status:var(--gold); --status-soft:var(--gold-soft); --hud-gold:var(--gold);
  --hud:var(--paper); --hud-2:#efe9dc; --hud-ink:var(--ink); --hud-muted:var(--muted); --hud-line:rgba(28,24,18,.12);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}


*{box-sizing:border-box}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 110px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.62 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--serif);margin:0;line-height:1.18;letter-spacing:-.01em;font-weight:650}
h1{font-size:clamp(1.8rem,4vw,2.6rem)} h2{font-size:1.4rem} h3{font-size:1.12rem} h4{font:600 .9rem/1.3 var(--sans);margin:0 0 4px;color:var(--muted)}
p{margin:0} a{color:var(--gold)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)} .ai-note{font-size:.8rem;color:var(--muted)} .caution{color:var(--bad)} .ok-text{color:var(--ok)}
.stack>*+*{margin-top:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:780px){.split{grid-template-columns:1fr}}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#F1ECE2;padding-top:env(safe-area-inset-top,0px)}
.top-row{display:flex;align-items:center;gap:16px;padding:14px 0 8px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:650;font-size:1.15rem;letter-spacing:.01em}
.brand small{display:block;font:500 .75rem var(--sans);color:#C9B27A}
.who{display:block;font:400 .78rem var(--sans);color:#a39a88}
.stats{margin-left:auto;display:flex;gap:20px;font-size:.78rem;color:#a39a88}
.stats b{display:block;font:600 1.1rem var(--serif);color:#F1ECE2;line-height:1.1}
#lang{background:var(--navy-2);color:#F1ECE2;border:1px solid #4a4130;border-radius:var(--radius);padding:6px 10px;font:inherit}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:none;color:#a39a88;padding:7px 12px;border-radius:var(--radius);white-space:nowrap;font-weight:500}
.nav button:hover{color:#fff}
.nav button[aria-current="page"]{background:#F1ECE2;color:var(--navy)}
@media (max-width:680px){.stats .hide-sm{display:none}.stats{gap:14px}}
main{padding:28px 0 72px}

/* controls */
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:var(--radius);font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.brass{background:var(--gold);border-color:var(--gold);color:#1A1406}
.btn.sm{padding:6px 12px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=url],input[type=search],input[type=date],textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;width:100%}
select,input[type=date]{width:auto}
textarea{resize:vertical} textarea.json{font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;min-height:320px}
.lbl{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.9rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.eyebrow{font-size:.8rem;font-weight:600;color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-sm{font-size:.76rem;padding:2px 9px;border-radius:var(--radius);background:var(--gold-soft);color:var(--ink)}
.pill{display:inline-block;padding:2px 10px;border-radius:var(--radius);font-size:.78rem;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--gold-soft);color:var(--gold)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--radius);font-weight:500;z-index:9}

/* home */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:36px;align-items:center}
.hero .lead{font:500 1.25rem/1.35 var(--serif);margin:6px 0 10px}
.hero p.muted{max-width:48ch;margin-bottom:16px}
.board{display:grid;grid-template-columns:repeat(15,1fr);gap:4px}
.cell{aspect-ratio:1;border-radius:3px;background:var(--empty);border:0;padding:0;position:relative}
.cell.deep::after{content:"";position:absolute;inset:auto 30% 30% 30%;height:2px;background:var(--c);opacity:.6}
.cell.done{background:var(--c)} .cell.done.deep::after{background:var(--bg)}
.cell.next{box-shadow:inset 0 0 0 2px var(--c)}
.cell.locked{cursor:not-allowed}
.cell.part{background:linear-gradient(135deg,var(--c) 50%,var(--empty) 50%)}
.cell.two::before{content:"";position:absolute;top:4px;right:4px;width:4px;height:4px;border-radius:50%;background:var(--muted)}
.cell.done.two::before{background:var(--bg)}
.board-note{display:flex;align-items:center;gap:8px;margin:10px 0 0;font-size:.76rem;color:var(--muted)}
.board-note i{width:4px;height:4px;border-radius:50%;background:var(--muted)}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 18px;margin-top:14px;font-size:.8rem;color:var(--muted)}
@media (max-width:640px){.legend{grid-template-columns:1fr}}
.legend span{display:flex;align-items:center;min-width:0}
.legend span::before{content:"";flex:none;width:10px;height:10px;border-radius:2px;background:var(--c);margin-right:8px}
/* Your phases: three per line, each name led by its phase colour */
.tiles.phases{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.tiles.phases{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.tiles.phases{grid-template-columns:1fr}}
.tile h3 .ph-sw{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);margin-right:8px;vertical-align:1px}
.tile .bar i{background:var(--c)}
.tiles.phases .tile>.muted{font-size:.8rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c,var(--ink));border-radius:var(--radius);padding:16px}
.tile:disabled{opacity:.5;cursor:not-allowed}
.bar{height:5px;background:var(--empty);border-radius:3px;overflow:hidden;margin-top:12px} .bar i{display:block;height:100%;background:var(--gold)}
.rev{border-left:3px solid var(--bad);padding-left:12px}
.news-mini{display:flex;flex-direction:column;gap:2px;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;width:100%}
.news-mini:hover strong{text-decoration:underline}
.score{font-family:var(--serif);font-weight:650}
@media (max-width:780px){.hero{grid-template-columns:1fr}}

/* lesson */
.lesson{max-width:760px;margin:0 auto}
.lesson-head{border-left:4px solid var(--c);padding-left:16px}
.phase-tag{display:inline-block;font-size:.82rem;font-weight:600;color:var(--gold);margin-bottom:6px}
.lesson-head h1{margin-bottom:10px}
.part{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.part>*+*{margin-top:14px}
.part p{max-width:68ch}
.part-head{display:flex;gap:12px;align-items:baseline}
.part-num{font:650 1.1rem var(--serif);color:var(--gold);min-width:1.4em}
.story-hl{font-size:1.25rem}
.source{font-size:.85rem;color:var(--muted)}
.points{margin:0;padding-left:20px} .points li{margin:6px 0;max-width:68ch}
.client-q{margin:0;padding:16px 18px;border-radius:var(--radius);background:var(--navy);color:#F1ECE2}
.client-q .quote{font:500 1.15rem/1.45 var(--serif)} .client-q .muted{color:#a39a88;margin-top:6px}
.client{margin:0;padding:14px 16px;border-radius:var(--radius);background:var(--gold-soft);border-left:4px solid var(--gold)}
.remember-list{margin:0;padding-left:22px} .remember-list li{margin:8px 0;font-weight:500}

/* questions */
.q-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.85rem}
.qtype{font-size:.74rem;padding:2px 8px;border-radius:var(--radius);border:1px solid var(--line);color:var(--muted)}
.qtype.review{border-color:var(--gold);color:var(--gold)}
.q-prompt{font:500 1.12rem/1.5 var(--serif);margin:12px 0 4px;max-width:70ch} .q-prompt.sm{font-size:1rem}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{text-align:left;background:var(--bg);border:1px solid var(--line);padding:12px 14px;border-radius:var(--radius);line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)} .opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.qflow>.row{margin-top:14px}
.explain{margin-top:18px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.explain .verdict{padding:12px 18px;font-weight:600}
.explain.is-right .verdict{background:var(--ok-soft);color:var(--ok)} .explain.is-wrong .verdict{background:var(--bad-soft);color:var(--bad)}
.exp-sec{padding:14px 18px;border-top:1px solid var(--line)}
.exp-sec p{max-width:70ch}
.answer-line{font-weight:600}
.wrong-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.wrong-list li{display:grid;gap:2px;padding-left:12px;border-left:2px solid var(--line)}
.wrong-list li.picked{border-left-color:var(--bad)}
.wrong-list strong{font-weight:500;color:var(--muted);font-size:.9rem}
.client-line{font-style:italic}
.remember{font:600 1.05rem var(--serif);color:var(--gold)}
.follow .opts{margin-top:8px}
.exp{font-size:.92rem;margin-top:8px;color:var(--muted)}

/* market desk — terminal feel */
.desk-head{background:var(--navy);color:#F1ECE2;border-radius:var(--radius);padding:26px 28px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-end}
.desk-head h1{font-size:clamp(2rem,4.5vw,3rem);letter-spacing:-.02em}
.desk-sub{color:#C9B27A;font:500 1.05rem var(--serif);margin-top:4px}
.desk-meta{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:#a39a88;text-align:right}
.desk-meta .ai-note{color:#8a7f6c}
.desk-top{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
@media (max-width:820px){.desk-top{grid-template-columns:1fr}.desk-meta{text-align:left}}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:12px}
.brief ol{margin:0;padding-left:18px;display:grid;gap:10px}
.linkish{background:none;border:0;padding:0;text-align:left;font-weight:600}
.linkish:hover{text-decoration:underline}
.story-card{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.story-card:hover{border-color:var(--ink)}
.story-card.featured{background:var(--navy);color:#F1ECE2;border-color:var(--navy);padding:24px;min-height:100%}
.story-card.featured .muted,.story-card.featured .src{color:#a39a88}
.story-card.featured h2{font-size:1.6rem}
.story-card.is-read{opacity:.78}
.meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:.78rem;color:var(--muted)}
.story-card.featured .meta{color:#C9B27A}
.cat{font-weight:600;color:var(--gold)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.saved-mark{color:var(--gold)}
.src{font-size:.8rem;color:var(--muted)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.desk-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:5px 12px;white-space:nowrap;font-size:.86rem}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.desk-tools input{max-width:420px}
.story{max-width:780px;margin:0 auto}
.story-head h1{margin:8px 0}
.story-sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.story-sec>h3{font:600 .82rem var(--sans);color:var(--gold);margin-bottom:8px}

/* lab */
.sim-tile .quote{font:500 1.05rem/1.45 var(--serif);margin-bottom:8px}
.quote.big{font:500 1.35rem/1.4 var(--serif)}
.crit{display:grid;gap:8px}
.crit-row{display:grid;grid-template-columns:minmax(140px,220px) 1fr auto;gap:10px;align-items:center;font-size:.9rem}
.crit-bar{height:8px;background:var(--empty);border-radius:4px;overflow:hidden} .crit-bar i{display:block;height:100%;background:var(--gold)}
.check{display:flex;gap:10px;align-items:flex-start} .check input{margin-top:5px}

/* tables, admin */
.lb{width:100%;border-collapse:collapse}
.lb td,.lb th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.lb th{font-size:.8rem;color:var(--muted);font-weight:500}
.lb .num{text-align:right}
.lb tr.me td{background:var(--gold-soft)}
.lb tr.click{cursor:pointer} .lb tr.click:hover td{background:var(--bg)}
.lb td.neg{color:var(--bad);font-weight:600}
.rank{font:650 1rem var(--serif);width:36px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.kpi b{display:block;font:650 1.5rem/1.1 var(--serif)} .kpi span{color:var(--muted);font-size:.84rem}
.heat td.hm{background:color-mix(in srgb, var(--ok) calc(var(--v) * 1%), var(--bad-soft));color:var(--ink);font-weight:600}
.trend{display:flex;gap:8px;align-items:flex-end;height:140px;padding-top:10px}
.tbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;font-size:.72rem;color:var(--muted)}
.tbar i{display:block;width:100%;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px}
.admin-row{border-bottom:1px solid var(--line);padding:8px 0}
.preview{margin-top:10px}

/* puzzles, tutor */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;text-align:left;min-height:48px}
.chip.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)} .chip.ok{background:var(--ok-soft);border-color:var(--ok);opacity:.7} .chip.no{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.letters{font:650 1.8rem var(--serif);letter-spacing:.25em;overflow-wrap:anywhere}
.chat{display:flex;flex-direction:column;gap:12px;max-height:55vh;overflow-y:auto}
.msg{max-width:80%;padding:10px 14px;border-radius:var(--radius);white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--bg)} .msg.a{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* index lab */
.ix-stats{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:6px}
.ix-stats b{font:650 1rem var(--serif);color:var(--ink)}
.pos b,.lb td.pos{color:var(--ok)} .neg b,.lb td.neg{color:var(--bad)}
.sm{font-size:.84rem}
.wbars{display:grid;gap:8px}
.wbar{display:grid;grid-template-columns:minmax(150px,260px) 1fr 64px;gap:12px;align-items:center;background:none;border:0;padding:4px 0;text-align:left;font-size:.92rem}
.wbar:hover .wname{text-decoration:underline}
.wtrack{height:12px;background:var(--empty);border-radius:var(--radius);overflow:hidden} .wtrack i{display:block;height:100%;background:var(--gold);border-radius:var(--radius)}
.wbar .num{text-align:right;font-weight:600}
@media (max-width:600px){.wbar{grid-template-columns:1fr 56px}.wbar .wtrack{grid-column:1/-1;order:3}}
.co-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.co-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:8px}
.co-short{font-weight:600}
.callout{background:var(--gold-soft);border-left:4px solid var(--gold);padding:12px 14px;border-radius:var(--radius)}
.explain-lite{border-top:1px solid var(--line);padding-top:14px}

/* v5: grouped nav, quick actions, profiler */
.nav-grp{align-self:center;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:#8a7f6c;padding:0 4px 0 12px;white-space:nowrap}
.nav-grp:first-child{padding-left:0}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.qa-card{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:var(--radius);padding:14px 16px}
.qa-card:hover{border-color:var(--ink)}
.grow{flex:1;display:flex;flex-direction:column;gap:2px}
.client-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}

.pf-opt:hover{border-color:var(--ink)} .pf-opt.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}

.mixbar i{display:block;height:100%} .mixbar .eq,.mixlegend .eq::before{background:var(--p1)} .mixbar .debt,.mixlegend .debt::before{background:var(--p2)} .mixbar .gold,.mixlegend .gold::before{background:var(--gold)}

.chip-sm.ok{background:var(--ok-soft);color:var(--ok)} .chip-sm.warn{background:var(--bad-soft);color:var(--bad)}

@media (max-width:780px){.prep-grid{grid-template-columns:1fr}}

/* v6: fund library */
.fund-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.fund-card{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:var(--radius);padding:18px}
.fund-card:hover{border-color:var(--ink)}
.fund-stats{display:flex;flex-wrap:wrap;gap:14px;font-size:.82rem;color:var(--muted)} .fund-stats b{font:650 1rem var(--serif);color:var(--ink)}
.kv th{font-weight:500;color:var(--muted);width:48%} .kv td{font-weight:600;white-space:normal}
.lb.compare td,.lb.compare th{white-space:normal;min-width:120px} .lb.compare td.best{background:var(--ok-soft);color:var(--ok)}
.wbar.static{cursor:default}

/* ===== v10: private-desk finish — flat controls, metallic status, quiet motion ===== */
h1,h2,h3{font-weight:600;letter-spacing:-.015em}
h1{font-size:clamp(1.9rem,4vw,2.7rem)}
.num,.score,.kpi b{font-family:var(--serif)}
/* flat controls: one solid accent, slim borders */
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:var(--radius);padding:10px 18px;font-weight:600;box-shadow:none;transition:background .2s,border-color .2s,color .2s}
.btn:hover:not(:disabled){background:var(--accent-2);border-color:var(--accent-2)}

.btn.ghost.on-dark:hover:not(:disabled){background:transparent;border-color:var(--hud-ink)}
.tile,.qa-card,.story-card,.fund-card,.co-card{transition:border-color .2s,box-shadow .25s}
.tile:hover:not(:disabled),.qa-card:hover,.story-card:hover,.fund-card:hover{box-shadow:0 10px 26px -18px rgba(15,27,51,.45)}
.panel,.part,.tile{border-radius:var(--radius)}
.qa-card{border-left-width:1px}
.opt{border-radius:var(--radius);transition:border-color .2s,background .2s}
.mixbar .gold,.mixlegend .gold::before{background:var(--status)}
.desk-sub,.pf-hero .eyebrow,.story-card.featured .meta{color:var(--hud-muted)}
main .wrap>*{animation:page-in .32s cubic-bezier(.2,.7,.2,1)}
@keyframes page-in{from{transform:translateY(10px)}}

/* metals — status only: tier cards, medals, leaderboard frames */
/* Ten tiers: three metals, four gemstones, then pearl, obsidian and diamond. m1–m4 are the finish's dark/light/dark/mid stops; mi is text on it. */
.t-bronze,.m-bronze{--m1:#5E3A20;--m2:#D9A57A;--m3:#6E4426;--m4:#AD774D;--mi:#2A1608;--mi2:rgba(42,22,8,.72)}
.t-silver,.m-silver{--m1:#7D838D;--m2:#F4F6F9;--m3:#959CA7;--m4:#D3D8DF;--mi:#1E2430;--mi2:rgba(30,36,48,.72)}
.t-gold,.m-gold{--m1:#7E5A1C;--m2:#F5DD94;--m3:#9B7128;--m4:#E0B85A;--mi:#2B1D05;--mi2:rgba(43,29,5,.72)}
.t-sapphire{--m1:#0A1F55;--m2:#6F9BF0;--m3:#102C78;--m4:#2E5BC4;--mi:#EEF3FF;--mi2:rgba(238,243,255,.75)}
.t-ruby{--m1:#4A0718;--m2:#EE6A86;--m3:#6E0E26;--m4:#B3264A;--mi:#FFF0F3;--mi2:rgba(255,240,243,.75)}
.t-emerald{--m1:#04362A;--m2:#5ED6AE;--m3:#085138;--m4:#1D8F69;--mi:#EDFFF7;--mi2:rgba(237,255,247,.75)}
.t-amethyst{--m1:#2E1250;--m2:#C3A0F0;--m3:#45207A;--m4:#7E52BE;--mi:#F8F1FF;--mi2:rgba(248,241,255,.75)}
.t-pearl{--m1:#CFC6BC;--m2:#FFFFFF;--m3:#E4DDEB;--m4:#F2E9E1;--mi:#2E2A36;--mi2:rgba(46,42,54,.7)}
.t-obsidian{--m1:#040507;--m2:#40444F;--m3:#0B0D11;--m4:#252831;--mi:#E8D08E;--mi2:rgba(232,208,142,.78)}
.t-diamond{--m1:#9DB3C9;--m2:#FFFFFF;--m3:#C8DBEC;--m4:#EAF4FC;--mi:#122030;--mi2:rgba(18,32,48,.7)}
.t-bronze,.t-silver,.t-gold,.t-sapphire,.t-ruby,.t-emerald,.t-amethyst,.t-pearl,.t-obsidian,.t-diamond,.m-bronze,.m-silver,.m-gold{--metal:linear-gradient(135deg,var(--m1),var(--m2) 36%,var(--m3) 52%,var(--m4) 74%,var(--m1))}
/* Pearl gets a soft iridescent wash; Diamond a prismatic glint */
.t-pearl{--metal:linear-gradient(135deg,rgba(255,214,231,.35),rgba(201,226,255,.35) 50%,rgba(255,241,214,.35)),linear-gradient(135deg,var(--m1),var(--m2) 36%,var(--m3) 52%,var(--m4) 74%,var(--m1))}
.t-diamond{--metal:conic-gradient(from 210deg at 70% 30%,rgba(255,190,220,.28),rgba(190,230,255,.32),rgba(210,255,230,.24),rgba(255,240,190,.28),rgba(255,190,220,.28)),linear-gradient(135deg,var(--m1),var(--m2) 36%,var(--m3) 52%,var(--m4) 74%,var(--m1))}

.tier-card{position:relative;overflow:hidden;aspect-ratio:1.586/1;width:100%;max-width:360px;border-radius:var(--radius);padding:18px 20px;color:var(--mi);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px),var(--metal);
  box-shadow:0 20px 40px -22px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.35);display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.tier-card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.38) 48%,transparent 60%);transform:translateX(-120%);transition:transform 1.2s cubic-bezier(.2,.7,.2,1);pointer-events:none}
.tier-card:hover::after{transform:translateX(120%)}
.tc-top{display:flex;justify-content:space-between;align-items:center}
.tc-brand{font:600 .66rem var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--mi2)}
.tc-chip{width:38px;height:28px;border-radius:var(--radius);background:linear-gradient(135deg,#B8913A,#F3DC98 45%,#A47D2E 60%,#E6C46E);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.tc-tier{font:500 clamp(1.7rem,3.6vw,2.2rem)/1 var(--serif);letter-spacing:.02em;text-shadow:0 1px 0 rgba(255,255,255,.22)}
.tc-low{display:flex;flex-direction:column;gap:6px}
.tc-name{font:500 .86rem var(--mono);letter-spacing:.1em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-foot{display:flex;justify-content:space-between;align-items:baseline;font:500 .78rem var(--sans);color:var(--mi2)}
.tc-foot b{font:600 1.05rem var(--mono);color:var(--mi)}
.tc-bar{height:3px;border-radius:2px;background:rgba(0,0,0,.2);overflow:hidden}
.tc-bar i{display:block;height:100%;background:var(--mi);opacity:.75;transition:width .8s cubic-bezier(.2,.7,.2,1)}
.tc-next{margin:0;font-size:.8rem;color:var(--hud-muted);text-align:center}
/* Status card: tier, points and distance to the next tier, set in the tier's metal only on a small seal */
.status-card{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;padding:18px 20px;border-radius:var(--radius);color:#F1ECE2;
  background:#2a241a;border:1px solid rgba(241,236,226,.14);box-shadow:0 18px 36px -24px rgba(0,0,0,.7)}
.sc-top{display:flex;justify-content:space-between;font:600 .64rem var(--sans);letter-spacing:.16em;text-transform:uppercase;color:#9a8f7a}
.sc-tier{display:flex;align-items:center;gap:14px}
.status-card{--cup-glow:var(--m2)} .status-card.t-obsidian{--cup-glow:var(--mi)}
.sc-cup{position:relative;width:42px;height:42px;flex:none;display:grid;place-items:center}
.sc-cup::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--cup-glow) 55%,transparent),transparent 68%);animation:cup-glow 3.6s ease-in-out infinite}
.sc-cup svg{position:relative;width:100%;height:100%;filter:drop-shadow(0 0 5px color-mix(in srgb,var(--cup-glow) 70%,transparent)) drop-shadow(0 2px 2px rgba(0,0,0,.4))}
@keyframes cup-glow{50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.sc-cup::before{animation:none}}
.sc-tier b{display:block;font:500 1.55rem/1.1 var(--serif);color:#F7F3EA}
.sc-tier small{display:block;margin-top:2px;font:500 .8rem var(--sans);color:#9a8f7a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid rgba(241,236,226,.12);padding-top:12px}
.sc-stats>div{display:flex;flex-direction:column;gap:2px}
.sc-stats>div+div{border-left:1px solid rgba(241,236,226,.12);padding-left:14px}
.sc-stats b{font:600 1.3rem var(--mono);color:var(--hud-gold)}
.sc-stats span{font:500 .72rem var(--sans);color:#9a8f7a}
.status-card .tc-bar{background:rgba(241,236,226,.12)} .status-card .tc-bar i{background:var(--hud-gold);opacity:1}
.tile.now{border-color:var(--c,var(--ink));box-shadow:0 0 0 1px var(--c,var(--ink))}
.now-tag{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:var(--radius);font:600 .62rem var(--sans);letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--bg);vertical-align:middle}

.medal{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font:600 1.05rem var(--serif);color:var(--mi2);
  background:radial-gradient(circle at 32% 28%,var(--m2),var(--m4) 42%,var(--m3) 78%,var(--m1));
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.14),inset 0 0 0 5px rgba(255,255,255,.3),0 6px 12px -6px rgba(0,0,0,.45);
  text-shadow:0 1px 0 rgba(255,255,255,.55),0 -1px 0 rgba(0,0,0,.3)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:18px 10px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line)}
.badge strong{font-size:.9rem;line-height:1.25}
.badge span{font-size:.76rem;color:var(--muted);line-height:1.3}
.badge.locked .medal{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted);text-shadow:none}
/* Medal icons: engraved into the metal, with the medal's number on a small ribbon tag */
.medal{position:relative}
.m-ico{display:grid;place-items:center;width:52%;height:52%}
.m-ico svg{width:100%;height:100%;filter:drop-shadow(0 1px 0 rgba(255,255,255,.55)) drop-shadow(0 -.5px 0 rgba(0,0,0,.3))}
.m-tag{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);min-width:22px;padding:1px 6px;border-radius:var(--radius);font:600 .6rem/1.4 var(--sans);letter-spacing:.04em;text-shadow:none;
  color:var(--mi);background:linear-gradient(180deg,var(--m2),var(--m4));box-shadow:0 1px 3px rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.12)}
.badge.locked .m-ico svg{filter:none;opacity:.7}
.badge.locked .m-tag{background:var(--surface);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.modal .medal .m-tag{font-size:.75rem;bottom:-9px}
.badge .medal{margin-bottom:6px}
.q-ico{width:34px;height:34px;border-radius:var(--radius);display:grid;place-items:center;background:var(--gold-soft);color:var(--ink)}
.q-ico svg{width:19px;height:19px}
.q-step.done .q-ico{opacity:.55}
.badge.locked strong{color:var(--muted)}

.tier-frame{display:inline-flex;align-items:center;gap:8px;padding:3px 12px 3px 3px;border-radius:var(--radius);border:1.5px solid transparent;font-weight:600;
  background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--metal) border-box;white-space:nowrap}
.tier-frame .tf-dot{width:24px;height:24px;border-radius:50%;background:var(--metal);display:grid;place-items:center;font:600 .62rem var(--sans);color:var(--mi)}
.lb tr.me .tier-frame{background:linear-gradient(var(--gold-soft),var(--gold-soft)) padding-box,var(--metal) border-box}
.lb .sub{display:block;font-size:.76rem;color:var(--muted);margin:4px 0 0 4px}
.podium{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:12px;align-items:end}
.pod{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.pod .av{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font:600 1.1rem var(--serif);color:var(--hud-ink);border:3px solid transparent;
  background:linear-gradient(var(--navy-2),var(--navy-2)) padding-box,var(--metal) border-box}
.pod .nm{font-weight:600;font-size:.92rem;line-height:1.2;overflow-wrap:anywhere}
.pod .blk{width:100%;border-radius:10px 10px 2px 2px;background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 6px;gap:2px}
.pod .blk b{font:500 1.5rem var(--serif)}
.pod .blk .pts{font:600 .8rem var(--mono);color:var(--status)}
.pod.p1 .blk{height:140px;border-color:var(--status)} .pod.p2 .blk{height:112px} .pod.p3 .blk{height:92px}
/* Lesson screen: one question at a time, Check → banner → Continue, combo, summary */
html.lr-open{overflow:hidden}
html.lr-open #fx{z-index:310} html.lr-open .xp-float{z-index:311} html.lr-open .toast{z-index:312} html.lr-open .modal-bg{z-index:320}
.lr{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column;animation:lr-in .28s cubic-bezier(.2,.7,.2,1)}
@keyframes lr-in{from{transform:translateY(16px)}}
.lr-top{display:flex;align-items:center;gap:16px;max-width:820px;width:100%;margin:0 auto;padding:22px 20px 8px}
.lr-x{width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:1rem}
.lr-x:hover{color:var(--ink);border-color:var(--ink)}
.lr-bar{flex:1;height:14px;border-radius:var(--radius);background:var(--line);overflow:hidden}
.lr-bar i{display:block;height:100%;width:0;border-radius:var(--radius);background:linear-gradient(90deg,var(--status),var(--hud-gold));box-shadow:inset 0 3px 0 rgba(255,255,255,.3);transition:width .45s cubic-bezier(.2,.7,.2,1)}
.lr-combo{display:inline-flex;align-items:center;gap:4px;font:700 .82rem var(--sans);color:#D9822B;white-space:nowrap}
.lr-combo .ico{width:18px;height:18px} .lr-combo .ico svg{width:100%;height:100%;fill:currentColor}
.lr-combo.pop{animation:lr-pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes lr-pop{from{transform:scale(.6)}}
.lr-body{flex:1;overflow:auto;padding:12px 20px 24px}
.lr-q{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-top:4vh}
.lr-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lr-label{font:600 .72rem var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lr-prompt{font:500 clamp(1.3rem,2.6vw,1.75rem)/1.35 var(--serif);margin:0}
.lr-opts{display:grid;gap:12px;margin-top:6px}
.lr-opt{display:flex;align-items:center;gap:14px;text-align:left;padding:15px 18px;border-radius:var(--radius);background:var(--surface);border:1.5px solid var(--line);font-size:1rem;line-height:1.4;color:var(--ink);transition:border-color .15s,background .15s,transform .1s}
.lr-opt:hover:not(:disabled){border-color:var(--ink)} .lr-opt:active:not(:disabled){transform:scale(.99)} .lr-opt:disabled{cursor:default}
.lr-key{flex:none;width:28px;height:28px;border-radius:var(--radius);border:1px solid var(--line);display:grid;place-items:center;font:600 .78rem var(--mono);color:var(--muted)}
.lr-opt.sel{border-color:var(--ink);background:var(--gold-soft)} .lr-opt.sel .lr-key{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.lr-opt.right{border-color:var(--ok);background:var(--ok-soft)} .lr-opt.right .lr-key{background:var(--ok);border-color:var(--ok);color:#fff}
.lr-opt.wrong{border-color:var(--bad);background:var(--bad-soft);animation:lr-shake .35s} .lr-opt.wrong .lr-key{background:var(--bad);border-color:var(--bad);color:#fff}
@keyframes lr-shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.lr-foot{border-top:1px solid var(--line);background:var(--surface);overflow:hidden}
.lr-foot-in{max-width:820px;margin:0 auto;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px}

@media (max-width:620px){.lr-hint{display:none}.lr-btn{flex:1}}
.lr-btn{min-width:180px;padding:14px 26px;border-radius:var(--radius);border:0;font:600 .95rem var(--sans);letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink)}
.lr-btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.lr-btn.ok{background:var(--ok);color:#fff} .lr-btn.bad{background:var(--bad);color:#fff}
.lr-banner{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 20px;padding:18px max(20px,calc((100% - 780px) / 2));animation:lr-up .3s cubic-bezier(.2,.7,.2,1)}
@keyframes lr-up{from{transform:translateY(100%)}}
.lr-banner.ok{background:var(--ok-soft)} .lr-banner.bad{background:var(--bad-soft)}

.lr-badge{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff}
.lr-banner.ok .lr-badge{background:var(--ok)} .lr-banner.bad .lr-badge{background:var(--bad)}
.lr-verdict strong{font:600 1.3rem var(--serif)} .lr-banner.ok strong{color:var(--ok)} .lr-banner.bad .lr-verdict strong{color:var(--bad)}
.lr-why{margin:0;font-size:.92rem} .lr-note{margin:0;font-size:.8rem;color:var(--muted)}

.lobby{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px}
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px;align-items:stretch}
@media (max-width:1180px){.duo{grid-template-columns:1fr}}
.duo>.quest,.duo>.map-wrap{height:100%}
@media (max-width:1500px){.lobby{grid-template-columns:1fr}}
.player{border-radius:var(--radius);padding:28px;background:var(--hud);border:1px solid var(--hud-line);color:var(--hud-ink);display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,320px);gap:28px;align-items:center}
@media (max-width:760px){.player{grid-template-columns:1fr;padding:22px}}
.p-left{display:flex;flex-direction:column;gap:16px;min-width:0}
.player .eyebrow{margin:0;color:var(--hud-muted);letter-spacing:.16em;text-transform:uppercase;font-size:.7rem;font-weight:600}
.player h1{color:var(--hud-ink);font-weight:500}
.player .lead{margin:0;color:#6b604f;font:400 1.02rem/1.5 var(--sans);max-width:46ch}
.p-stats{display:flex;gap:28px;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--hud-line)}
.p-stat b{display:block;font:500 1.6rem/1.1 var(--mono);color:var(--hud-ink);font-variant-numeric:tabular-nums}
.p-stat.st b{color:var(--hud-gold)}
.p-stat span{font-size:.74rem;color:var(--hud-muted);letter-spacing:.03em}
.chase{font-size:.9rem;color:#6b604f}
.chase b{color:var(--hud-gold);font-weight:600}
.p-right{display:flex;flex-direction:column;gap:10px;align-items:center;min-width:0}
.quest{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;display:flex;flex-direction:column;gap:12px}
.quest-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.quest-head h2{font-size:1.4rem}
.countdown{font:500 .78rem var(--mono);color:var(--muted)}
.countdown.risk{color:var(--bad)}
.bell{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font:500 .8rem var(--sans);color:var(--muted)}
.bell::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--line)}
.bell.live{color:var(--ink)}
.bell.live::before{background:var(--status)}
.q-steps{display:grid}
.q-step{display:grid;grid-template-columns:24px 34px 1fr auto;gap:14px;align-items:center;text-align:left;width:100%;padding:14px 6px;border:0;border-top:1px solid var(--line);background:transparent;transition:background .2s}
.q-step:first-child{border-top:0}
.q-step:hover{background:var(--gold-soft)}
.q-step .chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.72rem;color:transparent}
.q-step.done .chk{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.q-step strong{display:block;font-weight:600}
.q-step.done strong{color:var(--muted)}
.q-step span.sub{font-size:.84rem;color:var(--muted)}
.q-step .rw{font:500 .78rem var(--mono);color:var(--status);white-space:nowrap}
.q-step.done .rw{color:var(--muted)}
.chest{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--radius);border:1px solid var(--line);background:var(--bg);transition:border-color .2s,background .2s}
.chest.ready{border-color:var(--status);background:var(--status-soft);cursor:pointer}
.chest.ready:hover{border-color:var(--ink)}
.chest-ico{width:40px;height:40px;flex:none;border-radius:50%;background:radial-gradient(circle at 32% 28%,#F5DD94,#E0B85A 42%,#9B7128 78%,#7E5A1C);box-shadow:inset 0 0 0 3px rgba(0,0,0,.14),inset 0 0 0 5px rgba(255,255,255,.3)}
.chest:not(.ready):not(.opened) .chest-ico{filter:grayscale(1);opacity:.45}
.chest-ico.big{width:84px;height:84px}
.map-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.board{gap:5px}
.cell{border-radius:4px;transition:transform .2s}
.cell:hover:not(.locked){transform:scale(1.12)}
.cell.next{box-shadow:inset 0 0 0 2px var(--ink);background:var(--surface)}
.cell.locked{opacity:.5}

/* rapid fire */
.lz{max-width:720px;margin:0 auto}
.lz-hud{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}

.lz-time.low{color:var(--bad)}
.lz-score{font:600 1.05rem var(--mono);color:var(--status)}
.lz-combo{font:500 .88rem var(--sans);color:var(--muted);min-height:1.4em}

/* moments, toasts, floats */
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
.xp-float{position:fixed;z-index:21;pointer-events:none;font:600 .82rem var(--mono);color:var(--status);animation:rise 1.2s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{0%{opacity:0;transform:translateY(4px)}20%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
.modal-bg{position:fixed;inset:0;z-index:35;background:rgba(7,12,24,.6);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;animation:fade .25s ease-out}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:32px 28px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;animation:modal-in .38s cubic-bezier(.2,.7,.2,1)}

.modal .reward-amt{font:500 2.6rem/1 var(--mono);color:var(--status)}
.toast{border-radius:var(--radius);font-weight:500;background:var(--ink);color:var(--bg);box-shadow:0 10px 30px -12px rgba(0,0,0,.45);animation:fade .25s ease-out}

/* ===== Ivory finish: one light theme, black type, royal-blue liquid glass on everything you can press ===== */
:root{color-scheme:light}
/* panels that used to be navy */
.client-q,.desk-head,.story-card.featured,.pf-hero{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.story-card.featured{border-color:var(--line);min-height:0}
.story-card.featured .muted,.story-card.featured .src{color:var(--muted)} .story-card.featured .meta{color:var(--hud-muted)}
.feat-facts{margin:2px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.feat-facts li{position:relative;padding-left:16px;font-size:.92rem;line-height:1.5;color:var(--ink)}
.feat-facts li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--status)}
.feat-more{font:600 .86rem var(--sans);color:var(--ink);text-decoration:underline;text-underline-offset:3px}
/* side-by-side panels size to their own content instead of stretching to the taller neighbour */
.desk-top,.split,.duo{align-items:start}
.pair-scroll{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(20,20,20,.28) transparent}
.pair-scroll::-webkit-scrollbar{width:8px} .pair-scroll::-webkit-scrollbar-thumb{background:rgba(20,20,20,.22);border-radius:var(--radius);border:2px solid transparent;background-clip:padding-box}
.feature-col.pair-scroll .story-card.featured{min-height:0}
.feature-col{display:flex;flex-direction:column} .feature-col>.story-card.featured{flex:1 0 auto}
.feat-tag{padding:1px 8px;border-radius:var(--radius);border:1px solid rgba(var(--gold-rgb),.45);background:rgba(var(--gold-rgb),.08);color:var(--ink);font:600 .64rem var(--sans);letter-spacing:.12em;text-transform:uppercase}
.brief ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:14px}
.brief ol li::marker{font:600 .9rem var(--serif);color:var(--muted)}
.brief li .linkish{display:block;text-align:left;font-weight:600;line-height:1.4}
.brief li p{margin:4px 0 0;font-size:.88rem;line-height:1.5}
.duo>.quest,.duo>.map-wrap{height:auto}
.player{background:var(--surface);border:1px solid var(--line);box-shadow:0 18px 40px -32px rgba(20,20,20,.35)}
.player .lead,.chase{color:var(--muted)}
.side .nav button:hover{color:var(--ink)}
.side .nav button[aria-current="page"]{background:rgba(var(--gold-rgb),.10);color:var(--ink);box-shadow:inset 2px 0 0 var(--gold)}
.xpbar{background:var(--empty)}
#lang{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:rgba(var(--gold-rgb),.14);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(var(--gold-rgb),.5)}
/* status card */
.status-card{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:0 16px 32px -26px rgba(20,20,20,.35)}
.sc-top,.sc-tier small,.sc-stats span{color:var(--muted)} .sc-tier b{color:var(--ink)}
.sc-stats{border-top-color:var(--line)} .sc-stats>div+div{border-left-color:var(--line)}
.sc-stats b{color:var(--status)}
.status-card .tc-bar{background:var(--empty)} .status-card .tc-bar i{background:var(--status)}
/* sign-in */
.gate-side{background:linear-gradient(160deg,#E3EEF9,#D3E3F3);color:#141414}
.gate-side::before{background:repeating-linear-gradient(135deg,rgba(20,20,20,.03) 0 1px,transparent 1px 14px)}
.gs-body h1,.g-head{color:#141414} .gs-lead,.gs-points li{color:#3D3D3D} .gs-foot{color:#6B6B6B}
.gs-eyebrow{color:var(--status)} .gs-mark{color:var(--status);border-color:rgba(160,122,44,.5)} .gs-points li::before{background:var(--status)}
.g-field input{color:#141414} .g-field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(var(--gold-rgb),.18)}
.g-link{color:#141414} .g-check input{accent-color:var(--gold)}

/* ===== UpperCrust design system — brand layer =====
   Premium, calm, finance-grade: cream and paper surfaces, deep gold as the one accent, warm near-black type.
   Every colour, font, radius and shadow below comes from the tokens at the top of this stylesheet. */
html{background:var(--bg)}
body{font-family:var(--font-sans);color:var(--ink)}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}

/* type: Playfair only for large headings and lesson titles; DM Sans for everything else; DM Mono for numbers and data */

h3,h4{font-family:var(--font-sans)} h3{font-weight:600;letter-spacing:0}

<script>/* ===== content/phases.js — phase map ===== */
const PHASES = [
  { id: "ind", name: "MF industry & investor behaviour", color: "var(--ph1)", from: 1, to: 15 },
  { id: "eco", name: "Indian economy & markets", color: "var(--ph2)", from: 16, to: 30 },
  { id: "def", name: "Defence & manufacturing", color: "var(--ph3)", from: 31, to: 45 },
  { id: "gold", name: "Gold & Silver", color: "var(--ph4)", from: 46, to: 60 },
  { id: "multi", name: "Multi-asset & allocation", color: "var(--ph5)", from: 61, to: 75 },
  { id: "funds", name: "UpperCrust funds & client conversations", color: "var(--ph6)", from: 76, to: 90 }
];
const DATA_AS_OF = "Verified data as of 13 Oct 2026 (AMFI Sep 2026, MoSPI CPI Sep 2026, RBI 7 Oct 2026, NSE, MoD FY26, WGC Q2 2026)";

/* ===== content/topics.js — tag vocabulary linking lessons, questions, news and client scenarios ===== */
const TOPICS = {
  "mf-industry": "MF industry", flows: "Fund flows", behaviour: "Investor behaviour", sip: "SIP & systematic investing",
  costs: "Costs & plans", regulation: "SEBI & regulation", products: "Products & categories", tax: "Taxation",
  returns: "Reading returns", economy: "Economy & GDP", inflation: "Inflation", rates: "Interest rates & RBI",
  debt: "Debt funds", equity: "Equity markets", global: "Global & FPIs", defence: "Defence & manufacturing",
  gold: "Gold", silver: "Silver", "multi-asset": "Multi-asset", allocation: "Asset allocation",
  risk: "Risk & suitability", communication: "Client communication"
};
const QTYPES = ["Market interpretation", "Industry awareness", "Client communication", "Misconception detection", "Scenario analysis",
  "Data interpretation", "Product understanding", "Risk awareness", "Current affairs", "Communication judgment"];
/* Builders keep content files compact. Question: answer = index of the correct option; wrong[i] = misconception behind option i (null for the answer). */
const Q = (id, tags, types, prompt, options, answer, why, wrong, big, client, remember, follow) =>
  ({ id, tags, types, prompt, options, answer, why, wrong, big, client, remember, follow: follow || null });
const F = (prompt, options, answer, why) => ({ prompt, options, answer, why });
const L = (n, tags, title, story, concept, client, qs, talk, remember) => ({ n, tags, title, story, concept, client, qs, talk, remember, deep: true });
const S = (headline, paras, src, url, date) => ({ headline, paras, src, url, date });

/* ===== content/p1a.js — Phase 1 deep lessons, Days 1–5 ===== */
const P1A = [
L(1, ["mf-industry", "flows", "returns"], "Industry growth is not the same as investor returns",
 S("September 2026: industry AUM fell 5.1% — while SIPs and equity inflows hit new highs",
  ["AMFI's September 2026 data showed total mutual fund AUM falling to ₹82.64 lakh crore from ₹87.08 lakh crore in August — a drop of about 5.1% in one month.",
   "In the same month, monthly SIP contributions reached a record ₹32,490 crore and equity funds received ₹38,307 crore of net inflows — about 31% more than August.",
   "How can assets fall while money keeps coming in? Because AUM moves for two separate reasons: money flowing in or out, and the market value of what funds already hold. In September the Nifty fell about 6% and debt funds saw quarter-end outflows of roughly ₹1.83 lakh crore. Market losses and corporate withdrawals outweighed record retail inflows."],
  "AMFI monthly data (via Zee Business / The Hans India)", "https://www.amfiindia.com/research-information/amfi-monthly", "12 Oct 2026"),
 ["AUM (assets under management) is a stock, not a flow. It is the market value of everything the industry holds on a given date.",
  "AUM changes because of (1) net flows — new money in minus redemptions — and (2) mark-to-market — the rise or fall in the value of existing holdings. A 6% market fall on ₹40 lakh crore of equity assets removes about ₹2.4 lakh crore of AUM without a single investor redeeming.",
  "Neither number tells you what an individual investor earned. Investor returns depend on which funds they hold, when they invested, and how long they stayed. Industry AUM can grow strongly in years when many recent investors are sitting on losses, and fall in months when long-term investors remain well ahead.",
  "For an RM, the useful reading is behavioural: record SIPs during a falling month means Indian investors are staying disciplined. That is a story about investor behaviour, not about returns."],
 { quote: "\"I read that mutual fund assets fell by more than ₹4 lakh crore last month. Are people pulling their money out? Should I?\"",
   context: "A salaried client with a 3-year-old SIP. Her portfolio is down about 4% this year." },
 [Q("d1q1", ["mf-industry", "returns"], [4, 6], "Industry AUM has grown many times over the last decade. A client concludes: \"If industry AUM is growing this fast, mutual fund investors must be earning excellent returns.\" What is the most important distinction to explain?",
   ["Rising AUM always indicates superior fund performance.",
    "Industry AUM grows through both market appreciation and net inflows, so industry growth alone says nothing about the returns a particular investor earned.",
    "Industry AUM is driven entirely by SIP contributions.",
    "Growing AUM means mutual funds are becoming less risky."], 1,
   "AUM is the combined result of money coming in and market movements on money already invested. A year of heavy inflows can push AUM up even if many investors who joined that year are sitting on losses. Returns are an investor-level outcome: which fund, when they invested, how long they stayed.",
   ["Performance is only one driver of AUM. Large inflows can lift AUM even when performance is poor, and strong funds can shrink if investors redeem.",
    null,
    "SIPs are important (about ₹32,490 crore a month), but lump sums, NFOs, corporate money in liquid funds and market movements all move AUM too. Debt funds alone saw ₹1.83 lakh crore of outflows in September 2026.",
    "Size does not reduce risk. A ₹80 lakh crore industry still holds equities and bonds whose prices fall in bad markets — September 2026 showed exactly that."],
   "Industry growth reflects financialisation of savings — more households using mutual funds. That is a structural trend. Investor outcomes are personal and depend on behaviour, timing and holding period.",
   "\"The industry growing tells us more Indians trust mutual funds. Your returns depend on your funds and how long you stay invested — let's look at your actual portfolio.\"",
   "AUM is a size number, not a return number.",
   F("A fund's AUM grew 40% last year. What is the best first question to ask before assuming it performed well?",
    ["How much of the growth came from new inflows versus market gains?", "Who is the fund manager's employer?", "Is the NAV above ₹100?", "Did the fund launch an NFO?"], 0,
    "Separating flows from performance is the first step. Strong inflows can mask average performance.")),
  Q("d1q2", ["flows", "mf-industry"], [6, 1], "In September 2026, industry AUM fell about 5.1%, yet SIP contributions hit a record ₹32,490 crore and equity inflows rose about 31%. What can reasonably be concluded?",
   ["Investors were exiting mutual funds in panic.",
    "Retail investors kept investing while market declines and debt-fund outflows reduced the value of total assets.",
    "SIP data must be wrong because AUM cannot fall when inflows rise.",
    "Equity funds performed better in September than in August."], 1,
   "The two numbers measure different things. Record SIPs and higher equity inflows show investors stayed disciplined. The fall in AUM came from the Nifty's roughly 6% decline and about ₹1.83 lakh crore of debt outflows, mostly from liquid and money-market funds at quarter-end.",
   ["The flow data shows the opposite: equity investors added more money, not less.",
    null,
    "AUM can fall with positive inflows whenever market losses or outflows elsewhere are larger. There is no contradiction.",
    "Higher inflows say nothing about returns. In fact markets fell in September, so most equity funds had negative returns for the month."],
   "Reading flows and AUM together tells you about investor behaviour. In earlier decades, falling markets triggered heavy redemptions. Now domestic SIP money tends to keep flowing, which helps cushion markets when foreign investors sell.",
   "\"Last month's fall in industry assets was mostly market movement and companies moving short-term cash. Ordinary investors actually put in record amounts — just like you.\"",
   "When AUM falls, ask: was it flows or was it prices?"),
  Q("d1q3", ["communication", "behaviour"], [10, 2], "Your client from the story asks whether she should withdraw because \"industry assets fell by ₹4 lakh crore\". Which response is most accurate and helpful?",
   ["\"Don't worry, markets always bounce back within a few months.\"",
    "\"That fall was mostly falling market prices and companies moving short-term cash. Retail investors actually invested a record amount. Your SIP is for a goal three-plus years away, so let's check it still fits that goal rather than react to an industry number.\"",
    "\"Yes, it may be wise to pause until assets start rising again.\"",
    "\"Industry numbers are irrelevant and you should ignore all news.\""], 1,
   "It corrects the misreading with facts, gives context she can understand, and redirects the decision to her own goal and horizon — without promising a rebound.",
   ["It is reassuring but makes a timing promise nobody can keep. Recoveries can take months or years.",
    null,
    "Pausing based on an industry aggregate confuses the industry's size with her own situation, and risks missing recovery.",
    "Dismissing news entirely sounds evasive. Clients trust RMs who explain the news, not those who brush it off."],
   "Good communication separates three things: what happened, what it means, and what it means for this client. Most client anxiety comes from mixing them up.",
   "Explain the number, then bring the conversation back to the client's own goal and time horizon.",
   "Correct the misunderstanding, then return to the client's plan.")],
 "\"When industry assets fall, it's usually because prices fell, not because people left. In September, Indians put a record ₹32,490 crore into SIPs. The question for you isn't what the industry did — it's whether your plan still fits your goal.\"",
 ["AUM = money flows + market movement. It is not a measure of returns.", "Record SIPs in a falling month signal disciplined investors, not panic.", "Always move from the industry number to the client's own plan."]),

L(2, ["sip", "behaviour", "returns"], "What an SIP does — and what it cannot promise",
 S("SIP book keeps growing even as markets correct",
  ["Contributing SIP accounts stood at about 10.06 crore in September 2026, and SIP assets were ₹17.86 lakh crore — around 21.6% of industry AUM.",
   "At the same time, the Nifty 50 was down about 13% for calendar 2026 by the end of September and roughly 14% below its 52-week high. Mid-cap indices fell more than the Nifty in September.",
   "This means many SIPs started in the last 12–24 months currently show negative returns — a normal outcome that RMs need to explain well."],
  "AMFI September 2026 data; NSE index data via 5paisa/Navia", "https://www.amfiindia.com/research-information/amfi-monthly", "12 Oct 2026"),
 ["An SIP is a method of investing, not a product with its own return. The returns come entirely from the fund it invests in.",
  "What an SIP does well: it removes the need to time entry, builds a habit, and averages the purchase cost across market levels (rupee cost averaging). In a falling market, the same instalment buys more units.",
  "What an SIP cannot do: it cannot prevent losses when markets fall, and it does not guarantee a profit over any fixed period. A two-year-old SIP invested mostly at higher prices will show a loss if markets are 13% lower today.",
  "SIP returns are measured with XIRR because each instalment is invested on a different date. Comparing an SIP's XIRR to a fund's 1-year point-to-point return gives a misleading picture."],
 { quote: "\"My SIP has been running for two years, but my portfolio return is negative. Was starting an SIP a mistake?\"",
   context: "Client started a ₹15,000 monthly SIP in a flexi-cap fund in late 2024 for his daughter's education in 2034." },
 [Q("d2q1", ["sip", "communication"], [5, 10], "The client above asks whether starting his SIP was a mistake. Which response shows the best understanding?",
   ["\"SIPs never lose money over the long run, so this is temporary.\"",
    "\"An SIP spreads your buying across market levels, but it can't stop losses when the market falls. Most of your instalments were invested at higher prices, so you're showing a loss today. Your goal is in 2034, and the instalments you're buying now are at lower prices. Let's check the fund still suits that goal rather than judge it on two years.\"",
    "\"You should switch to a fund that has performed better in the last year.\"",
    "\"Stop the SIP until markets recover, then restart.\""], 1,
   "It is honest about what SIPs can and cannot do, explains why the return is negative in plain language, links back to his 2034 goal, and suggests a sensible review instead of a reaction.",
   ["No investment method guarantees long-run gains. 'Never' is a promise you cannot keep and could be treated as misselling.",
    null,
    "Switching based on one-year returns is performance chasing. It may trigger exit loads and tax, and last year's leader is often not next year's.",
    "Stopping means he stops buying at lower prices — the exact moment rupee cost averaging works in his favour."],
   "Two years is short relative to equity market cycles. Indian equities have had multi-year flat or negative stretches. That's why SIPs are matched to goals with long horizons.",
   "Never defend an SIP with a guarantee. Defend it with its logic and the client's own timeline.",
   "An SIP manages timing risk. It does not remove market risk.",
   F("Same client, but his daughter's education is due in 18 months. What changes?", ["The conversation should shift to protecting the goal — gradually moving money to lower-volatility options, as per a suitability review.", "Nothing; he should keep the equity SIP unchanged.", "He should increase equity to recover losses faster.", "He should stop all investments."], 0,
    "When the goal is near, the priority shifts from growth to certainty. Horizon changes the advice.")),
  Q("d2q2", ["sip", "returns"], [6, 4], "A fund shows a 1-year return of −9%. Your client's SIP in the same fund shows an XIRR of −4% over the same year. What best explains the difference?",
   ["The AMC calculated one of the numbers incorrectly.",
    "The SIP's instalments were invested at different prices through the year, so its experience differs from a single lump sum invested a year ago.",
    "SIPs always outperform lump sums.",
    "XIRR ignores market movements."], 1,
   "A 1-year return assumes one investment a year ago. An SIP invests every month — some at higher prices, some lower — so its return reflects the average cost of all instalments. In a falling year, later instalments buy cheaper and soften the loss.",
   ["Both numbers can be right. They answer different questions.",
    null,
    "In a steadily rising market, a lump sum invested at the start usually beats an SIP. SIPs reduce timing risk; they don't always win.",
    "XIRR fully includes market movements. It simply accounts for when each rupee was invested."],
   "Different return measures answer different questions: point-to-point (what a lump sum earned), XIRR (what a series of cash flows earned), rolling returns (how consistent the fund has been).",
   "\"The fund's published return assumes one investment a year ago. Yours were spread across the year, so your number is different — and in a falling year, often a bit better.\"",
   "Always compare an SIP using XIRR, not the fund's point-to-point return."),
  Q("d2q3", ["sip", "risk"], [8, 4], "Which statement about SIPs could mislead a client?",
   ["\"An SIP helps you avoid investing everything at a market peak.\"",
    "\"Continuing during falls buys more units at lower prices.\"",
    "\"If you continue an SIP for five years, you will definitely make a profit.\"",
    "\"An SIP's returns depend on the fund it invests in.\""], 2,
   "No horizon guarantees a profit in market-linked investments. Long horizons improve the odds historically, but 'definitely' turns a probability into a promise. That is both inaccurate and against the distributor code of conduct.",
   ["This is accurate. Spreading purchases avoids putting all money in at one level.",
    "Accurate. This is the core mechanism of rupee cost averaging.",
    null,
    "Accurate. An SIP is a method; its outcome comes from the underlying fund."],
   "Clients remember promises more than caveats. One 'definitely' can undo years of trust if markets disappoint.",
   "Say \"historically, longer periods have improved the odds\" — never \"definitely\".",
   "Probabilities, not promises.")],
 "\"An SIP doesn't stop the market from falling. What it does is keep you buying when prices are lower, so you don't have to guess the right time. Two years is early for a goal that's eight years away.\"",
 ["An SIP is a method, not a product — returns come from the fund.", "Use XIRR for SIPs; don't compare with point-to-point returns.", "Never promise that time guarantees a profit."]),

L(3, ["behaviour", "flows", "risk"], "Chasing performance: what flows tell you about investor behaviour",
 S("Small-cap funds top inflows for a third straight month",
  ["Small-cap funds attracted ₹9,039 crore of net inflows in September 2026, the highest among equity categories for the third consecutive month. Mid-caps took ₹7,835 crore and flexi-caps ₹6,702 crore.",
   "Meanwhile, the Nifty Midcap 100 fell about 7.6% in September and the Nifty Smallcap 100 about 3.4%.",
   "Some of this is investors buying a dip with long horizons. Some may be investors still anchored to small caps' strong returns of earlier years. RMs need to tell the difference client by client."],
  "AMFI September 2026 data via Upstox; NSE indices via Navia", "https://www.amfiindia.com/research-information/amfi-monthly", "12 Oct 2026"),
 ["Performance chasing means buying what has recently done well and selling what has recently done poorly. It feels sensible because recent returns are vivid, but it often means buying after much of the gain has happened.",
  "The 'behaviour gap' is the difference between a fund's return and the average return investors in it actually earn. It is usually negative, because money tends to arrive after good years and leave after bad ones.",
  "Category flows are a sentiment indicator. Heavy flows into a category tell you what investors want; they don't tell you whether it suits a particular client.",
  "The RM's role is not to forecast which category will win, but to make sure each client's allocation matches their risk tolerance and horizon — so they can stay invested through the bad stretches."],
 { quote: "\"My friend made 40% in small caps a couple of years ago. I want to move most of my money there now.\"",
   context: "A 52-year-old client, moderate risk profile, retiring in 6 years, currently 60% equity." },
 [Q("d3q1", ["behaviour", "risk", "communication"], [5, 8], "How should you respond to the client above?",
   ["Move the money — small caps have the highest long-term returns.",
    "Explain that small caps can deliver high returns but also deep, long falls; that a friend's past gain doesn't indicate future returns; and that with retirement in six years and a moderate profile, a large shift would increase the chance of a big loss close to the goal. Discuss whether a small, defined allocation fits instead.",
    "Refuse to discuss small caps at all.",
    "Tell him small caps are guaranteed to fall from here."], 1,
   "It respects his interest, corrects the anchoring on a friend's past result, and ties the decision to his horizon and risk profile. It leaves room for a suitable, limited allocation rather than a blanket no.",
   ["High long-term averages come with large drawdowns. For someone six years from retirement, the timing of a fall matters more than the long-run average.",
    null,
    "Refusing to engage pushes the client to act alone. Suitability conversations work better than shutdowns.",
    "Nobody can guarantee a fall. Replacing one prediction with another doesn't help the client."],
   "Recency bias and social proof drive most performance chasing. Distributors add value by slowing the decision down and anchoring it to the client's plan.",
   "\"Small caps can do very well, but they can also fall 30–40% and take years to recover. With six years to retirement, let's decide how much of that risk you can afford — not how much your friend made.\"",
   "Past returns attract money; suitability should decide it."),
  Q("d3q2", ["flows", "behaviour"], [6, 4], "Small-cap funds received the highest inflows for three straight months while small-cap indices were volatile. What can you reasonably conclude from the flow data alone?",
   ["Small caps will outperform next year.",
    "Investor demand for small caps is strong right now; the data doesn't tell you whether the timing is good or whether it suits any specific investor.",
    "Fund managers are buying small caps because they expect a rally.",
    "Small-cap funds are now less risky because they are popular."], 1,
   "Flow data measures investor demand. It is useful context, but it is not a forecast and not a suitability test.",
   ["Flows don't predict returns. Heavy flows have historically sometimes come near peaks.",
    null,
    "Flows into a category are investors' decisions. Fund managers must invest that money within the scheme's mandate regardless of their market view.",
    "Popularity doesn't reduce volatility. Large inflows into less liquid stocks can even increase risk if flows reverse."],
   "SEBI requires AMCs to publish stress tests for small and mid-cap funds — how long it would take to sell a portion of the portfolio. Heavy inflows into small, less-liquid stocks are one reason.",
   "Use flows to understand what clients are hearing about, not to decide what they should buy.",
   "Flows show sentiment, not value."),
  Q("d3q3", ["behaviour", "returns"], [4, 6], "A fund delivered 14% a year over 10 years, but the average investor in it earned about 8% a year. What is the most likely explanation?",
   ["The fund published incorrect numbers.",
    "Investors tended to invest after strong periods and redeem after weak ones, so their money missed much of the fund's best stretches.",
    "Investors paid more tax than the fund.",
    "Small investors always earn less than large investors."], 1,
   "This is the behaviour gap. The fund's return assumes money stayed invested throughout. Real investors moved in and out, often at the wrong times.",
   ["Both numbers can be correct; they measure different things.",
    null,
    "Tax affects post-tax returns, but a gap this size usually comes from timing of entries and exits.",
    "Ticket size doesn't determine returns. Behaviour does."],
   "This is where RMs earn their trail: helping clients stay invested is often worth more than picking the 'best' fund.",
   "\"The fund's return only counts if you're there for it. My job is to help you stay for the good years by not leaving in the bad ones.\"",
   "Behaviour can cost more than fees.")],
 "\"Everyone wants what did well last year. The real question is whether you can live with the bad years that come with it. Let's size it so you can.\"",
 ["Category inflows measure sentiment, not future returns.", "The behaviour gap is usually bigger than the cost gap.", "Anchor every 'hot category' request to horizon and risk profile."]),

L(4, ["flows", "debt", "mf-industry"], "Reading flow headlines: the quarter-end debt outflow",
 S("Debt funds lose about ₹1.83 lakh crore in September — liquid funds lead",
  ["Debt schemes saw net outflows of about ₹1.83 lakh crore in September 2026. Liquid funds accounted for about ₹95,743 crore of this and money-market funds about ₹50,846 crore.",
   "September is a quarter-end month. Companies withdraw short-term cash parked in liquid funds to pay advance tax (due mid-September) and meet quarter-end obligations. Similar outflows usually appear in June, September, December and March.",
   "Much of this money typically returns in the following weeks."],
  "AMFI September 2026 data via Upstox / Equentis", "https://www.amfiindia.com/research-information/amfi-monthly", "12 Oct 2026"),
 ["Liquid and money-market funds are used heavily by companies and treasuries as an alternative to current accounts. Their flows follow corporate cash cycles, not retail sentiment.",
  "Advance tax instalments fall on 15 June, 15 September, 15 December and 15 March. Big redemptions around these dates are routine.",
  "A headline like 'mutual funds see ₹1.83 lakh crore outflow' combines very different investors. Retail equity investors actually added money in the same month.",
  "For RMs, the skill is decomposing a headline: which category, which type of investor, and is it seasonal?"],
 { quote: "\"I saw that mutual funds had a huge outflow last month. Is something wrong with debt funds? I have money in a liquid fund.\"",
   context: "A business-owner client keeps ₹25 lakh in a liquid fund as working capital." },
 [Q("d4q1", ["flows", "debt"], [6, 1], "Why do liquid funds often see very large outflows in September?",
   ["Retail investors panic about rising interest rates.",
    "Companies withdraw short-term cash for advance tax and quarter-end needs.",
    "SEBI forces liquid funds to return money every quarter.",
    "Liquid funds lose money every September."], 1,
   "Liquid funds are a parking place for corporate cash. Mid-September advance tax and quarter-end payments pull that cash out, and it typically returns afterwards.",
   ["Retail investors are a small part of liquid-fund assets, and the pattern repeats every quarter regardless of rates.",
    null,
    "There is no such rule. Redemptions are investor decisions.",
    "Outflows are not losses. The fund's NAV is not affected by other investors redeeming."],
   "Understanding who owns which category helps you read every flow headline correctly. Debt categories are dominated by institutional money; equity categories by individuals.",
   "\"That outflow is mostly companies paying quarterly tax. It happens every quarter and doesn't affect your fund's value.\"",
   "Big debt outflows in quarter-end months are usually a calendar effect."),
  Q("d4q2", ["flows", "communication"], [10, 2], "Your business-owner client is worried about the outflow headline. What is the most accurate response?",
   ["\"Liquid funds are completely risk-free, so nothing can go wrong.\"",
    "\"Those outflows are mostly companies drawing cash for advance tax — it's a regular quarterly pattern and doesn't change the value of your units. Liquid funds do carry some credit and interest-rate risk, which is why we chose one with high-quality, very short-maturity holdings.\"",
    "\"You should move your money to a bank FD immediately.\"",
    "\"Outflows mean the fund is about to close.\""], 1,
   "It explains the cause, removes the misunderstanding, and stays honest that 'low risk' is not 'no risk'.",
   ["No mutual fund is risk-free. Liquid funds carry low but real credit and liquidity risk.",
    null,
    "Moving based on a misread headline adds friction and may not suit his working-capital needs.",
    "Funds do not close because of seasonal outflows."],
   "Honesty about small risks builds more trust than overstated safety.",
   "Low risk is not no risk — say so even when reassuring.",
   "Explain the cause, then be honest about the real risk."),
  Q("d4q3", ["flows", "mf-industry"], [4, 6], "A newspaper headline reads: \"Mutual funds see record outflows.\" What should you check first before discussing it with clients?",
   ["Which categories and which types of investors the outflows came from, and whether the timing is seasonal.",
    "Whether the Sensex rose that day.",
    "Which AMC had the largest advertisement that month.",
    "Nothing — record outflows are always bad news."], 0,
   "Total flows combine very different money. Equity, debt, ETFs and corporate cash behave differently. Breaking the headline down tells you whether there's a real story for your clients.",
   [null,
    "A single day's index move doesn't explain monthly category flows.",
    "Advertising has nothing to do with the flow data.",
    "Seasonal debt outflows are routine; they can coexist with strong retail equity inflows."],
   "AMFI publishes category-wise data around the 10th of each month. Reading two levels below the headline is a habit worth building.",
   "Never repeat a headline to a client before you've looked one level deeper.",
   "Headline totals hide the story; categories reveal it.")],
 "\"Those big outflows are mostly companies drawing their quarterly tax money out of liquid funds — it happens every quarter. Individual investors actually put in more money last month.\"",
 ["Debt flows follow corporate cash cycles.", "Advance tax dates drive quarter-end liquid fund outflows.", "Break every flow headline into category and investor type."]),

L(5, ["costs", "regulation", "communication"], "Costs, direct vs regular, and SEBI's 2026 rules",
 S("SEBI's new MF Regulations unbundle fund costs",
  ["The SEBI (Mutual Funds) Regulations, 2026, notified on 14 January 2026 and effective from 1 April 2026, replaced the 1996 regulations. A consolidated master circular followed on 20 March 2026.",
   "The expense ratio is now presented as a Base Expense Ratio (BER) — the cost of managing and distributing the fund — plus brokerage and statutory or regulatory levies charged at actuals. Brokerage caps were cut to 6 basis points for cash-market trades and 2 basis points for derivatives.",
   "The distinction between direct and regular plans remains. Regular plans include distribution costs within the BER."],
  "SEBI (Mutual Funds) Regulations 2026; Moneylife; Wright Research", "https://www.sebi.gov.in/legal/regulations.html", "14 Jan 2026 (effective 1 Apr 2026)"),
 ["A fund's costs are deducted daily from its NAV. The investor never writes a cheque for them, which is why they're easy to overlook.",
  "Direct plans exclude distribution costs; regular plans include the distributor's trail commission. The underlying portfolio is identical, so the return difference roughly equals the cost difference each year.",
  "The honest case for a regular plan is the value of advice and service: goal planning, suitability, behaviour coaching in falls, rebalancing, documentation, nominations, consolidation. If a client doesn't need that, a direct plan may suit them.",
  "Cost differences compound. But switching from regular to direct is a redemption: it can trigger capital gains tax and exit loads. Switching for a small annual saving can cost more than it saves."],
 { quote: "\"My colleague says direct plans are cheaper. Should I choose a direct plan instead of a regular plan?\"",
   context: "Client has ₹18 lakh across five funds with you, all regular plans, invested over four years." },
 [Q("d5q1", ["costs", "communication"], [10, 3], "How should you answer the client above?",
   ["\"Direct plans are riskier, so stay in regular.\"",
    "\"Your colleague is right that direct plans cost less — the portfolio is the same, but regular plans include my service. The question is whether you value the planning, reviews and support I provide. If you'd like to switch, we should also check the tax and exit loads, because switching counts as selling.\"",
    "\"Direct plans don't exist for these funds.\"",
    "\"Regular plans always give higher returns.\""], 1,
   "It's honest about cost, explains what the client gets for it, respects their choice, and flags the practical cost of switching. Honesty here strengthens the relationship.",
   ["Direct and regular plans hold the same portfolio and carry the same risk. Claiming otherwise is misleading.",
    null,
    "Almost every scheme offers both plans. This is simply untrue.",
