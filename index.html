"fq-ma4": ["इन रिपोर्टों में तीनों मल्टी-एसेट फंड्स के बेंचमार्क बहुत अलग हैं: BSE 500 TRI (SBI), NIFTY 500 TRI (DSP) और CRISIL Short Term Bond Index (Edelweiss)। इनमें से चुनने के लिए 'क्या बेंचमार्क को हराया?' काफ़ी क्यों नहीं है?", ["क्योंकि बेंचमार्क का जोखिम बहुत अलग है — एक इक्विटी इंडेक्स, एक शॉर्ट-टर्म बॉन्ड इंडेक्स — इसलिए हर एक को हराने का अर्थ अलग है। फंड्स की आपस में और कैटेगरी से तुलना करें, एलोकेशन और जोखिम भी देखें।", "क्योंकि हाइब्रिड फंड्स के लिए बेंचमार्क कभी मायने नहीं रखते।", "क्योंकि सबसे कठिन बेंचमार्क वाला फंड हमेशा सबसे अच्छा होता है।", "क्योंकि तीनों बेंचमार्क एक जैसे हैं।"]],
"fq-ma5": ["SBI मल्टी एसेट के डेट की यील्ड 7.73% है और उसमें 16.71% AA-रेटेड पेपर है; Edelweiss की यील्ड 7.42% है और लगभग सब AAA या सॉवरेन है। मुख्य समझौता क्या है?", ["SBI की ऊँची यील्ड कुछ हद तक ज़्यादा क्रेडिट जोखिम लेने से आती है; Edelweiss की कम यील्ड के साथ क्रेडिट गुणवत्ता ऊँची है।", "ऊँची यील्ड का मतलब हमेशा बेहतर फंड।", "AA बॉन्ड में AAA से ज़्यादा जोखिम नहीं होता।", "यील्ड टू मैच्योरिटी फंड का पक्का रिटर्न है।"]],
"fq-ma6": ["DSP मल्टी एसेट का एक क्लाइंट पूछता है: \"मेरे भारतीय फंड में NVIDIA क्यों है?\" सबसे अच्छा जवाब क्या है?", ["\"आपका फंड एक हिस्सा विदेश में निवेश कर सकता है, जिससे आपका पैसा ऐसे देशों और सेक्टरों में फैलता है जो भारत में नहीं मिलते। इसमें मुद्रा का असर भी आता है — कमज़ोर रुपया मदद करता है, मज़बूत रुपया नुकसान।\"", "\"यह फंड की गलती होगी।\"", "\"विदेशी शेयर जोखिम-मुक्त हैं।\"", "\"हर भारतीय फंड में NVIDIA होता है।\""]],
"fq-ma7": ["रेगुलर प्लान एक्सपेंस रेशियो: Edelweiss 1.13%, SBI 1.42%, DSP 1.59%। क्लाइंट कहता है, \"बस सबसे सस्ता चुन लीजिए।\" आपको क्या जोड़ना चाहिए?", ["लागत मायने रखती है, पर ये फंड अलग तरह से बने हैं — Edelweiss आधे से ज़्यादा डेट में, DSP में ज़्यादा इक्विटी और विदेशी एसेट — इसलिए पहले क्लाइंट के अनुकूल मिश्रण चुनें, फिर मिलते-जुलते विकल्पों में लागत की तुलना करें।", "रणनीति कुछ भी हो, हमेशा सबसे सस्ता फंड चुनें।", "एक्सपेंस रेशियो का रिटर्न पर असर नहीं होता।", "सबसे महँगा फंड हमेशा सबसे अच्छा करता है।"]],
"fq-ma8": ["क्लाइंट मल्टी-एसेट फंड में पैसा लगाना चाहता है, पर 6 महीने में ज़रूरत पड़ सकती है। SBI का एग्ज़िट लोड 1%, Edelweiss का 0.25%, DSP का 0% है। सही सलाह क्या है?", ["मल्टी-एसेट फंड 6 महीने के पैसे के लिए नहीं बना क्योंकि इसका इक्विटी हिस्सा गिर सकता है; और जल्दी निकालने पर एग्ज़िट लोड भी लग सकता है। छोटी अवधि का पैसा लिक्विड जैसे फंड के लिए उपयुक्त है।", "DSP चुनें क्योंकि उसमें एग्ज़िट लोड नहीं है।", "एक साल के अंदर एग्ज़िट लोड नहीं लगता।", "मल्टी-एसेट फंड की वैल्यू गिर नहीं सकती।"]],
"fq-d1": ["30 सितंबर 2026 को Motilal Oswal Nifty India Defence Index Fund में BEL 19.97% और HAL 19.68% था; इंडेक्स वेटेज 19.95% और 19.67% थे। यह क्या दिखाता है?", ["इंडेक्स फंड अपने इंडेक्स की बारीकी से नकल करता है; छोटे अंतर नकद, समय और ट्रैकिंग एरर से आते हैं।", "फंड मैनेजर ने रिसर्च के आधार पर ये वेटेज चुने।", "फंड ज़्यादा BEL ख़रीदकर इंडेक्स को हरा रहा है।", "इंडेक्स फंड कोई भी शेयर रख सकते हैं।"]],
"fq-d2": ["HDFC Defence Fund में Eicher Motors (4.67%) और Bosch (4.1%) हैं — जो Nifty India Defence इंडेक्स के बड़े घटकों में नहीं हैं। क्यों?", ["यह 'डिफेंस और सहायक' मैंडेट वाला एक्टिवली मैनेज्ड थीमैटिक फंड है, इसलिए मैनेजर संबंधित कंपनियाँ शामिल कर सकते हैं — इसलिए इसका रिटर्न इंडेक्स से दोनों दिशाओं में अलग हो सकता है।", "फंड ने अपना मैंडेट तोड़ा है।", "Eicher और Bosch भारत की सबसे बड़ी डिफेंस कंपनियाँ हैं।", "इंडेक्स फंड और एक्टिव फंड में हमेशा एक जैसे शेयर होते हैं।"]],
"fq-d3": ["क्लाइंट Motilal Oswal Defence Index Fund (एक्सपेंस रेशियो 1.12%) और HDFC Defence Fund (1.79%; 3 साल का रिटर्न सालाना 34.36%, 52 में पहला) में से चुन रहा है। सबसे संतुलित व्याख्या क्या है?", ["एक कम लागत पर इंडेक्स का एक्सपोज़र देता है; दूसरा ज़्यादा लागत पर मैनेजर के चुनाव पर निर्भर है। HDFC का मज़बूत पिछला रिकॉर्ड सच है, पर भविष्य में बेहतर प्रदर्शन की गारंटी नहीं। दोनों केंद्रित थीम हैं, सिर्फ़ छोटे सैटेलाइट एलोकेशन के लिए।", "HDFC हर साल 34% देता रहेगा।", "इंडेक्स फंड पैसिव होने से जोखिम-मुक्त है।", "थीमैटिक फंड में एक्सपेंस रेशियो मायने नहीं रखता।"]],
"fq-d4": ["टॉप 3 शेयर Motilal Oswal Defence Index Fund का 54.88% और HDFC Defence Fund का 41.14% हैं। क्लाइंट के लिए इसका क्या अर्थ है?", ["हर फंड का रिटर्न कुछ ही कंपनियों पर बहुत निर्भर है, इसलिए BEL, HAL या Bharat Forge में झटका फंड को ज़ोर से लगेगा — थीमैटिक एक्सपोज़र छोटा रखने की एक और वजह।", "फंड अच्छी तरह विविध हैं क्योंकि उनमें कई शेयर हैं।", "केंद्रीकरण जोखिम घटाता है।", "टॉप-3 वेटेज का रिटर्न पर असर नहीं होता।"]],
"fq-d5": ["डिफेंस फंड्स के पोर्टफोलियो का P/E लगभग 59–63 है, जबकि SBI मल्टी एसेट की इक्विटी का लगभग 19। सही व्याख्या क्या है?", ["निवेशक डिफेंस में मौजूदा कमाई के हर रुपये के लिए बहुत ज़्यादा चुका रहे हैं क्योंकि वे मज़बूत ग्रोथ की उम्मीद करते हैं — अगर ग्रोथ निराश करे, तो भाव तेज़ी से गिर सकते हैं।", "डिफेंस कंपनियाँ बेहतर हैं क्योंकि उनका P/E ज़्यादा है।", "ऊँचा P/E भविष्य में ऊँचे रिटर्न की गारंटी है।", "म्यूचुअल फंड के लिए P/E का कोई महत्व नहीं।"]],
"fq-d6": ["क्लाइंट HDFC Defence Fund का शुरुआत से सालाना 37.44% रिटर्न देखकर कहता है, \"तो मुझे लगभग 37% सालाना मिलेगा।\" नियमों के अनुसार सही जवाब क्या है?", ["\"यह रिटर्न जून 2023 से है, जब डिफेंस शेयरों में असाधारण तेज़ी आई। पिछला रिटर्न भविष्य की गारंटी नहीं है, और यह थीम तेज़ी से गिर भी सकती है। आइए आपकी योजना के अनुसार एक छोटा हिस्सा तय करें।\"", "\"हाँ, लगभग 37% संभव है।\"", "\"कम से कम 25% की गारंटी है।\"", "\"रिटर्न मायने नहीं रखते, बस निवेश कीजिए।\""]],
"fq-d7": ["HDFC Defence Fund में 30.71% स्मॉल कैप है; Motilal Oswal इंडेक्स फंड में 24.76%। RM को इससे क्या समझना चाहिए?", ["ज़्यादा स्मॉल कैप का मतलब आमतौर पर बड़े उतार-चढ़ाव और गिरावट में कम लिक्विडिटी, इसलिए एक्टिव फंड इंडेक्स फंड से ज़्यादा अस्थिर हो सकता है।", "स्मॉल कैप फंड को सुरक्षित बनाते हैं।", "मार्केट-कैप मिश्रण का जोखिम पर असर नहीं होता।", "दोनों फंड सिर्फ़ लार्ज कैप रखते हैं।"]],
"fq-d8": ["Motilal Oswal Defence Index Fund एक साल में 'इंडेक्स फंड्स' में 220 में छठे स्थान पर है। इस रैंक का हवाला देते समय सावधान क्यों रहें?", ["इस कैटेगरी में कई अलग-अलग इंडेक्स ट्रैक करने वाले फंड हैं, इसलिए रैंक ज़्यादातर यह दिखाती है कि डिफेंस इंडेक्स ने दूसरे इंडेक्स के मुकाबले कैसा किया — फंड मैनेजर की कुशलता नहीं।", "क्योंकि इंडेक्स फंड की रैंकिंग हमेशा गलत होती है।", "क्योंकि छठा स्थान कमज़ोर नतीजा है।", "क्योंकि इंडेक्स फंड की रैंकिंग नहीं हो सकती।"]]
});

"fq-ma1": ["SBI મલ્ટી એસેટ એલોકેશન ટેક્સ માટે 'નોન-ઇક્વિટી ઓરિએન્ટેડ' બતાવાયું છે, જ્યારે DSP અને Edelweiss મલ્ટી એસેટ 'ઇક્વિટી ઓરિએન્ટેડ' છે. 30% સ્લેબવાળા ક્લાયન્ટ 18 મહિના રાખવા માંગે છે. તમારે શું સમજાવવું જોઈએ?", ["આ ફંડ્સ પર ટેક્સ જુદો હોઈ શકે: ઇક્વિટી ઓરિએન્ટેડ ફંડમાં 12 મહિના પછીનો નફો લોંગ-ટર્મ છે (છૂટ ઉપર 12.5%); SBI ના કિસ્સામાં (35%–65% ઇક્વિટી) 24 મહિનાની અંદરનો નફો સ્લેબ દરે કરપાત્ર છે. હોલ્ડિંગ સમયગાળો મહત્વનો છે — CA પાસેથી ચકાસો.", "બધા મલ્ટી-એસેટ ફંડ્સ પર સરખો ટેક્સ લાગે છે.", "નોન-ઇક્વિટી ઓરિએન્ટેડ ફંડ એક વર્ષ પછી ટેક્સ-ફ્રી થાય છે.", "ટેક્સ ફક્ત ફંડના રિટર્ન પર આધાર રાખે છે."]],
"fq-ma2": ["Edelweiss મલ્ટી એસેટમાં 24.91% ઇક્વિટી, 52.61% ડેટ અને 566% ટર્નઓવર દેખાય છે, છતાં ટેક્સ 'ઇક્વિટી ઓરિએન્ટેડ' છે. સૌથી સંભવિત કારણ શું છે?", ["ઇક્વિટી આંકડો અનહેજ્ડ ઇક્વિટી બતાવે છે; ફંડ પાસે કદાચ વધારાની હેજ્ડ (આર્બિટ્રેજ) ઇક્વિટી પોઝિશન પણ છે જે ઇક્વિટી ટેક્સ માટે જરૂરી 65% માં ગણાય છે — ગ્રોસ વિરુદ્ધ નેટ ઇક્વિટી AMC ફેક્ટશીટમાં જુઓ.", "રિપોર્ટમાં ટેક્સની માહિતી ખોટી હશે.", "ડેટ ફંડ પર હંમેશા ઇક્વિટીની જેમ ટેક્સ લાગે છે.", "500% થી વધુ ટર્નઓવર ફંડને આપોઆપ ઇક્વિટી ઓરિએન્ટેડ બનાવે છે."]],
"fq-ma3": ["Edelweiss મલ્ટી એસેટ 3 અને 6 મહિનામાં 34 માં પહેલા સ્થાને છે, પણ 3 વર્ષમાં 15 માં 15મા સ્થાને. શ્રેષ્ઠ અર્થઘટન શું છે?", ["તેનું ડેટ-ભારે, ઓછી ઇક્વિટીવાળું મિશ્રણ તાજેતરના ઘટાડામાં સૌથી સારું ટક્યું, પણ ઇક્વિટીની તેજીમાં પાછળ રહ્યું — રેન્ક પોઝિશનિંગ બતાવે છે, તેથી જુઓ કે તેની શૈલી ક્લાયન્ટને અનુકૂળ છે કે નહીં.", "તે શ્રેષ્ઠ ફંડ બની ગયું છે અને ટોચે જ રહેશે.", "3 વર્ષનો રેન્ક ખોટો હશે.", "ટૂંકા ગાળાના રેન્ક લાંબા ગાળા કરતાં વધુ ભરોસાપાત્ર છે."]],
"fq-ma4": ["આ રિપોર્ટોમાં ત્રણે મલ્ટી-એસેટ ફંડ્સના બેન્ચમાર્ક ઘણા જુદા છે: BSE 500 TRI (SBI), NIFTY 500 TRI (DSP) અને CRISIL Short Term Bond Index (Edelweiss). તેમાંથી પસંદ કરવા 'બેન્ચમાર્કને હરાવ્યો?' પૂરતું કેમ નથી?", ["કારણ કે બેન્ચમાર્કનું જોખમ ઘણું જુદું છે — એક ઇક્વિટી ઇન્ડેક્સ, એક શોર્ટ-ટર્મ બોન્ડ ઇન્ડેક્સ — તેથી દરેકને હરાવવાનો અર્થ જુદો છે. ફંડ્સની એકબીજા સાથે અને કેટેગરી સાથે સરખામણી કરો, એલોકેશન અને જોખમ પણ જુઓ.", "કારણ કે હાઇબ્રિડ ફંડ્સ માટે બેન્ચમાર્ક ક્યારેય મહત્વના નથી.", "કારણ કે સૌથી અઘરા બેન્ચમાર્કવાળું ફંડ હંમેશા શ્રેષ્ઠ હોય છે.", "કારણ કે ત્રણે બેન્ચમાર્ક સરખા છે."]],
"fq-ma5": ["SBI મલ્ટી એસેટના ડેટની યીલ્ડ 7.73% છે અને તેમાં 16.71% AA-રેટેડ પેપર છે; Edelweiss ની યીલ્ડ 7.42% છે અને લગભગ બધું AAA કે સોવરેન છે. મુખ્ય સમાધાન શું છે?", ["SBI ની ઊંચી યીલ્ડ અંશતઃ વધુ ક્રેડિટ જોખમ લેવાથી આવે છે; Edelweiss ની ઓછી યીલ્ડ સાથે ક્રેડિટ ગુણવત્તા ઊંચી છે.", "ઊંચી યીલ્ડ એટલે હંમેશા વધુ સારું ફંડ.", "AA બોન્ડમાં AAA કરતાં વધુ જોખમ નથી.", "યીલ્ડ ટુ મેચ્યોરિટી ફંડનું નક્કી રિટર્ન છે."]],
"fq-ma6": ["DSP મલ્ટી એસેટના ક્લાયન્ટ પૂછે છે: \"મારા ભારતીય ફંડમાં NVIDIA કેમ છે?\" શ્રેષ્ઠ જવાબ કયો છે?", ["\"તમારું ફંડ એક હિસ્સો વિદેશમાં રોકી શકે છે, જેથી તમારા પૈસા એવા દેશો અને સેક્ટરમાં ફેલાય છે જે ભારતમાં નથી મળતા. તેમાં ચલણની અસર પણ આવે છે — નબળો રૂપિયો મદદ કરે, મજબૂત રૂપિયો નુકસાન.\"", "\"આ ફંડની ભૂલ હશે.\"", "\"વિદેશી શેર જોખમ-મુક્ત છે.\"", "\"દરેક ભારતીય ફંડમાં NVIDIA હોય છે.\""]],
"fq-ma7": ["રેગ્યુલર પ્લાન એક્સપેન્સ રેશિયો: Edelweiss 1.13%, SBI 1.42%, DSP 1.59%. ક્લાયન્ટ કહે છે, \"બસ સૌથી સસ્તું પસંદ કરો.\" તમારે શું ઉમેરવું જોઈએ?", ["ખર્ચ મહત્વનો છે, પણ આ ફંડ જુદી રીતે બનેલા છે — Edelweiss અડધાથી વધુ ડેટમાં, DSP માં વધુ ઇક્વિટી અને વિદેશી એસેટ — તેથી પહેલા ક્લાયન્ટને અનુકૂળ મિશ્રણ પસંદ કરો, પછી સમાન વિકલ્પોમાં ખર્ચ સરખાવો.", "રણનીતિ ગમે તે હોય, હંમેશા સૌથી સસ્તું ફંડ પસંદ કરો.", "એક્સપેન્સ રેશિયોની રિટર્ન પર અસર નથી.", "સૌથી મોંઘું ફંડ હંમેશા શ્રેષ્ઠ કરે છે."]],
"fq-ma8": ["ક્લાયન્ટ મલ્ટી-એસેટ ફંડમાં પૈસા મૂકવા માંગે છે, પણ 6 મહિનામાં જરૂર પડી શકે. SBI નો એક્ઝિટ લોડ 1%, Edelweiss નો 0.25%, DSP નો 0% છે. યોગ્ય સલાહ શું છે?", ["મલ્ટી-એસેટ ફંડ 6 મહિનાના પૈસા માટે નથી બન્યું કારણ કે તેનો ઇક્વિટી હિસ્સો ઘટી શકે; અને વહેલા ઉપાડ પર એક્ઝિટ લોડ પણ લાગી શકે. ટૂંકા ગાળાના પૈસા લિક્વિડ જેવા ફંડ માટે યોગ્ય છે.", "DSP પસંદ કરો કારણ કે તેમાં એક્ઝિટ લોડ નથી.", "એક વર્ષની અંદર એક્ઝિટ લોડ લાગતો નથી.", "મલ્ટી-એસેટ ફંડની વેલ્યુ ઘટી ન શકે."]],
"fq-d1": ["30 સપ્ટેમ્બર 2026એ Motilal Oswal Nifty India Defence Index Fund માં BEL 19.97% અને HAL 19.68% હતા; ઇન્ડેક્સ વેઇટેજ 19.95% અને 19.67% હતા. આ શું બતાવે છે?", ["ઇન્ડેક્સ ફંડ તેના ઇન્ડેક્સની નજીકથી નકલ કરે છે; નાના તફાવત રોકડ, સમય અને ટ્રેકિંગ એરરથી આવે છે.", "ફંડ મેનેજરે સંશોધનના આધારે આ વેઇટેજ પસંદ કર્યા.", "ફંડ વધુ BEL ખરીદીને ઇન્ડેક્સને હરાવે છે.", "ઇન્ડેક્સ ફંડ કોઈપણ શેર રાખી શકે."]],
"fq-d2": ["HDFC Defence Fund માં Eicher Motors (4.67%) અને Bosch (4.1%) છે — જે Nifty India Defence ઇન્ડેક્સના મોટા ઘટકોમાં નથી. કેમ?", ["તે 'ડિફેન્સ અને સહાયક' મેન્ડેટવાળું એક્ટિવલી મેનેજ્ડ થીમેટિક ફંડ છે, તેથી મેનેજર સંબંધિત કંપનીઓ ઉમેરી શકે — તેથી તેનું રિટર્ન ઇન્ડેક્સથી બંને દિશામાં જુદું હોઈ શકે.", "ફંડે તેનો મેન્ડેટ તોડ્યો છે.", "Eicher અને Bosch ભારતની સૌથી મોટી ડિફેન્સ કંપનીઓ છે.", "ઇન્ડેક્સ ફંડ અને એક્ટિવ ફંડમાં હંમેશા સરખા શેર હોય છે."]],
"fq-d3": ["ક્લાયન્ટ Motilal Oswal Defence Index Fund (એક્સપેન્સ રેશિયો 1.12%) અને HDFC Defence Fund (1.79%; 3 વર્ષનું રિટર્ન વાર્ષિક 34.36%, 52 માં પહેલું) વચ્ચે પસંદ કરે છે. સૌથી સંતુલિત સમજૂતી કઈ છે?", ["એક ઓછા ખર્ચે ઇન્ડેક્સનું એક્સપોઝર આપે છે; બીજું વધુ ખર્ચે મેનેજરની પસંદગી પર આધારિત છે. HDFC નો મજબૂત ભૂતકાળ સાચો છે, પણ ભવિષ્યમાં વધુ સારા પ્રદર્શનની ગેરંટી નથી. બંને કેન્દ્રિત થીમ છે, ફક્ત નાના સેટેલાઇટ એલોકેશન માટે.", "HDFC દર વર્ષે 34% આપતું રહેશે.", "ઇન્ડેક્સ ફંડ પેસિવ હોવાથી જોખમ-મુક્ત છે.", "થીમેટિક ફંડમાં એક્સપેન્સ રેશિયો મહત્વનો નથી."]],
"fq-d4": ["ટોપ 3 શેર Motilal Oswal Defence Index Fund નો 54.88% અને HDFC Defence Fund નો 41.14% છે. ક્લાયન્ટ માટે તેનો અર્થ શું છે?", ["દરેક ફંડનું રિટર્ન થોડી કંપનીઓ પર ખૂબ આધાર રાખે છે, તેથી BEL, HAL કે Bharat Forge માં આંચકો ફંડને જોરથી લાગશે — થીમેટિક એક્સપોઝર નાનું રાખવાનું વધુ એક કારણ.", "ફંડ સારી રીતે વૈવિધ્યસભર છે કારણ કે તેમાં ઘણા શેર છે.", "કેન્દ્રીકરણ જોખમ ઘટાડે છે.", "ટોપ-3 વેઇટેજની રિટર્ન પર અસર નથી."]],
"fq-d5": ["ડિફેન્સ ફંડ્સના પોર્ટફોલિયોનો P/E લગભગ 59–63 છે, જ્યારે SBI મલ્ટી એસેટની ઇક્વિટીનો લગભગ 19. યોગ્ય અર્થઘટન શું છે?", ["રોકાણકારો ડિફેન્સમાં વર્તમાન કમાણીના દરેક રૂપિયા માટે ઘણું વધુ ચૂકવે છે કારણ કે તેઓ મજબૂત વિકાસની અપેક્ષા રાખે છે — જો વિકાસ નિરાશ કરે, તો ભાવ ઝડપથી ઘટી શકે.", "ડિફેન્સ કંપનીઓ વધુ સારી છે કારણ કે તેમનો P/E વધુ છે.", "ઊંચો P/E ભવિષ્યમાં ઊંચા રિટર્નની ગેરંટી છે.", "મ્યુચ્યુઅલ ફંડ માટે P/E નું કોઈ મહત્વ નથી."]],
"fq-d6": ["ક્લાયન્ટ HDFC Defence Fund નું શરૂઆતથી વાર્ષિક 37.44% રિટર્ન જોઈને કહે છે, \"તો મને લગભગ 37% વાર્ષિક મળશે.\" નિયમો મુજબ સાચો જવાબ કયો છે?", ["\"આ રિટર્ન જૂન 2023 થી છે, જ્યારે ડિફેન્સ શેરમાં અસાધારણ તેજી આવી. ભૂતકાળનું રિટર્ન ભવિષ્યની ગેરંટી નથી, અને આ થીમ ઝડપથી ઘટી પણ શકે. ચાલો તમારી યોજના મુજબ નાનો હિસ્સો નક્કી કરીએ.\"", "\"હા, લગભગ 37% શક્ય છે.\"", "\"ઓછામાં ઓછા 25% ની ગેરંટી છે.\"", "\"રિટર્ન મહત્વના નથી, બસ રોકાણ કરો.\""]],
"fq-d7": ["HDFC Defence Fund માં 30.71% સ્મોલ કેપ છે; Motilal Oswal ઇન્ડેક્સ ફંડમાં 24.76%. RM એ આમાંથી શું સમજવું જોઈએ?", ["વધુ સ્મોલ કેપનો અર્થ સામાન્ય રીતે મોટી વધઘટ અને ઘટાડામાં ઓછી લિક્વિડિટી, તેથી એક્ટિવ ફંડ ઇન્ડેક્સ ફંડ કરતાં વધુ અસ્થિર હોઈ શકે.", "સ્મોલ કેપ ફંડને સુરક્ષિત બનાવે છે.", "માર્કેટ-કેપ મિશ્રણની જોખમ પર અસર નથી.", "બંને ફંડ ફક્ત લાર્જ કેપ રાખે છે."]],
"fq-d8": ["Motilal Oswal Defence Index Fund એક વર્ષમાં 'ઇન્ડેક્સ ફંડ્સ' માં 220 માં છઠ્ઠા સ્થાને છે. આ રેન્કનો ઉલ્લેખ કરતાં સાવધ કેમ રહેવું?", ["આ કેટેગરીમાં ઘણા જુદા જુદા ઇન્ડેક્સ ટ્રેક કરતા ફંડ છે, તેથી રેન્ક મોટે ભાગે બતાવે છે કે ડિફેન્સ ઇન્ડેક્સે બીજા ઇન્ડેક્સની સરખામણીએ કેવું કર્યું — ફંડ મેનેજરની કુશળતા નહીં.", "કારણ કે ઇન્ડેક્સ ફંડના રેન્કિંગ હંમેશા ખોટા હોય છે.", "કારણ કે છઠ્ઠું સ્થાન નબળું પરિણામ છે.", "કારણ કે ઇન્ડેક્સ ફંડનો રેન્ક ન હોઈ શકે."]]

      const rf = state.rf || { rounds: 0, answered: 0, correct: 0 };
      state.rf = { rounds: rf.rounds + 1, answered: rf.answered + answered, correct: rf.correct + score };
      state.light = L; state.bonus = (state.bonus || 0) + xp;
      activity({ k: "light", s: score, x: xp }); persist(); return { xp, isBest, counted };
    },
    /* Daily chest: one per day, opened once all three quest steps are done */
    openChest(x) {
      const t = todayStr(); if (state.chest?.day === t) return false;
      state.chest = { day: t, x }; state.bonus = (state.bonus || 0) + x;
      state.rewards = [...new Set([...(state.rewards || []), t])];
      activity({ k: "chest", x }); persist(); return true;
    }
  };
})();

/* ===== app/model.js — one lesson/question shape for deep (new-standard), db-published and legacy (v2) content ===== */
const Model = (() => {
  const LEGACY = [...P2, ...P3, ...P4, ...P5, ...P6];          /* days 16–90, v2 format */
  const PHASE_TAGS = { eco: ["economy", "rates", "inflation", "equity", "global"], def: ["defence", "risk"], gold: ["gold", "silver"],
    multi: ["multi-asset", "allocation", "risk"], funds: ["products", "communication", "returns"], ind: ["mf-industry"] };
  const staticDeep = Object.fromEntries(DEEP_LESSONS.map(l => [l.n, l]));
  const published = {};           /* n -> lesson published from Lesson Studio (db lessons/<n>) */
  const qIndex = {};              /* qid -> {tags, day?, story?} */

  function legacyLesson(n) {
    const [title, facts, pitch, qs] = LEGACY[n - 16];
    const tags = PHASE_TAGS[phaseOf(n).id];
    return { n, tags, title, story: null, concept: facts, client: null, talk: pitch, remember: [], deep: false,
      qs: qs.map(([prompt, options, exp], i) => ({ id: `v2-${n}-${i}`, tags, types: [], prompt, options, answer: 0, why: exp, wrong: [], big: "", client: "", remember: "", follow: null, legacy: true })) };
  }
  const lesson = n => published[n] || staticDeep[n] || legacyLesson(n);
  const isDeep = n => !!(published[n] || staticDeep[n]);

  function index(q, extra) { qIndex[q.id] = { tags: q.tags || [], ...extra }; if (q.follow) qIndex[q.id + ":f"] = { tags: q.tags || [], ...extra }; }
  function reindex() { for (let n = 1; n <= 90; n++) lesson(n).qs.forEach(q => index(q, { day: n })); }

  async function loadPublished() {
    const db = Store.ctx.db; if (!db) return;
    try {
      const snap = await db.collection("lessons").where("status", "==", "published").get();
      snap.docs.forEach(d => { try { const l = JSON.parse(d.data().json); if (validLesson(l)) published[l.n] = { ...l, deep: true }; } catch {} });
    } catch {}
    reindex();
  }

  /* Shape checks used by Lesson Studio and News editor before anything goes live */
  const validQ = q => q && typeof q.id === "string" && typeof q.prompt === "string" && Array.isArray(q.options) && q.options.length === 4 &&
    Number.isInteger(q.answer) && q.answer >= 0 && q.answer < 4 && typeof q.why === "string" && Array.isArray(q.wrong) && q.wrong.length === 4;
  const validLesson = l => l && Number.isInteger(l.n) && l.n >= 1 && l.n <= 90 && typeof l.title === "string" && l.story && Array.isArray(l.story.paras) &&
    Array.isArray(l.concept) && l.client && typeof l.client.quote === "string" && Array.isArray(l.qs) && l.qs.length >= 3 && l.qs.every(validQ) &&
    typeof l.talk === "string" && Array.isArray(l.remember);

  /* Up to `max` review questions from earlier days: missed-first-time first, then same-topic questions */
  function reviewFor(n, max = 2) {
    const st = Store.get(), tags = new Set(lesson(n).tags), out = [];
    const earlier = []; for (let k = 1; k < n; k++) lesson(k).qs.forEach(q => earlier.push(q));
    const missed = earlier.filter(q => st.ans[q.id] && !st.ans[q.id].f && !st.ans[q.id].c);
    const related = shuffle(earlier.filter(q => !missed.includes(q) && q.tags.some(t => tags.has(t))));
    for (const q of [...shuffle(missed), ...related]) { if (out.length >= max) break; if (!out.includes(q)) out.push(q); }
    return out;
  }
  const daysForTag = tag => { const out = []; for (let n = 1; n <= 90; n++) if (lesson(n).tags.includes(tag)) out.push(n); return out; };
  const phaseQuestions = id => { const p = PHASES.find(x => x.id === id); const out = []; for (let n = p.from; n <= p.to; n++) out.push(...lesson(n).qs); return out; };
  const allQuestions = () => { const out = []; for (let n = 1; n <= 90; n++) out.push(...lesson(n).qs); return out; };

  reindex();
  return { lesson, isDeep, loadPublished, validLesson, validQ, reviewFor, daysForTag, phaseQuestions, allQuestions, index,
    tagsOf: qid => qIndex[qid]?.tags || [], qmeta: qid => qIndex[qid], published, staticDeep };
})();

/* ===== app/i18n.js — UI strings + cached AI translation of any content object (db: i18n/<lang>-<key>) ===== */
const I18N = (() => {
  const LANGS = [["en", "English"], ["hi", "हिन्दी"], ["gu", "ગુજરાતી"]];
  const NAMES = { hi: "Hindi (Devanagari script)", gu: "Gujarati (Gujarati script)", en: "English" };
  /* Fields that must never change in translation */
  const KEEP = new Set(["id", "n", "tags", "types", "answer", "url", "date", "cat", "status", "featured", "checkedOn", "src", "factsheet", "owner_key"]);
  let lang = "en";
  try { lang = localStorage.getItem("uc90:lang") || "en"; } catch {}
  const cache = {}, inflight = {};

  const t = (key, vars = {}) => (STRINGS[lang]?.[key] ?? STRINGS.en[key] ?? key).replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");

  const tx = (key, obj, l = lang) => (l !== "en" && cache[l + "-" + key]) || obj;
  const has = (key, l = lang) => l === "en" || !!cache[l + "-" + key];

  async function loadAll(l = lang) {
    const db = Store.ctx.db; if (l === "en" || !db) return;
    try {
      const snap = await db.collection("i18n").where("lang", "==", l).get();
      snap.docs.forEach(d => { const r = d.data(); try { cache[l + "-" + (r.key ?? String(r.n))] = JSON.parse(r.json); } catch {} });
    } catch {}
  }

  /* Collect every translatable string with its path; ids, numbers, nulls and KEEP fields are never sent */
  function collect(o, k, path, out) {
    if (KEEP.has(k)) return out;
    if (typeof o === "string") { if (o.trim()) out.push([path, o]); return out; }
    if (Array.isArray(o)) o.forEach((x, i) => collect(x, null, [...path, i], out));
    else if (o && typeof o === "object") for (const [kk, v] of Object.entries(o)) collect(v, kk, [...path, kk], out);
    return out;
  }
  function rebuild(obj, items, texts) {
    const copy = JSON.parse(JSON.stringify(obj));
    items.forEach(([path], i) => { let o = copy; for (let j = 0; j < path.length - 1; j++) o = o[path[j]]; o[path[path.length - 1]] = texts[i]; });
    return copy;
  }
  /* Split into chunks so long lessons never get truncated */
  function chunks(items) {
    const out = []; let cur = [], size = 0;
    for (const it of items) { if (cur.length && (cur.length >= 30 || size + it[1].length > 5000)) { out.push(cur); cur = []; size = 0; } cur.push(it); size += it[1].length; }
    if (cur.length) out.push(cur); return out;
  }
  async function translateStrings(sample, texts, l) {
    const prompt = `Translate each string in this JSON array for Indian mutual fund distributor RMs into ${NAMES[l]}. Write natural, conversational language an RM would actually say to a client, with the same meaning and professional depth.
Keep in English letters: numbers, ₹, %, dates, and terms SIP, SWP, STP, NAV, AUM, TER, BER, XIRR, CAGR, P/E, SEBI, AMFI, RBI, MPC, CPI, GDP, FPI, DII, ETF, FoF, PMS, AIF, SIF, NISM, ARN, LTCG, STCG, PSU, F&O, repo, Nifty, Sensex, MCX, Comex, and all company, index, fund, product and organisation names.
Return ONLY a JSON array of exactly ${texts.length} strings, in the same order.
${JSON.stringify(texts)}`;
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const out = await sample.json(prompt, { modelTier: "default" });
        if (Array.isArray(out) && out.length === texts.length && out.every(x => typeof x === "string" && x.trim())) return out;
      } catch (e) { if (e?.code === "rate_limited") await new Promise(r => setTimeout(r, 5000)); }
    }
    return null;
  }
  function ensure(key, obj, l = lang) {
    if (l === "en" || cache[l + "-" + key]) return Promise.resolve(true);
    const ck = l + "-" + key;
    if (inflight[ck]) return inflight[ck];
    return inflight[ck] = (async () => {
      const sample = await window.claude?.use?.("sample");
      if (!sample) return false;
      try {
        const items = collect(obj, null, [], []), texts = [];
        for (const part of chunks(items)) { const tr = await translateStrings(sample, part.map(x => x[1]), l); if (!tr) return false; texts.push(...tr); }
        const out = rebuild(obj, items, texts);
        cache[ck] = out;
        try { await Store.ctx.db?.doc("i18n/" + ck).set({ lang: l, key, json: JSON.stringify(out) }); } catch {}
        return true;
      } catch { return false; } finally { delete inflight[ck]; }
    })();
  }
  /* Sequential so a lesson's parts don't trip rate limits */
  async function ensureAll(items, l = lang) { let ok = true; for (const [k, o] of items) ok = (await ensure(k, o, l)) && ok; return ok; }

  function setLang(l) { lang = l; try { localStorage.setItem("uc90:lang", l); } catch {} document.documentElement.lang = l; }
  return { LANGS, get lang() { return lang; }, langName: () => NAMES[lang], t, tx, has, ensure, ensureAll, loadAll, setLang };
})();
const t = I18N.t;

/* Language-aware views of content */
const View = {
  lessonParts(l) {
    if (!l.deep) { const o = { t: l.title, f: l.concept, p: l.talk, q: l.qs.map(q => [q.prompt, q.options, q.why]) }; return [[String(l.n), o]]; }
    const { qs, ...body } = l; return [["L" + l.n, body], ...qs.map(q => ["Q" + q.id, q])];
  },
  lesson(l) {
    if (I18N.lang === "en") return l;
    if (!l.deep) {
      const o = I18N.tx(String(l.n), null); if (!o) return l;
      return { ...l, title: o.t, concept: o.f, talk: o.p, qs: l.qs.map((q, i) => ({ ...q, prompt: o.q[i][0], options: o.q[i][1], why: o.q[i][2] })) };
    }
    const { qs, ...body } = l;
    return { ...I18N.tx("L" + l.n, body), qs: qs.map(View.q) };
  },
  q(q) {
    const l = I18N.lang; if (l === "en") return q;
    if (q.legacy) {
      const st = TX[l]?.[q.id]; if (st) return { ...q, prompt: st[0], options: st[1], why: st[2] };
      const [, n, i] = q.id.split("-"); const o = I18N.tx(n, null);
      return o?.q?.[i] ? { ...q, prompt: o.q[i][0], options: o.q[i][1], why: o.q[i][2] } : { ...q, _en: true };
    }
    const full = I18N.tx("Q" + q.id, null); if (full) return full;

  },
  qJob(q) { if (!q.legacy) return ["Q" + q.id, q]; const n = Number(q.id.split("-")[1]); return View.lessonParts(Model.lesson(n))[0]; },
  qReady: q => I18N.lang === "en" || q._loc || !!TX[I18N.lang]?.[q.id] || I18N.has(View.qJob(q)[0]),
  story(s) { const { checks, ...body } = s; return { ...I18N.tx("N" + s.id, body), checks: (checks || []).map(View.q) }; },
  storyParts(s) { const { checks, ...body } = s; return [["N" + s.id, body], ...(checks || []).map(q => ["Q" + q.id, q])]; },
  sim: s => I18N.tx("S" + s.id, s)
};

/* Localised names for fixed vocabularies */
const topicName = tag => STRINGS[I18N.lang]?.["topic_" + tag] || TOPICS[tag] || tag;
const qtypeName = n => STRINGS[I18N.lang]?.["qt_" + n] || QTYPES[n - 1] || "";

/* ===== app/mastery.js — learning quality from first-attempt answers, tests and client simulations ===== */
const Mastery = (() => {
  const MIN = 3;   /* answers needed before a topic score is shown */
  function compute(st) {
    const ans = Object.entries(st.ans || {});
    const topics = {};
    for (const [qid, a] of ans) for (const tag of Model.tagsOf(qid)) { const x = topics[tag] ||= { n: 0, f: 0 }; x.n++; x.f += a.f; }
    for (const [id, s] of Object.entries(st.sims || {})) {
      const sim = SIMS.find(x => x.id === id); if (!sim || s.first == null) continue;
      for (const tag of sim.tags) { const x = topics[tag] ||= { n: 0, f: 0 }; x.n += 2; x.f += 2 * s.first / 100; }
    }
    for (const x of Object.values(topics)) x.pct = x.n >= MIN ? Math.round(x.f / x.n * 100) : null;

    const firstAcc = pct(ans.filter(([, a]) => a.f).length, ans.length);
    const testFirst = Object.values(st.tests || {}).filter(r => r.first != null && r.of).map(r => r.first / r.of * 100);
    const simFirst = Object.values(st.sims || {}).filter(r => r.first != null).map(r => r.first);
    const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
    const parts = [[firstAcc, .7], [avg(testFirst), .15], [avg(simFirst), .15]].filter(([v]) => v != null);
    const wsum = parts.reduce((a, [, w]) => a + w, 0);
    const overall = ans.length >= 8 && wsum ? Math.round(parts.reduce((a, [v, w]) => a + v * w, 0) / wsum) : null;

    /* weekly first-attempt accuracy → improvement over time */
    const wk = {};
    for (const [, a] of ans) { const k = isoWeek(new Date(a.t || 0)); const x = wk[k] ||= { n: 0, f: 0 }; x.n++; x.f += a.f; }
    const weekly = Object.entries(wk).sort().slice(-8).map(([k, x]) => ({ wk: k, n: x.n, pct: pct(x.f, x.n) }));

    const weak = Object.entries(topics).filter(([, x]) => x.pct != null && x.pct < 60).sort((a, b) => a[1].pct - b[1].pct).map(([tag]) => tag);
    const attempted = ans.length, reattempts = ans.reduce((a, [, x]) => a + Math.max(0, x.a - 1), 0);
    return { overall, firstAcc, attempted, reattempts, topics, weekly, weak };
  }
  /* Time spent in the last 7 days, in minutes */
  const minutes7 = st => { let s = 0; for (let i = 0; i < 7; i++) s += st.time?.[todayStr(new Date(Date.now() - i * 864e5))] || 0; return Math.round(s / 60); };
  const minutesAll = st => Math.round(Object.values(st.time || {}).reduce((a, b) => a + b, 0) / 60);
  return { compute, minutes7, minutesAll };
})();

/* ===== app/news.js — Market Desk data: stories in db news/<id> {status, date, cat, featured, json} ===== */
const News = (() => {

  function ingest(docs) {

      .sort((a, b) => (b.date || "").localeCompare(a.date || ""));

  const lastUpdated = () => stories.reduce((m, s) => (s.checkedOn || s.date || "") > m ? (s.checkedOn || s.date) : m, "");
  const related = tags => stories.filter(s => s.tags?.some(x => tags.includes(x)));

  return { CATS, start, get all() { return stories; }, get loaded() { return loaded; }, byId: id => stories.find(s => s.id === id),

})();

/* ===== app/indexdata.js — index snapshots (built-in official factsheets + admin imports in db indices/<id>), changes, auto-questions ===== */
const IndexData = (() => {
  let extra = {}, unsub = null;
  const subs = new Set();
  const norm = s => String(s).toLowerCase().replace(/\(.*?\)/g, "").replace(/\b(ltd|limited|co|corporation|company|of|india|the|and|&)\b\.?/g, "").replace(/[^a-z0-9]+/g, " ").trim();
  const ALIAS = Object.fromEntries(Object.entries(COMPANIES).map(([k, c]) => [norm(c.name), k]));
  /* Map an imported factsheet name to a known company key, else a slug of the name */
  const keyFor = name => ALIAS[norm(name)] || Object.entries(ALIAS).find(([n]) => n && (norm(name).startsWith(n) || n.startsWith(norm(name))))?.[1] || "x:" + name.trim();
  const coName = key => COMPANIES[key]?.name || key.replace(/^x:/, "");

  /* Deterministic order so a question's options (and its cached translation) never change between visits */
  const hash = str => { let x = 2166136261; for (const c of str) x = Math.imul(x ^ c.charCodeAt(0), 16777619); return x >>> 0; };
  const stable = (arr, seed) => [...arr].sort((a, b) => hash(seed + a) - hash(seed + b));
  function start() {
    const db = Store.ctx.db; if (!db || unsub) return;
    unsub = db.collection("indices").onSnapshot(snap => { extra = {}; snap.docs.forEach(d => { try { extra[d.id] = JSON.parse(d.data().json); } catch {} }); subs.forEach(fn => fn()); });
  }
  function merged(base, add) {
    const meta = { ...(add?.meta || {}), ...(base || {}) };
    const byDate = {}; [...(base?.snapshots || []), ...(add?.snapshots || [])].forEach(s => { byDate[s.date] = s; });
    return { ...meta, snapshots: Object.values(byDate).sort((a, b) => b.date.localeCompare(a.date)) };
  }
  function all() {
    const ids = [...new Set([...INDICES.map(i => i.id), ...Object.keys(extra)])];
    return ids.map(id => merged(INDICES.find(i => i.id === id), extra[id])).filter(ix => ix.name);
  }
  const byId = id => all().find(ix => ix.id === id);
  const latest = ix => ix.snapshots.find(s => s.top?.length);
  const concentration = (snap, n) => Math.round(snap.top.slice(0, n).reduce((a, [, w]) => a + w, 0) * 10) / 10;

  /* Compare the newest snapshot with the previous snapshot that has weights */
  function changes(ix) {
    const withW = ix.snapshots.filter(s => s.top?.length);
    const now = withW[0], prev = withW[1];
    const countNow = ix.snapshots[0]?.count, countPrev = ix.snapshots.find(s => s.date < (ix.snapshots[0]?.date || ""))?.count;
    if (!now || !prev) return { now, prev: null, rows: [], countNow, countPrev };

  }

  /* Questions built from the data itself — each still teaches */
  function autoQuestions(ix) {
    const snap = latest(ix); if (!snap) return [];
    const top = snap.top, out = [], d = snap.date, src = snap.src, loc = I18N.lang !== "en";
    const short = k => CO_TX[I18N.lang]?.[k] || COMPANIES[k].short, W = Object.fromEntries(top), nm = k => coName(k).split(" (")[0];
    const mk = q => ({ ...q, _loc: loc });
    if (top.length >= 4) {

      out.push(mk({ id: `ix-${ix.id}-top-${d}`, tags: ix.tags, types: [6], prompt: t("ixq_top", { ix: ix.name, d: fmtLong(d) }),
        options: opts.map(coName), answer: opts.indexOf(top[0][0]), why: t("ixq_top_why", { co: coName(top[0][0]), w: top[0][1], src }),
        wrong: opts.map(k => k === top[0][0] ? null : t("ixq_top_wrong", { co: coName(k), w: W[k] })),
        big: t("ixq_top_big"), client: t("ixq_top_client", { co: nm(top[0][0]), w: Math.round(top[0][1]) }), remember: t("ixq_top_rem") }));
      const c3 = concentration(snap, 3), opts3 = stable([c3, Math.round((c3 - 18) * 10) / 10, Math.round((c3 + 15) * 10) / 10, Math.round((c3 / 2) * 10) / 10], ix.id + d + "c3");
      out.push(mk({ id: `ix-${ix.id}-c3-${d}`, tags: [...ix.tags, "risk"], types: [6, 8], prompt: t("ixq_c3", { ix: ix.name, d: fmtLong(d) }),
        options: opts3.map(v => v + "%"), answer: opts3.indexOf(c3), why: `${top.slice(0, 3).map(([k, w]) => `${nm(k)} ${w}%`).join(" + ")} = ${c3}%.`,
        wrong: opts3.map(v => v === c3 ? null : t("ixq_c3_wrong")), big: t("ixq_c3_big", { c: c3 }), client: t("ixq_c3_client", { c: Math.round(c3) }), remember: t("ixq_c3_rem") }));
    }
    const keys = top.map(x => x[0]).filter(k => COMPANIES[k]);
    (keys.length >= 4 ? keys : []).forEach(k => {
      const others = stable(keys.filter(x => x !== k), k).slice(0, 3), opts = stable([k, ...others], k + ix.id);
      out.push(mk({ id: `ix-${ix.id}-co-${k}`, tags: ix.tags, types: [7], prompt: t("ixq_co", { co: COMPANIES[k].name }),

        wrong: opts.map(x => x === k ? null : t("ixq_co_wrong", { co: COMPANIES[x].name })),

/* ===== app/mission.js — the 75-day mission window (db config/main: start, days, eligible). After the last day the portal becomes a standing learning portal. ===== */
const Mission = (() => {
  let cfg = { start: "", days: 75, eligible: 0 };
  const subs = new Set();
  const addDays = (d, n) => todayStr(new Date(new Date(d + "T00:00:00").getTime() + n * 864e5));
  const end = (c = cfg) => c.start ? addDays(c.start, (c.days || 75) - 1) : "";
  const day = (d = todayStr()) => cfg.start ? daysBetween(cfg.start, d) + 1 : null;
  const over = () => !!cfg.start && todayStr() > end();
  async function load() {
    const db = Store.ctx.db; if (!db) return;
    try { const s = await db.doc("config/main").get(); if (s.exists) cfg = { ...cfg, ...s.data() }; } catch {}
    db.doc("config/main").onSnapshot(s => { if (!s.exists) return; cfg = { start: "", days: 75, eligible: 0, ...s.data() }; subs.forEach(fn => fn(cfg)); }, () => {});
  }
  async function save(patch) { cfg = { ...cfg, ...patch }; await Store.ctx.db.doc("config/main").set(cfg); }
  const phaseDays = ph => { const D = cfg.days || 75; return { a: Math.round((ph.from - 1) * D / 90) + 1, b: Math.round(ph.to * D / 90) }; };
  return { load, save, end, day, over, addDays, phaseDays, get cfg() { return cfg; }, subscribe: fn => { subs.add(fn); return () => subs.delete(fn); } };
})();

/* ===== app/plan.js — the 75-day plan: each phase's 15 lessons spread evenly across that phase's mission days, so 15 days carry two lessons ===== */
const Plan = (() => {
  let cache = null;
  function days() {
    const D = Mission.cfg.days || 75;
    if (cache?.D === D) return cache.days;
    const out = [];
    PHASES.forEach(p => {
      const { a, b } = Mission.phaseDays(p), k = Math.max(1, b - a + 1), n = p.to - p.from + 1;
      for (let j = 0; j < k; j++) { const s = Math.floor(j * n / k), e = Math.floor((j + 1) * n / k); if (e > s) out.push({ phase: p, lessons: Array.from({ length: e - s }, (_, i) => p.from + s + i) }); }
    });
    cache = { D, days: out }; return out;
  }
  const count = () => days().length;
  const dayOf = n => days().findIndex(d => d.lessons.includes(n)) + 1;
  const lessonsOf = d => days()[d - 1]?.lessons || [];
  function label(n) {
    const d = dayOf(n), ls = lessonsOf(d), day = t("day_short", { n: d });
    return ls.length > 1 ? `${day} · ${t("part_of", { i: ls.indexOf(n) + 1, k: ls.length })}` : day;
  }
  const dayDone = (s, d) => lessonsOf(d).every(n => s.done.includes(n));
  const daysDone = s => days().filter((_, i) => dayDone(s, i + 1)).length;
  return { days, count, dayOf, lessonsOf, label, dayDone, daysDone };
})();

/* ===== app/assess.js — baseline (form A) and final (form B): parallel 25-question forms, 5 from Phase 1 and 4 from each later phase ===== */
const Assess = (() => {
  const hash = str => { let x = 2166136261; for (const c of str) x = Math.imul(x ^ c.charCodeAt(0), 16777619); return x >>> 0; };
  const pick = (seed, exclude) => PHASES.flatMap((p, i) => {
    const qs = []; for (let n = p.from; n <= p.to; n++) qs.push(...Model.lesson(n).qs);
    return qs.filter(q => !exclude.has(q.id)).sort((a, b) => hash(seed + a.id) - hash(seed + b.id)).slice(0, i === 0 ? 5 : 4);
  });
  function form(letter) {
    const a = pick("A", new Set());
    return letter === "A" ? a : pick("B", new Set(a.map(q => q.id)));
  }
  const FINAL_OPENS = 65;
  function status(id, s = Store.get()) {
    if (s.tests?.[id]) return { open: false, why: "Completed" };
    if (id === "baseline") return Mission.over() ? { open: false, why: "Closed: the mission has ended" } : { open: true, why: "Open now. Best taken before Day 1." };
    if (Mission.over() && todayStr() > Mission.addDays(Mission.end(), 7)) return { open: false, why: "Closed" };
    const d = Mission.day(), opens = Math.max(1, (Mission.cfg.days || 75) - 10);
    if (d != null ? d >= opens : s.done.length >= FINAL_OPENS) return { open: true, why: "Open now, until 7 days after the mission ends" };
    return { open: false, why: d != null ? `Opens on mission day ${opens}` : `Opens once you've cleared ${FINAL_OPENS} days` };
  }
  return { form, status, FINAL_OPENS };
})();

  const P = v => v == null ? "—" : `${r1(v)}%`;

  function windowOf(cfg, asOf = todayStr()) {
    const days = cfg.days || 75, end = Mission.end(cfg), last = asOf < end ? asOf : end;
    const elapsed = Math.max(0, Math.min(days, daysBetween(cfg.start, last) + 1));
    return { start: cfg.start, end, days, last, elapsed, split: Math.max(1, days - 30), final: asOf > end, weeks: Math.max(1, Math.ceil(elapsed / 7)) };
  }
  function activeDates(r, W) {
    const set = new Set(Object.keys(r.act || {}));
    Object.entries(r.time || {}).forEach(([d, sec]) => { if (sec > 0) set.add(d); });
    (r.log || []).forEach(e => { if (e.t && e.k !== "join") set.add(dateOf(e.t)); });
    Object.values(r.ans || {}).forEach(a => { if (a.t) set.add(dateOf(a.t)); });
    Object.values(r.news?.read || {}).forEach(ts => { if (ts) set.add(dateOf(ts)); });
    [...Object.values(r.tests || {}), ...Object.values(r.sims || {})].forEach(x => (x.runs || []).forEach(run => { if (run.t) set.add(dateOf(run.t)); }));
    (r.rewards || []).forEach(d => set.add(d));
    return [...set].filter(d => d >= W.start && d <= W.last).sort();
  }

  function metrics(id, raw, W) {
    const r = Store.migrate(raw), m = Mastery.compute(r);
    const dates = activeDates(r, W), days = dates.map(d => daysBetween(W.start, d) + 1);
    const answeredQs = Object.keys(r.ans).length, read = Object.keys(r.news.read).length, rounds = r.rf?.rounds || 0;
    const participated = answeredQs > 0 || r.done.length > 0 || read > 0 || rounds > 0 || r.puzzles > 0 || Object.keys(r.sims).length > 0;
    /* consistency */
    const weeksActive = new Set(days.map(d => Math.floor((d - 1) / 7))).size;
    let longest = 0, run = 0, prev = null;
    dates.forEach(d => { run = prev && daysBetween(prev, d) === 1 ? run + 1 : 1; longest = Math.max(longest, run); prev = d; });
    const lateShare = dates.length && W.elapsed > 28 ? Math.round(days.filter(d => d > W.elapsed - 14).length / dates.length * 100) : null;
    /* accuracy: qa counts every attempt; first-attempt accuracy comes from the first answer to each question */
    const attempts = r.qa?.n || 0, correct = r.qa?.c || 0;
    const firstN = answeredQs, firstC = Object.values(r.ans).filter(a => a.f).length;
    /* assessments */
    const sc = x => x?.first != null && x.of ? x.first / x.of * 100 : null;
    const base = sc(r.tests.baseline), fin = sc(r.tests.final), gain = base != null && fin != null ? fin - base : null;
    /* completion, each against what was available to this RM */
    const lessonsAvail = Math.min(90, Math.round(W.elapsed * 90 / W.days)), testsDone = TEST_IDS().filter(t => r.tests[t]).length;
    const briefs = (r.rewards || []).filter(d => d >= W.start && d <= W.last).length, labDone = Object.keys(r.sims).length;
    const parts = { lessons: [Math.min(r.done.length, lessonsAvail), lessonsAvail], tests: [testsDone, TEST_IDS().length], briefs: [Math.min(briefs, W.elapsed), W.elapsed], lab: [labDone, SIMS.length] };
    const sumD = Object.values(parts).reduce((a, [d]) => a + d, 0), sumA = Object.values(parts).reduce((a, [, x]) => a + x, 0);
    const points = r.final?.points ?? r.points;
    return {
      id, name: r.rmName || r.rm || "Unnamed", rm: r.rm, r, m, participated,
      points, bonus: r.bonus || 0, challenges: r.done.length + testsDone + briefs + labDone + (r.puzzles || 0) + rounds,
      activeDays: dates.length, weeksActive, weeklyRate: pct(weeksActive, W.weeks), weeksIdle: W.weeks - weeksActive, longest, lateShare,
      attempts, correct, acc: attempts ? correct / attempts * 100 : null, firstN, firstC, firstAcc: firstN ? firstC / firstN * 100 : null,
      base, fin, gain, baseDate: r.tests.baseline?.runs?.[0]?.t, finDate: r.tests.final?.runs?.[0]?.t,
      parts, completion: sumA ? sumD / sumA * 100 : null, puzzles: r.puzzles || 0, rounds,
      in60: days.some(d => d <= W.split), in30: days.some(d => d > W.split && d <= W.days)
    };
  }

  function compute(players, cfg, asOf) {
    const W = windowOf(cfg, asOf);
    const all = Object.entries(players).filter(([, d]) => d?.rm).map(([id, d]) => metrics(id, d, W));
    const P1 = all.filter(x => x.participated), eligible = cfg.eligible || RMS.length;
    const ranked = [...P1].sort((a, b) => b.points - a.points || (b.firstAcc ?? 0) - (a.firstAcc ?? 0));
    ranked.forEach((x, i) => x.rank = i + 1);
    const paired = P1.filter(x => x.gain != null);
    const sum = (arr, f) => arr.reduce((a, x) => a + f(x), 0);
    /* topics and phases: pooled first-try accuracy across all participants */
    const topics = {}, phases = {};
    P1.forEach(x => Object.entries(x.r.ans).forEach(([qid, a]) => {
      const meta = Model.qmeta(qid); if (!meta) return;
      (meta.tags || []).forEach(tag => { const o = topics[tag] ||= { n: 0, f: 0, rms: new Set() }; o.n++; o.f += a.f; o.rms.add(x.id); });
      if (meta.day) { const p = phaseOf(meta.day); const o = phases[p.id] ||= { n: 0, f: 0, rms: new Set() }; o.n++; o.f += a.f; o.rms.add(x.id); }
    }));
    const topicRows = Object.entries(topics).filter(([, o]) => o.n >= 5).map(([tag, o]) => ({ tag, name: TOPICS[tag] || tag, pct: o.f / o.n * 100, n: o.n, rms: o.rms.size })).sort((a, b) => b.pct - a.pct);
    const phaseRows = PHASES.map(p => { const o = phases[p.id]; return { name: p.name, pct: o?.n ? o.f / o.n * 100 : null, n: o?.n || 0, rms: o?.rms.size || 0 }; });
    const base60 = P1.filter(x => x.in60), kept = base60.filter(x => x.in30);
    const partRate = eligible ? P1.length / eligible * 100 : null;
    const attempts = sum(P1, x => x.attempts), correct = sum(P1, x => x.correct), fN = sum(P1, x => x.firstN), fC = sum(P1, x => x.firstC);
    return {
      W, cfg, eligible, all, P: P1, ranked, paired, topicRows, phaseRows,
      k1: { eligible, participants: P1.length, rate: partRate },
      k2: { base: avg(paired.map(x => x.base)), fin: avg(paired.map(x => x.fin)), gain: avg(paired.map(x => x.gain)), paired: paired.length,
        tookBase: P1.filter(x => x.base != null).length, tookFin: P1.filter(x => x.fin != null).length },
      k3: { leader: ranked[0] || null },
      k4: { activeDays: avg(P1.map(x => x.activeDays)), weekly: avg(P1.map(x => x.weeklyRate)), longest: avg(P1.map(x => x.longest)), idle: avg(P1.map(x => x.weeksIdle)) },
      k5: { acc: attempts ? correct / attempts * 100 : null, first: fN ? fC / fN * 100 : null, attempts, firstN: fN },
      k6: { overall: avg(P1.map(x => x.completion)), ...Object.fromEntries(["lessons", "tests", "briefs", "lab"].map(k => [k, avg(P1.map(x => x.parts[k][1] ? x.parts[k][0] / x.parts[k][1] * 100 : null))])) },
      k7: { best: topicRows.slice(0, 3), worst: [...topicRows].reverse().slice(0, 3) },
      k8: { base: base60.length, kept: kept.length, rate: base60.length ? kept.length / base60.length * 100 : null, ready: W.elapsed > W.split }
    };
  }

  /* ---------- rendering: one document used on screen and in the export ---------- */
  const tbl = (head, rows, right = []) => h("div", { class: "rp-table" }, h("table", {},
    h("thead", {}, h("tr", {}, head.map((c, i) => h("th", { class: right.includes(i) ? "r" : "" }, c)))),
    h("tbody", {}, rows.length ? rows.map(row => h("tr", {}, row.map((c, i) => h("td", { class: right.includes(i) ? "r" : "" }, c ?? "—"))))

  const sec = (n, title, question, formula, result, ...body) => h("section", { class: "rp-sec" },

  const kpi = (n, label, value, sub) => h("div", { class: "rp-kpi" }, h("span", { class: "n" }, `${n} · ${label}`), h("b", {}, value), h("span", {}, sub));
  const barCell = v => v == null ? "—" : h("span", {}, h("i", { class: "rp-bar", style: `width:${Math.max(2, Math.round(v * .8))}px` }), P(v));

  function render(R) {

          h("div", {}, h("dt", {}, "Generated"), h("dd", {}, new Date().toLocaleString("en-IN", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }))),

            return [x.name, x.participated ? "Participated" : "Signed in only", d[0] ? fmtD(d[0]) : "—", d.length ? fmtD(d[d.length - 1]) : "—"]; })
            .concat(RMS.filter(rm => !R.all.some(x => x.rm === rm.id)).map(rm => [rm.name, "Did not join", "—", "—"])))),

      sec(2, "Knowledge score improvement", `Did employees learn more during the ${W.days} days?`,
        "Final assessment score − baseline assessment score, in percentage points",
        k2.paired ? ["Average improvement: ", h("b", {}, PP(k2.gain)), ` (${P(k2.base)} at baseline, ${P(k2.fin)} at the end), across ${k2.paired} employees who took both.`]

      sec(3, "Final competition score and rank", "Who performed best across the mission?",
        "Total points under the published scoring formula (Appendix A). Ties are broken by first-attempt accuracy.",
        k3.leader ? ["Leader: ", h("b", {}, k3.leader.name), ` with ${k3.leader.points} points.`] : ["No participants yet."],
        tbl(["Rank", "Employee", "Total points", "Of which bonus", "Challenges completed", "Quiz accuracy", "First-attempt accuracy"],
          R.ranked.map(x => [x.rank, x.name, x.points, x.bonus, x.challenges, P(x.acc), P(x.firstAcc)]), [0, 2, 3, 4, 5, 6])),

      sec(4, "Learning consistency", "Who kept participating throughout the mission?",
        `Active day = a day with at least one learning activity. Weekly participation = weeks with activity ÷ ${W.weeks} mission weeks × 100.`,

        tbl(["Employee", "Active days", "Weekly participation", "Longest streak", "Weeks with no activity", "Active days in final 2 weeks"],

/* ===== app/admin-report.js — mission settings and the report, with downloads ===== */
function AdminReport() {

  const wrongs = q.wrong?.length ? q.options.map((o, i) => i === q.answer || !q.wrong[i] ? null :
    h("li", { class: i === pickedIdx ? "picked" : "" }, h("strong", {}, o), h("span", {}, q.wrong[i]))).filter(Boolean) : [];
  const panel = h("div", { class: "explain " + (right ? "is-right" : "is-wrong"), role: "region", "aria-label": t("exp_answer") },
    h("p", { class: "verdict" }, right ? t("verdict_right") : t("verdict_wrong")),
    sec(t("exp_answer"), h("p", { class: "answer-line" }, q.options[q.answer])),

    q.big ? sec(t("exp_big"), h("p", {}, q.big)) : null,

function FollowUp(q) {

  const order = shuffle(f.options.map((text, i) => ({ text, i })));

function LessonRunner({ questions, title, onFinish, onClose }) {
  const queue = questions.map(q => ({ q, retry: false })), results = [];
  const s0 = Store.get(), pts0 = s0.points, streak0 = Game.streakLive(s0) ? s0.streak || 0 : 0, t0 = Date.now();
  let i = 0, combo = 0, bestCombo = 0, answered = 0, onKey = null;
  const bar = h("i"), comboEl = h("span", { class: "lr-combo", hidden: true, "aria-live": "polite" });
  const body = h("div", { class: "lr-body" }), foot = h("div", { class: "lr-foot" });

    h("div", { class: "lr-top" },

      h("div", { class: "lr-bar", role: "progressbar", "aria-label": "Lesson progress" }, bar), comboEl),
    body, foot);
  const key = e => { if (!document.querySelector(".modal-bg")) onKey?.(e); };   /* a medal or tier pop-up takes the keys while open */
  function cleanup() { removeEventListener("keydown", key); root.remove(); document.documentElement.classList.remove("lr-open"); }
  const progress = () => { bar.style.width = `${Math.round(answered / queue.length * 100)}%`; };

  async function show() {
    const item = queue[i];
    if (I18N.lang !== "en" && !View.qReady(item.q) && Store.ctx.isOwner) {
      body.replaceChildren(h("p", { class: "ai-note lr-q" }, t("translating")));
      await I18N.ensure(...View.qJob(item.q));
    }
    const q = View.q(item.q), order = shuffle(q.options.map((text, idx) => ({ text, idx })));
    let picked = null, checked = false;
    const opts = order.map((o, k) => h("button", { class: "lr-opt", role: "radio", "aria-checked": "false", on: { click: () => pick(k) } },
      h("span", { class: "lr-key", "aria-hidden": "true" }, k + 1), h("span", {}, o.text)));
    const check = h("button", { class: "lr-btn", disabled: true, on: { click: () => doCheck() } }, "Check");
    function pick(k) {
      if (checked) return; picked = order[k].idx; check.disabled = false; Game.SFX.tick();
      opts.forEach((b, j) => { b.classList.toggle("sel", j === k); b.setAttribute("aria-checked", String(j === k)); });
    }
    function doCheck() {
      if (picked == null || checked) return; checked = true;
      const ok = picked === q.answer, isFirst = Store.answer(q.id, ok), el = opts[order.findIndex(o => o.idx === picked)];
      results.push({ q, ok, first: isFirst, retry: item.retry, review: !!item.q.review });
      combo = ok ? combo + 1 : 0; bestCombo = Math.max(bestCombo, combo);
      Game.answered(ok, isFirst, el, combo);

  const URL_JSON = "https://raw.githubusercontent.com/Debeshee11/ucwacademy/news-data/news.json";

    if (state === "loading" || (data && Date.now() - loadedAt < 10 * 60e3)) return;

      const r = await fetch(URL_JSON + "?t=" + Math.floor(Date.now() / 6e5));
      const j = r.ok ? await r.json() : null;

/* ===== app/profiler.js — Client Profiler & Meeting Prep: 15 questions → risk profile, red flags, discussion bands, prep card.
   Client records are private to each RM (db: data/users/<rmId>/<clientId>). ===== */
const L3 = o => (o && (o[I18N.lang] || o.en)) || "";
const Profiler = (() => {
  const maxOf = key => PQ.reduce((a, q) => a + Math.max(0, ...q.o.map(o => o[key] ?? -Infinity).filter(Number.isFinite)), 0);
  const CAP_MAX = maxOf("c"), WILL_MAX = maxOf("w");
  function score(ans) {
    let c = 0, w = 0; const flags = new Set(); const facts = {};
    PQ.forEach(q => { const o = q.o[ans[q.id]]; if (!o) return; c += o.c || 0; w += o.w || 0; if (o.flag) flags.add(o.flag); if (o.val !== undefined) facts[q.id] = o.val; });
    const cap = Math.round(c / CAP_MAX * 100), will = Math.round(w / WILL_MAX * 100);
    let idx = PROFILES.filter(p => Math.min(cap, will) >= p.min).length - 1;
    const hz = facts.horizon ?? 4; idx = Math.min(idx, [0, 1, 2, 4, 4][hz]);
    if (facts.goal === "park") idx = 0;
    if (will - cap >= 25) flags.add("mismatchHigh"); if (cap - will >= 25) flags.add("mismatchLow");
    return { cap, will, profile: PROFILES[Math.max(0, idx)], flags: [...flags], facts };
  }
  /* Private per-RM storage, localStorage fallback */
  const KEY = "uc90:clients";
  const col = () => Store.ctx.db && Store.ctx.uid ? Store.ctx.db.collection("data/users/" + Store.ctx.uid) : null;
  async function list() {
    const c = col();
    if (c) { try { const s = await c.where("kind", "==", "client").get(); return s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.updatedAt - a.updatedAt); } catch {} }
    try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch { return []; }
  }
  async function save(rec) {
    const c = col(); rec.updatedAt = Date.now();
    if (c) { await c.doc(rec.id).set({ kind: "client", ...rec }); return; }
    const all = (await list()).filter(x => x.id !== rec.id); try { localStorage.setItem(KEY, JSON.stringify([rec, ...all])); } catch {}
  }
  async function remove(id) { const c = col(); if (c) { await c.doc(id).delete(); return; } try { localStorage.setItem(KEY, JSON.stringify((await list()).filter(x => x.id !== id))); } catch {} }
  return { score, list, save, remove };
})();

const STORY_TEMPLATE = { id: "n-yyyy-mm-slug", cat: "mf-industry", tags: ["mf-industry"], featured: false, kind: "Official announcement",

function validateStory(s) {
  if (!/^[a-z0-9][a-z0-9-]{3,60}$/.test(s.id || "")) return "id: lowercase letters, digits and dashes";
  if (!News.CATS.includes(s.cat)) return "cat must be one of: " + News.CATS.join(", ");
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s.date || "")) return "date must be YYYY-MM-DD (the real publication/event date)";
  if (!s.source?.name || !/^https?:\/\//.test(s.source?.url || "")) return "source.name and a real source.url are required";
  for (const k of ["headline", "dataDate", "why", "who", "mfd", "ask", "reply", "notConclude"]) if (!String(s[k] || "").trim()) return `${k} is required`;
  if (!Array.isArray(s.facts) || !s.facts.filter(x => x.trim()).length) return "at least one fact is required";
  if (!Array.isArray(s.tags) || s.tags.some(x => !TOPICS[x])) return "tags must come from: " + Object.keys(TOPICS).join(", ");
  if (!Array.isArray(s.checks) || !s.checks.length) return "add at least one knowledge check";
  for (const q of s.checks) { if (!Model.validQ(q)) return `check ${q.id || "?"} is incomplete`; if (q.wrong[q.answer] !== null) return `check ${q.id}: wrong[answer] must be null`; }
  if (JSON.stringify(s).includes("[VERIFY]")) return "remove all [VERIFY] markers after checking the source";
  return null;
}

/* ===== app/admin-lang.js — pre-translate lessons, stories and client scenarios so RMs never wait ===== */
function AdminLang() {
  const sel = h("select", {}, h("option", { value: "hi" }, "Hindi"), h("option", { value: "gu" }, "Gujarati"));
  const status = h("span", { class: "muted" }); let running = false;
  const btn = h("button", { class: "btn", on: { click: run } }, "Translate everything");
  async function run() {
    if (running) { running = false; return; }
    running = true; btn.textContent = "Stop"; const l = sel.value; await I18N.loadAll(l);
    const jobs = [];
    for (let n = 1; n <= 90; n++) View.lessonParts(Model.lesson(n)).forEach(j => jobs.push(j));
    News.all.forEach(s => View.storyParts(s).forEach(j => jobs.push(j)));
    SIMS.forEach(s => jobs.push(["S" + s.id, s]));
    IndexData.all().forEach(ix => { jobs.push(["X" + ix.id, { about: ix.about, method: ix.method || [] }]); [...(INDEX_QS[ix.id] || []), ...IndexData.autoQuestions(ix)].forEach(q => jobs.push(["Q" + q.id, q])); });
    INDEX_QS.general.forEach(q => jobs.push(["Q" + q.id, q]));
    Object.entries(COMPANIES).forEach(([k, c]) => jobs.push(["C" + k, c]));
    const todo = jobs.filter(([k]) => !I18N.has(k, l));
    let fails = 0, done = 0;
    for (const [k, o] of todo) {
      if (!running) break;
      status.textContent = `Translating ${++done}/${todo.length}…`;
      if (!(await I18N.ensure(k, o, l))) { if (++fails >= 4) { status.textContent = `Paused after repeated failures at item ${done}. Try again later — finished items are saved.`; break; } await new Promise(r => setTimeout(r, 4000)); }
      else fails = 0;
    }
    if (running) status.textContent = todo.length ? "Done — everything is ready." : "Already complete.";
    running = false; btn.textContent = "Translate everything";
  }
  return h("section", { class: "panel stack" }, h("h2", {}, "Languages"),
    h("p", { class: "muted" }, "Interface text is built in for English, Hindi and Gujarati. Lessons, questions, explanations, stories, client scenarios, index notes and company profiles are translated by AI the first time anyone opens them in Hindi or Gujarati, then saved for the whole team. Run this to prepare everything in advance, then spot-check a few lessons with a native speaker. Re-run after publishing new stories or Studio lessons."),
    h("div", { class: "row" }, sel, btn, status));
}

/* ===== app/glass.js — liquid-glass hover: each button tracks the pointer so the royal-blue light sits right under it ===== */
(() => {
  const GLASS = ".btn,.lr-btn,.g-btn,.seg button,.side .nav button,.q-step,.qa-card,.tile,.lr-opt,.opt,.icon-btn,.fchip,.news-mini,.lr-x,.story-card,.pick-box";
  document.addEventListener("pointermove", e => {
    const el = e.target.closest?.(GLASS); if (!el) return;
    const r = el.getBoundingClientRect();
    el.style.setProperty("--mx", `${Math.round(e.clientX - r.left)}px`);
    el.style.setProperty("--my", `${Math.round(e.clientY - r.top)}px`);
  }, { passive: true });
})();

/* ===== app/pairs.js — two boxes side by side share one height (the shorter one's, never under 240px); the fuller one scrolls ===== */
(() => {
  const SEL = ".split, .duo, .desk-top", FLOOR = 240;
  function fit(c) {
    const kids = [...c.children].filter(k => k.offsetParent !== null);
    const saved = kids.map(k => k.scrollTop);
    kids.forEach(k => { k.style.height = ""; k.classList.remove("pair-scroll"); });
    if (kids.length !== 2 || Math.abs(kids[0].getBoundingClientRect().top - kids[1].getBoundingClientRect().top) > 4) return;   /* stacked on narrow screens */
    const hs = kids.map(k => k.getBoundingClientRect().height);
    const target = Math.round(Math.max(Math.min(...hs), Math.min(FLOOR, Math.max(...hs))));
    kids.forEach((k, i) => { k.style.height = target + "px"; if (hs[i] > target + 1) { k.classList.add("pair-scroll"); k.scrollTop = saved[i]; } });
  }
  let queued = false;
  const run = () => { queued = false; document.querySelectorAll(SEL).forEach(fit); };
  const schedule = () => { if (!queued) { queued = true; requestAnimationFrame(run); } };
  new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true });
  addEventListener("resize", schedule);
  document.fonts?.ready?.then(schedule);
})();
