    "Regular plans have higher costs on the same portfolio, so their returns are slightly lower, not higher."],
   "SEBI's 2026 framework makes costs clearer, so clients will ask more often. RMs who explain value openly keep clients; those who dodge the question lose them.",
   "Never defend a regular plan by attacking direct plans. Defend it with the value you add.",
   "Same portfolio, different service. Be clear about both.",
   F("The client decides to switch ₹18 lakh to direct. What must be checked first?", ["Capital gains tax and any exit loads on the redemption", "Whether the NAV is higher in the direct plan", "The fund manager's new strategy", "The client's PAN"], 0,
    "Switching plans is a redemption plus a new purchase. Tax and exit loads can outweigh the cost saving for years.")),
  Q("d5q2", ["costs", "regulation"], [7, 9], "Under SEBI's 2026 regulations, what does the Base Expense Ratio (BER) represent?",
   ["The total of every cost, including taxes and stamp duty.",
    "The core cost of managing the fund (including permitted distribution expenses), with brokerage and statutory/regulatory levies shown separately.",
    "A fee paid by the investor directly to the distributor.",
    "The minimum return the fund must deliver."], 1,
   "The new structure separates what the AMC controls (BER) from brokerage and levies charged under law. This makes like-for-like cost comparisons clearer.",
   ["That describes the total expense ratio, not the BER. Statutory levies now sit outside the BER.",
    null,
    "Distribution costs are within the scheme's expenses in regular plans; investors don't pay distributors separately for MF distribution.",
    "No mutual fund has a guaranteed minimum return; BER is a cost measure."],
   "Cheaper trading (brokerage caps halved for cash trades) and clearer disclosure reduce costs for investors, which also raises the bar for distributors to show their value.",
   "\"SEBI now shows the cost of managing your fund separately from taxes and trading charges, so it's easier to compare.\"",
   "BER = management cost; levies = taxes and charges at actuals."),
  Q("d5q3", ["costs", "tax"], [5, 8], "A client wants to switch all funds to direct plans to save about 0.7% a year. Most units are 14 months old with large gains. What is the most important consideration?",
   ["Direct plans have lower NAVs, so they are cheaper to buy.",
    "Switching is a redemption that may trigger capital gains tax on the gains, and possibly exit loads — the immediate cost could exceed several years of savings.",
    "The switch is free because it's within the same AMC.",
    "There's nothing to consider; lower cost is always better immediately."], 1,
   "Equity LTCG above the ₹1.25 lakh annual exemption is taxed at 12.5%. On large gains, the immediate tax can easily exceed a 0.7% annual cost saving for several years. Exit loads may also apply.",
   ["A lower NAV doesn't make units cheaper; returns are in percentages.",
    null,
    "Switches within an AMC are still redemptions for tax purposes.",
    "Cost matters, but so does the cost of changing. Timing a switch (e.g., using the annual LTCG exemption) can reduce the hit."],
   "Good advice compares the full cost of acting with the full cost of not acting.",
   "\"Let's work out the tax first — there may be a smarter way to switch gradually.\"",
   "Every switch is a sale.")],
 "\"A direct plan is the same fund with lower cost because there's no advisor. A regular plan includes my service — planning, reviews and help when markets fall. You should choose based on whether that service is worth it to you.\"",
 ["Direct and regular plans hold the same portfolio.", "BER separates management cost from statutory levies (SEBI 2026).", "Switching plans is a taxable redemption — check before you move."])
];

/* ===== content/p1b.js — Phase 1 deep lessons, Days 6–10 ===== */
const P1B = [
L(6, ["products", "regulation"], "True to label: SEBI's 2026 category rules",
 S("SEBI rewrites the rules on mutual fund categories",
  ["SEBI's circular on Categorisation and Rationalisation of Mutual Fund Schemes (26 February 2026) introduced Life Cycle Funds — target-maturity, goal-oriented funds — and removed the old 'solution-oriented' category that held retirement and children's funds.",
   "Sectoral and thematic funds must limit portfolio overlap with other equity schemes (other than large-cap schemes) to 50%; existing schemes get up to three years to comply. Value and contra funds also face a 50% overlap cap.",
   "Equity funds may invest their residual portion in gold, silver and InvITs, and SEBI barred scheme names that emphasise only return potential."],
  "SEBI circular, 26 Feb 2026 (via Tata MF, Equitymaster, TrueData)", "https://www.sebi.gov.in/legal/circulars.html", "26 Feb 2026"),
 ["A category is a promise about what a fund will hold. SEBI's job is to make sure the name matches the portfolio.",
  "Before these rules, some 'thematic' funds held many of the same large companies as diversified funds. Investors thought they were diversifying when they were really doubling up.",
  "The 50% overlap cap forces sector and theme funds to be genuinely different. That makes them more useful as satellites — and also more volatile, because they're more concentrated.",
  "Life Cycle Funds give a structured way to invest for a dated goal. As with any new category, RMs should read the scheme documents carefully before recommending them."],
 { quote: "\"I already own three thematic funds and two flexi caps. Isn't that well diversified?\"",
   context: "Client has ₹30 lakh across five equity funds, all bought on recommendations from different people." },
 [Q("d6q1", ["products", "risk"], [7, 8], "Why does SEBI's 50% overlap cap on sectoral/thematic funds matter to investors?",
   ["It guarantees thematic funds will outperform.",
    "It makes sectoral and thematic funds genuinely different from diversified funds, so investors aren't unknowingly buying the same stocks twice — but it also makes them more concentrated.",
    "It reduces the risk of thematic funds to the level of large-cap funds.",
    "It means investors no longer need diversified funds."], 1,
   "The rule enforces 'true to label'. A defence or infrastructure fund will look more like its theme and less like a flexi cap. That's useful for diversification across funds, but the fund itself becomes more volatile.",
   ["Category rules govern portfolios, not returns.",
    null,
    "More concentration usually means more volatility, not less.",
    "Thematic funds are satellites. Diversified funds still form the core."],
   "Regulation increasingly pushes the industry towards clear, comparable products. Distributors who understand category rules can explain portfolios rather than just names.",
   "\"SEBI now makes theme funds stick to their theme. That's good for clarity, but it means each theme fund carries more of that theme's ups and downs.\"",
   "True to label means more honest — and often more concentrated."),
  Q("d6q2", ["products", "communication"], [5, 4], "The client above believes five funds equal good diversification. What's the best response?",
   ["\"Yes, five funds is always enough.\"",
    "\"The number of funds matters less than what's inside them. Let's check how much your funds overlap and how much depends on a few themes. You might be more concentrated than five funds suggests — or you may hold the same stocks several times.\"",
    "\"You should add five more funds.\"",
    "\"Sell everything and buy one index fund.\""], 1,
   "Diversification is about holdings and risk sources, not fund count. An overlap check is a practical, client-friendly next step.",
   ["Fund count is a poor proxy for diversification.",
    null,
    "More funds often adds overlap and complexity, not diversification.",
    "A drastic change without analysis ignores tax, suitability and the client's preferences."],
   "Portfolio reviews that simplify holdings are one of the most valued services an RM provides — and a natural way to consolidate assets.",
   "\"Let me check what's actually inside your five funds. It's the holdings that diversify you, not the number of funds.\"",
   "Count stocks and risks, not funds."),
  Q("d6q3", ["products", "regulation"], [9, 7], "Which statement about SEBI's February 2026 category rules is accurate?",
   ["Children's and retirement funds remain a separate 'solution-oriented' category.",
    "Life Cycle Funds were introduced as a new category, and the solution-oriented category was removed.",
    "Equity funds can no longer invest in anything other than equities.",
    "Fund names can now highlight expected returns."], 1,
   "The circular introduced Life Cycle Funds and discontinued the solution-oriented category. It also allowed equity funds to invest residual portions in gold, silver and InvITs, and barred return-focused names.",
   ["That category was removed under the 2026 circular.",
    null,
    "The opposite: residual portions can now include gold, silver and InvITs.",
    "SEBI barred names that emphasise only return potential."],
   "When regulation changes categories, existing investors aren't forced out, but RMs should understand how schemes are being merged or repositioned.",
   "Read the addendum when an AMC writes to you about a category change.",
   "New category: Life Cycle Funds. Removed: solution-oriented.")],
 "\"SEBI now makes funds stick closely to their label. That means fewer surprises, but it also means theme funds carry more concentrated risk — so we keep them as a smaller part of your portfolio.\"",
 ["The 2026 rules make funds 'true to label'.", "Overlap caps make thematic funds more concentrated, not safer.", "Diversification is about holdings, not the number of funds."]),

L(7, ["products", "returns", "communication"], "Why two similar-sounding funds deliver different returns",
 S("Same category, very different outcomes",
  ["In September 2026, the Nifty 50 fell about 6.0%, the Nifty Midcap 100 about 7.6% and the Nifty Smallcap 100 about 3.4%. Funds with similar names but different market-cap mixes would have had noticeably different months.",
   "Within any category, returns differ because of holdings, sector weights, cash levels, investment style and costs. A 'flexi-cap' fund can hold mostly large caps or a large mid-cap slice.",
   "Clients notice these differences — and often ask why their fund isn't the one at the top of the list."],
  "NSE index data via Navia monthly wrap", "https://www.niftyindices.com/", "30 Sep 2026"),
 ["A category defines the boundaries; the fund manager decides what happens inside them. Two flexi-cap funds can have very different portfolios.",
  "Common reasons for different returns: market-cap mix, sector weights, growth vs value style, concentration, cash holdings, and expense ratio.",
  "Style matters over cycles. A value-oriented fund may lag in a momentum-led market and lead when that reverses. Short-term differences don't necessarily mean one manager is better.",
  "The fair comparison is with the fund's own benchmark and with peers over rolling periods — not one fund's best year against another's worst."],
 { quote: "\"My fund and my brother's fund are both 'flexi cap', but his did much better this year. Did I choose the wrong fund?\"",
   context: "Client's fund has a value tilt; his brother's has a growth/mid-cap tilt. Over five years their returns are similar." },
 [Q("d7q1", ["products", "communication"], [5, 10], "How should you respond to the client above?",
   ["\"Yes, switch to your brother's fund.\"",
    "\"Both are flexi caps, but they're managed differently — his fund leans to growth and mid-caps, which led this year; yours leans to value, which tends to do better in different phases. Over five years they've done similarly. Let's judge your fund against its benchmark and over several periods, not one year.\"",
    "\"Your brother's fund is riskier, so it will crash soon.\"",
    "\"All flexi-cap funds should give the same return.\""], 1,
   "It explains the real driver (style and holdings), adds the long-term context, and offers a fair way to judge performance.",
   ["Switching on one year's comparison is performance chasing and may cost tax and exit loads.",
    null,
    "A prediction you can't support. It may or may not fall.",
    "Category rules allow very different portfolios."],
   "Style rotation is normal. Investors who switch to whatever led last year often end up buying each style after its best run.",
   "\"Two funds with the same label can have different engines. Let's judge yours on its own track, over several years.\"",
   "Same label, different engine."),
  Q("d7q2", ["returns", "products"], [4, 7], "Which comparison is the most reasonable way to judge a fund?",
   ["Its last 1-year return against the best fund in any category.",
    "Its rolling returns against its benchmark and against category peers over multiple periods.",
    "Its NAV level against other funds' NAVs.",
    "Its advertising against other AMCs' advertising."], 1,
   "Rolling returns across many periods show consistency and reduce the luck of a single start date. Comparing against benchmark and peers keeps it like-for-like.",
   ["Cross-category, single-period comparisons mix different risks and reward luck.",
    null,
    "NAV level says nothing about performance. A ₹10 NAV isn't 'cheaper' than ₹500.",
    "Marketing has nothing to do with returns."],
   "Many 'top funds' lists are based on trailing returns that change month to month. Consistent process matters more than recent rank.",
   "\"I look at how often the fund beat its benchmark across many periods, not just the latest year.\"",
   "Judge funds over many periods, against the right yardstick."),
  Q("d7q3", ["products", "risk"], [4, 8], "A client says: \"Fund A returned 22% last year and Fund B returned 12%, so Fund A is better.\" What is missing from this conclusion?",
   ["Nothing — higher return is always better.",
    "Whether the funds are in the same category, the risks each took, how they did in falls, and whether last year's difference persists over longer periods.",
    "Which fund has the newer logo.",
    "Which fund has more SIP accounts."], 1,
   "Return without risk and context is incomplete. Fund A may be a small-cap fund in a strong small-cap year, with much deeper falls in bad years.",
   ["Higher return often comes with higher risk. The question is whether that risk suits the client.",
    null,
    "Branding is irrelevant.",
    "Popularity is not quality."],
   "Teaching clients to ask 'at what risk?' is one of the most protective habits you can build.",
   "\"22% is great — let's also see how much it fell in bad years, and whether you'd be comfortable with that.\"",
   "Return without risk is half a story.")],
 "\"Funds with the same label can be built very differently. What matters is whether your fund does its own job well over time, not whether it topped this year's list.\"",
 ["Category sets limits; managers choose holdings.", "Style differences drive short-term gaps.", "Compare against benchmark and peers over rolling periods."]),

L(8, ["returns", "communication"], "Why your portfolio return differs from the fund's published return",
 S("The fund's return and the investor's return are different numbers",
  ["Every factsheet shows point-to-point returns: what a single investment made on a specific date would have earned. Very few investors invest exactly that way.",
   "With markets falling in 2026, clients compare their statements with factsheets and ask why the numbers differ. The answer is almost always timing and cash flows — not an error.",
   "SEBI requires standard return disclosures so funds can be compared. Personal returns need a different calculation."],
  "Standard MF return disclosure practice (SEBI/AMFI)", "https://www.amfiindia.com/investor-corner", "Concept lesson"),
 ["Published returns assume a single lump sum held for the full period, in that specific plan, before any taxes.",
  "An investor's return depends on when each rupee went in and came out. Two people in the same fund over the same three years can have very different returns.",
  "Other differences: direct vs regular plan, exit loads, taxes on redemption, and any switches between funds.",
  "XIRR is the right tool for personal returns because it accounts for the timing and size of each cash flow."],
 { quote: "\"The factsheet says my fund returned 15% a year over three years, but my statement shows 9%. Is someone making a mistake?\"",
   context: "Client invested ₹2 lakh three years ago and ₹8 lakh more 14 months ago, near a market high." },
 [Q("d8q1", ["returns", "communication"], [6, 10], "What is the best explanation for the client above?",
   ["\"The AMC must have made an error.\"",
    "\"The 15% assumes all your money went in three years ago. Most of yours — ₹8 lakh — went in 14 months ago when the market was higher, so your overall return reflects that later timing.\"",
    "\"Factsheet returns are always exaggerated.\"",
    "\"You're in the wrong fund.\""], 1,
   "The difference comes from cash-flow timing. Most of his money hasn't had the fund's full three-year period, and it entered at a higher level.",
   ["There's no error; the two numbers measure different things.",
    null,
    "Published returns follow standard rules and are accurate for what they measure.",
    "The fund did what it reported; the gap comes from when he invested."],
   "Explaining this clearly prevents clients from switching away from good funds for the wrong reason.",
   "\"Your return is about your money's journey. The factsheet's return is about a single rupee invested on day one.\"",
   "The fund's return isn't the investor's return — timing makes the difference."),
  Q("d8q2", ["returns"], [7, 4], "Which factor does NOT explain a difference between a published fund return and a client's actual return?",
   ["Timing of the client's investments and withdrawals.",
    "Whether the client is in the direct or regular plan.",
    "Exit loads and taxes paid on redemption.",
    "The total number of investors in the fund."], 3,
   "How many other investors hold the fund doesn't change your client's return. The NAV is the same for every unit in a plan.",
   ["Timing is usually the biggest driver of differences.",
    "Direct and regular plans have different NAVs because of cost differences.",
    "Published returns are pre-exit-load and pre-tax.",
    null],
   "Knowing which factors matter lets you diagnose a client's question in seconds.",
   "Check timing first, then plan type, then loads and taxes.",
   "Same NAV for everyone in a plan; different journeys for each investor."),
  Q("d8q3", ["returns", "sip"], [5, 7], "A client in the same fund as his neighbour has a very different XIRR. Both invested ₹5 lakh. What's the most likely reason?",
   ["One of them received a special NAV.",
    "They invested at different times — one perhaps as a lump sum, the other via SIP — so their average cost and holding period differ.",
    "XIRR is random.",
    "The neighbour must be in a different category."], 1,
   "Same fund, same amount, different timing equals different results. XIRR captures exactly that.",
   ["All investors in a plan transact at the same declared NAV for that day.",
    null,
    "XIRR is a precise calculation based on dates and amounts.",
    "Same fund means same category; timing explains the gap."],
   "This is a good moment to reinforce that staying invested matters more than the exact entry point.",
   "Use the client's own transaction dates when explaining.",
   "Different timing, different XIRR.")],
 "\"The fund's published return assumes you put all your money in on one day and left it there. Your money went in at different times, so your return tells your story — and that's the number we plan with.\"",
 ["Published returns assume one lump sum on one date.", "Personal returns depend on timing — use XIRR.", "Plan type, loads and taxes also create gaps."]),

L(9, ["sip", "equity", "communication"], "Lump sum, SIP or STP when markets are down",
 S("Nifty ends September 2026 about 13% lower for the year",
  ["The Nifty 50 fell about 6% in September 2026 to 22,620, its worst month since March, and was roughly 13% down for the calendar year and about 14% below its 52-week high.",
   "Foreign portfolio investors sold about ₹35,861 crore of Indian equities in September per NSDL data, alongside higher crude prices, a weaker rupee and rising US yields — even as India's GDP grew 7.8% in the April–June quarter.",
   "Clients with cash are now asking a natural question: is this a good time to invest a lump sum?"],
  "NSE / NSDL data via 5paisa, Navia and Business Standard", "https://www.nseindia.com/", "30 Sep–1 Oct 2026"),
 ["Nobody can reliably call the bottom. A market down 13% can fall further or recover — both have happened many times.",
  "Lump sum investing gets money working sooner; historically, in rising markets, that tends to win. SIP and STP spread the entry over time, reducing regret if markets fall further.",
  "An STP (systematic transfer plan) parks the lump sum in a liquid or low-duration fund and transfers fixed amounts to equity over several months. It's a practical middle path.",
  "The right choice depends on the client's horizon, risk tolerance and — importantly — how they'd feel if markets fell another 10% next month."],
 { quote: "\"Is this a good time to invest a lump sum? Markets have fallen a lot.\"",
   context: "Client received ₹25 lakh from a property sale. Goal: retirement in 12 years. Moderate-to-high risk tolerance, but anxious about volatility." },
 [Q("d9q1", ["sip", "communication"], [5, 10], "What is the most responsible answer for the client above?",
   ["\"Yes, markets are down 13%, so now is definitely the bottom.\"",
    "\"No one can tell whether markets will fall further. Your horizon is 12 years, so equity fits — but since you're anxious about volatility, we could invest part now and move the rest through an STP over 6–12 months, so you're not relying on perfect timing.\"",
    "\"Wait until the market recovers before investing.\"",
    "\"Put it all in a small-cap fund since they've fallen.\""], 1,
   "It is honest about uncertainty, fits his horizon and temperament, and gives a concrete plan that reduces regret either way.",
   ["Calling a bottom is a prediction. If markets fall another 10%, trust is lost.",
    null,
    "Waiting for recovery usually means buying at higher prices later.",
    "Choosing the most volatile category for an anxious client ignores suitability."],
   "Investor regret is asymmetric: losing money right after investing hurts more than missing a rally. A staggered plan respects that.",
   "\"I can't tell you where the bottom is. I can help you invest in a way that works whether markets rise or fall from here.\"",
   "When unsure of timing, stagger the entry, not the decision."),
  Q("d9q2", ["equity", "economy"], [1, 4], "India's GDP grew 7.8% in April–June 2026, yet the Nifty fell about 6% in September. Which explanation is most reasonable?",
   ["Markets are disconnected from the economy and should be ignored.",
    "Stock prices reflect expectations, valuations and global flows — FPI selling, higher crude, a weaker rupee and higher US yields can outweigh strong current growth.",
    "The GDP data must be wrong.",
    "Strong GDP always causes markets to rise the next month."], 1,
   "Markets price the future and react to many forces, not just current GDP. In September, foreign selling and global pressures dominated.",
   ["Markets are connected to the economy over the long term — just not month to month.",
    null,
    "There's no basis for doubting the data; markets and GDP measure different things.",
    "Short-term market moves often diverge from current growth figures."],
   "Over long periods, earnings growth drives market returns. Over short periods, sentiment, flows and valuations dominate.",
   "\"The economy is doing well; markets are reacting to global money moving out and oil prices. Over years, company profits matter more than these swings.\"",
   "GDP is the economy today; markets are expectations about tomorrow."),
  Q("d9q3", ["sip", "products"], [7, 4], "How does an STP work for a lump-sum investor?",
   ["It invests the full amount in equity immediately and transfers profits to a bank.",
    "It parks the lump sum in a lower-volatility fund and moves a fixed amount into an equity fund at regular intervals.",
    "It guarantees a minimum return during the transfer period.",
    "It is a type of fixed deposit."], 1,
   "STP spreads equity entry while the remaining money stays in a liquid or short-term debt fund.",
   ["That describes something closer to a profit-transfer arrangement, not a standard STP.",
    null,
    "STPs carry the risks of the underlying funds; there's no guarantee.",
    "STP is a mutual fund facility, not a deposit."],
   "Each STP transfer is a redemption from the source fund, so short-term gains on the debt fund may be taxed. Mention this.",
   "\"Your money waits in a low-risk fund and moves into equity month by month.\"",
   "STP = staggered entry with a parking place.")],
 "\"I can't promise this is the bottom. What I can do is put your money to work in a way you'll be comfortable with whether markets go up or down next month.\"",
 ["Nobody can reliably time the bottom.", "STP is a practical middle path for anxious lump-sum investors.", "Markets can fall even when GDP is strong."]),

L(10, ["behaviour", "risk", "equity"], "Market falls are normal — how you talk about them is not",
 S("Domestic money keeps buying as foreign investors sell",
  ["FPIs sold about ₹2.70 lakh crore of Indian equities in calendar 2026 up to 1 October, per NSDL data. Domestic institutions absorbed much of this selling.",
   "Equity mutual fund inflows actually rose about 31% in September even as markets fell — a sign that many investors now see falls as part of investing.",
   "But not every client is calm. Market falls are when RMs build or lose trust."],
  "NSDL FPI data; AMFI September 2026", "https://www.fpi.nsdl.co.in/", "1 Oct 2026"),
 ["Declines of 10% or more happen in most years. Deeper bear markets come every few years. They are a normal cost of earning equity returns.",
  "The most damaging investor decisions usually happen during falls: stopping SIPs, redeeming at lows, or switching to whatever just held up best.",
  "What clients need during a fall: context (this is normal), connection to their plan (their goal hasn't changed), and honesty (you can't promise when it ends).",
  "Proactive calls work better than reactive ones. Calling before the client panics changes the conversation."],
 { quote: "\"The market keeps falling every week. Should I sell everything and come back when things settle?\"",
   context: "Client is 38, investing for retirement and child education, portfolio down about 11% this year." },
 [Q("d10q1", ["behaviour", "communication"], [5, 10], "Which response is most appropriate?",
   ["\"Yes, sell now and buy back once markets have recovered.\"",
    "\"Falls like this are uncomfortable but normal — your goals are 10 to 20 years away and haven't changed. Selling now locks in the loss, and markets often recover before things 'feel settled'. Let's check your allocation is still right for you rather than react to the last few weeks.\"",
    "\"Markets will definitely recover by Diwali.\"",
    "\"Don't look at your portfolio for five years.\""], 1,
   "It validates the discomfort, gives context, connects to his goals and offers a sensible review — without timing promises.",
   ["Selling and buying back requires being right twice. Most investors who try miss the recovery.",
    null,
    "A date-specific promise you can't control.",
    "Dismissive advice doesn't address the client's feelings or check suitability."],
   "Recoveries often begin when news is still bad. Investors waiting for comfort usually re-enter at higher prices.",
   "\"Your goals haven't moved; only prices have. Let's make sure your plan still fits you.\"",
   "Selling in a fall turns a temporary loss into a permanent one."),
  Q("d10q2", ["global", "equity"], [1, 6], "FPIs sold over ₹2.7 lakh crore of Indian equities in 2026, but markets have fallen far less than such selling once would have caused. What best explains this?",
   ["RBI bought the shares.",
    "Domestic investors — mutual funds through SIPs, insurers and others — have absorbed much of the selling.",
    "FPI selling has no effect on prices.",
    "SEBI stopped FPIs from selling."], 1,
   "Steady SIP flows give domestic funds money to invest every month, cushioning the impact of foreign selling.",
   ["RBI doesn't buy equities to support markets.",
    null,
    "FPI selling clearly affected prices; it's been cushioned, not neutralised.",
    "There's no such restriction."],
   "This shift in market structure is a genuine change from a decade ago, and RMs' clients are part of it.",
   "\"Your SIP is part of the domestic money that's steadying the market when foreigners sell.\"",
   "Domestic flows cushion falls; they don't prevent them."),
  Q("d10q3", ["communication", "risk"], [10, 8], "Which is the most effective habit for RMs during a market fall?",
   ["Wait for clients to call before discussing the market.",
    "Call clients proactively with context and a reminder of their plan, especially those most likely to be anxious.",
    "Send a single message promising markets will recover soon.",
    "Recommend switching all clients to debt funds."], 1,
   "Proactive contact reduces panic decisions and builds trust. Clients remember who called them when markets fell.",
   ["By the time anxious clients call, they've often already decided to sell.",
    null,
    "Blanket promises are inaccurate and risky.",
    "A blanket switch ignores individual suitability and may trigger tax."],
   "Retention through a fall protects both the client's outcomes and the RM's AUM.",
   "\"I'm calling because markets have been rough. Your plan is still on track — here's what we're watching.\"",
   "Call before they call you.")],
 "\"A fall like this is uncomfortable, but it's part of how equity works. Your goals haven't changed. Let's make sure your plan still fits you, rather than let the last few weeks make the decision.\"",
 ["10%+ falls are normal for equities.", "Selling in a fall locks in losses.", "Proactive calls prevent panic decisions."])
];

/* ===== content/p1c.js — Phase 1 deep lessons, Days 11–15 ===== */
const P1C = [
L(11, ["products", "regulation", "risk"], "MF, SIF, PMS, AIF — and what you're allowed to sell",
 S("Specialised Investment Funds: a new rung between MF and PMS",
  ["Specialised Investment Funds (SIFs) sit between mutual funds and PMS, with a minimum investment of ₹10 lakh. They can run strategies such as long-short equity with limited short exposure through derivatives. SIF assets were about ₹10,620 crore by March 2026.",
   "Importantly for distributors: selling SIFs requires the additional NISM Series XIII certification. A regular ARN-holding mutual fund distributor cannot distribute SIFs without it.",
   "The 2026 MF regulations brought SIFs into the main regulatory framework."],
  "AMFI monthly note Mar 2026; Value Research; iPleaders", "https://www.valueresearchonline.com/learn/mutual-funds/sebi-mutual-fund-regulations-2026/", "Aug 2026"),
 ["Minimums: MFs from a few hundred rupees; SIFs ₹10 lakh; PMS ₹50 lakh; AIFs ₹1 crore.",
  "In mutual funds and SIFs, trades inside the fund aren't taxed in the investor's hands until redemption. In PMS, securities sit in the client's own demat account, so each trade can create a tax event.",
  "Higher minimums usually mean more flexibility for the manager and more concentrated or complex risk — not automatically better outcomes.",
  "Your role is defined by your certifications and your firm's approved processes. Knowing what you can't sell is as important as knowing what you can."],
 { quote: "\"My friend invested in a new long-short fund with ₹10 lakh. Can you get me into that through my usual mutual fund account?\"",
   context: "You hold an ARN and NISM V-A but not NISM Series XIII." },
 [Q("d11q1", ["products", "regulation"], [7, 8], "What is the correct response to the client above?",
   ["\"Yes, any mutual fund distributor can sell SIFs.\"",
    "\"That's a Specialised Investment Fund, which needs a separate certification to distribute. I'm not currently authorised to sell it, but I can explain how it works and its risks, and we can route it through an authorised channel at the firm if it suits you.\"",
    "\"SIFs are illegal.\"",
    "\"It's the same as a regular mutual fund, so just invest through the MF route.\""], 1,
   "It's accurate about your authorisation, still helpful, and keeps the decision within proper channels.",
   ["SIF distribution requires NISM Series XIII certification in addition to the usual MF requirements.",
    null,
    "SIFs are a SEBI-regulated product.",
    "SIFs have different minimums and can use strategies — like limited shorting — that regular MFs largely can't."],
   "As products get more sophisticated, compliance boundaries matter more. Clients respect an RM who is clear about them.",
   "Never stretch your authorisation to close a sale.",
   "Know your licence: SIF needs NISM XIII."),
  Q("d11q2", ["products", "tax"], [7, 4], "A client with ₹60 lakh is choosing between a mutual fund and a PMS with similar strategies. What important difference should you explain?",
   ["PMS always gives higher returns because the minimum is higher.",
    "In PMS, trades happen in the client's own account and can be taxed as they occur; in a mutual fund, trades inside the fund aren't taxed in the investor's hands until redemption.",
    "Mutual funds cannot hold equities.",
    "PMS has no costs."], 1,
   "Tax treatment of portfolio churn differs meaningfully. A strategy with high turnover can create recurring tax in PMS that a mutual fund defers.",
   ["Minimum size doesn't determine returns.",
    null,
    "Equity is the largest part of MF industry assets.",
    "PMS has management fees and often performance fees."],
   "Comparing structures on a post-tax, post-cost basis is a core advisory skill.",
   "\"Let's compare these after tax and after fees — the structure matters as much as the strategy.\"",
   "Structure changes the tax, even if the strategy looks the same."),
  Q("d11q3", ["products", "risk"], [4, 8], "Which belief about higher-minimum products is a misconception?",
   ["Higher minimums often allow more concentrated or complex strategies.",
    "A ₹1 crore AIF is inherently safer than a ₹500 SIP in a diversified mutual fund.",
    "Higher-minimum products can have different liquidity terms.",
    "Suitability depends on the investor's situation, not just their wealth."], 1,
   "Ticket size is not a safety measure. Concentrated or complex strategies can be riskier than a diversified fund.",
   ["Accurate. Fewer restrictions allow more concentration.",
    null,
    "Accurate. Some products have lock-ins or limited redemption windows.",
    "Accurate. Wealth alone doesn't make a product suitable."],
   "'Exclusive' products appeal to HNIs emotionally. Your job is to make sure the risk is understood, not just the prestige.",
   "\"Higher minimum means more freedom for the manager — which can mean more risk, not less.\"",
   "Exclusive isn't the same as safe.")],
 "\"This product needs a separate licence to distribute, which I don't hold. I can explain how it works and its risks, and help you access it through the right channel if it suits you.\"",
 ["SIF: ₹10 lakh minimum; distributors need NISM Series XIII.", "PMS trades can be taxed in your own account; MF trades are deferred.", "Higher minimum ≠ lower risk."]),

L(12, ["tax", "costs", "communication"], "Tax and exit loads: the hidden cost of switching",
 S("Should a client switch from equity to gold after gold's rally?",
  ["Gold traded near $4,200 an ounce on 13 October 2026, with MCX gold near ₹1.49 lakh per 10 grams — well below its 2026 high of about ₹1.81 lakh. Silver had fallen to about $60 an ounce from a 2026 high near $122.",
   "After big moves in any asset, clients ask about switching. Every switch from one fund to another is a sale for tax purposes.",
   "Equity long-term gains above ₹1.25 lakh a year are taxed at 12.5%; short-term equity gains at 20%. Exit loads may also apply."],
  "Business Standard (MCX/Comex prices, 13 Oct 2026); Income-tax rules as of FY2026-27", "https://www.business-standard.com/markets/commodities", "13 Oct 2026"),
 ["Switching = redemption + purchase. The redemption can trigger capital gains tax and exit loads.",
  "Equity funds: units held over 12 months are long-term; gains above ₹1.25 lakh a year taxed at 12.5%. Under 12 months: 20%.",
  "The ₹1.25 lakh annual LTCG exemption can be used to rebalance gradually or to 'harvest' gains each year.",
  "Before any switch, compare the expected benefit with the certain cost. Clients rarely see the tax until it's too late."],
 { quote: "\"Gold has done better than my equity funds. I want to switch ₹10 lakh from equity to gold right now.\"",
   context: "Units bought 9 months ago are at a small gain; units bought 3 years ago have large gains." },
 [Q("d12q1", ["tax", "communication"], [5, 7], "What should you discuss first?",
   ["Nothing — switching is free within mutual funds.",
    "Why they want to switch, whether it fits their allocation, and the tax and exit load cost: units under 12 months old are taxed at 20% on gains, and older units at 12.5% above the annual exemption.",
    "Only which gold fund has the lowest NAV.",
    "Whether gold will rise further next month."], 1,
   "The decision should be about allocation first; the tax and exit load cost then shapes how and when to do it.",
   ["Switches are taxable redemptions.",
    null,
    "NAV level is irrelevant to value.",
    "Nobody knows; and forecasting isn't the basis for an allocation decision."],
   "Gold had already fallen well below its 2026 peak by October — a reminder that switching after a rally can mean buying high.",
   "\"Let's first decide if more gold suits your plan. Then we'll work out the cheapest way to get there.\"",
   "Allocation first, tax second, timing never."),
  Q("d12q2", ["tax"], [7, 5], "A client has ₹3 lakh of long-term equity gains this year and wants to rebalance. How does the ₹1.25 lakh LTCG exemption help?",
   ["It makes all gains tax-free.",
    "Up to ₹1.25 lakh of long-term equity gains each year are exempt, so rebalancing can be spread across years to reduce tax.",
    "It only applies to debt funds.",
    "It must be claimed in advance with the AMC."], 1,
   "The exemption is annual. Spreading rebalancing over two financial years can use it twice.",
   ["Only gains above the threshold are taxed; the exemption doesn't cover everything.",
    null,
    "It applies to equity-oriented funds and listed equity.",
    "It's applied when filing tax returns."],
   "Tax-aware rebalancing is a high-value service clients rarely do on their own.",
   "\"We can split this across two financial years to use your tax-free limit twice.\"",
   "₹1.25 lakh a year of equity LTCG is exempt — use it deliberately."),
  Q("d12q3", ["tax", "risk"], [4, 3], "\"I'll switch funds every time another fund does better — it costs nothing.\" What's wrong with this belief?",
   ["Nothing; mutual fund switches are free.",
    "Frequent switches can trigger exit loads and capital gains tax, and usually mean buying last year's winner after its best run.",
    "SEBI bans investors from switching.",
    "Switching is only allowed once a year."], 1,
   "The costs are real and the behaviour is performance chasing. Both reduce long-term returns.",
   ["Switches carry tax and possibly exit loads.",
    null,
    "Switching is allowed; it just isn't free.",
    "There's no such limit."],
   "Explaining switching costs is one of the simplest ways to protect client returns.",
   "\"Every switch is a sale. Let's only switch when your plan needs it, not when a chart tempts you.\"",
   "Switching has a price tag.")],
 "\"Switching between funds counts as selling, so there may be tax and exit loads. Let's first decide whether the change fits your plan — then do it in the cheapest way.\"",
 ["Every switch is a taxable sale.", "Equity LTCG: 12.5% above ₹1.25 lakh/year; STCG: 20%.", "Use the annual exemption to rebalance in stages."]),

L(13, ["products", "costs", "flows"], "Active vs passive: explaining index funds honestly",
 S("Equity ETFs draw almost ₹10,000 crore in September",
  ["Equity ETFs received about ₹9,960 crore of net inflows in September 2026, alongside ₹4,451 crore into gold ETFs and ₹1,974 crore into silver ETFs.",
   "SEBI's 2026 framework sets a BER ceiling of 0.90% for index funds and ETFs, excluding statutory levies, and many large index funds cost far less.",
   "Passive investing is growing. RMs need a clear, honest view of where it fits."],
  "AMFI September 2026 via The Hans India; Wright Research", "https://www.amfiindia.com/research-information/amfi-monthly", "12 Oct 2026"),
 ["Index funds and ETFs aim to match an index, minus costs. They don't try to beat it.",
  "Their strengths: low cost, transparency and no manager risk. Their weakness: they fall fully with the market and can't avoid overvalued stocks.",
  "In large caps, many active funds have struggled to beat the index consistently after costs. In mid and small caps, active management has more room to add value — though not guaranteed.",
  "A balanced view: use passive where markets are efficient and cost matters most; use active where a manager's process can add value; always judge by the client's needs."],
 { quote: "\"I read that index funds are cheaper and beat most active funds. Why should I pay for an active fund?\"",
   context: "Client holds two active large-cap funds and an active mid-cap fund." },
 [Q("d13q1", ["products", "communication"], [10, 7], "What's the most balanced response?",
   ["\"Index funds are always worse because nobody manages them.\"",
    "\"In large caps, low-cost index funds are hard to beat and could replace part of your large-cap allocation. In mid caps, active managers have more room to add value, though that isn't guaranteed. Let's look at whether your active funds have earned their extra cost over several years.\"",
    "\"Active funds always beat index funds.\"",
    "\"Move everything to index funds today.\""], 1,
   "It's honest, evidence-based and specific to segments, and it proposes an objective review.",
   ["Index funds are deliberately unmanaged; that's their strength on cost.",
    null,
    "Many active large-cap funds have struggled to beat the index after costs.",
    "A blanket switch ignores tax, mid-cap opportunities and the client's preferences."],
   "Distributors who recommend passive where it fits build credibility for their active recommendations.",
   "\"Let's use low cost where it works best and active management where it has more room to help.\"",
   "Passive where markets are efficient; active where managers can add value."),
  Q("d13q2", ["products", "risk"], [4, 8], "\"Index funds are safe because they're diversified and low-cost.\" What's the flaw?",
   ["There is no flaw.",
    "Low cost and diversification don't protect against market falls — an index fund falls fully with the market.",
    "Index funds hold only one stock.",
    "Index funds are not regulated."], 1,
   "A Nifty 50 index fund fell about as much as the Nifty's ~6% in September 2026. Diversification reduces company-specific risk, not market risk.",
   ["Diversification and cost are real benefits, but not protection from market risk.",
    null,
    "They hold every stock in the index.",
    "They're regulated mutual funds or ETFs."],
   "'Safe' is a dangerous word in client conversations. Use 'diversified' or 'low-cost' instead.",
   "\"An index fund will fall when the market falls — what it does well is keep costs low.\"",
   "Diversified isn't the same as safe."),
  Q("d13q3", ["flows", "products"], [6, 1], "September 2026 saw ₹9,960 crore into equity ETFs, ₹4,451 crore into gold ETFs and ₹1,974 crore into silver ETFs. What's a reasonable interpretation?",
   ["Investors are using ETFs across asset classes, including precious metals, alongside regular funds.",
    "Active funds will disappear next year.",
    "Silver ETFs are now less risky than equity ETFs.",
    "ETFs can't fall in value."], 0,
   "The flows show broad ETF adoption across equity, gold and silver. They don't imply anything about returns or risk.",
   [null,
    "Equity active funds still received far larger inflows in the same month.",
    "Silver had fallen roughly 50% from its 2026 high by October — it's highly volatile.",
    "ETFs track underlying assets and fall when those assets fall."],
   "Precious-metal ETF inflows during price corrections can be dip-buying or chasing; ask clients which it is for them.",
   "\"ETFs are a tool, not a strategy. What matters is how much of each asset fits your plan.\"",
   "ETF flows show tools in use, not returns to come.")],
 "\"Index funds are a low-cost way to own the market, and they fall when the market falls. Active funds cost more and need to earn it. Let's use each where it makes most sense for you.\"",
 ["Passive: low cost, full market risk.", "Large caps are hard to beat after costs; mid/small give active managers more room.", "Never call any equity fund 'safe'."]),

L(14, ["behaviour", "silver", "gold", "risk"], "Chasing precious metals: lessons from silver's swing",
 S("Silver near $60 after touching about $122 earlier in 2026",
  ["Silver traded near $60.50 an ounce on 13 October 2026, roughly half its 2026 high near $122. MCX silver was near ₹2.23 lakh per kg against a 2026 high of about ₹4.20 lakh.",
   "In 2025, silver had its strongest annual performance since 1979, according to the Silver Institute — which drew in many new investors.",
   "Investors still put ₹1,974 crore into silver ETFs in September 2026. Some are buying the dip deliberately; others may not understand how volatile silver is."],
  "Business Standard (13 Oct 2026); Silver Institute (Feb 2026); AMFI Sep 2026", "https://www.silverinstitute.org/", "13 Oct 2026"),
 ["Silver is both a precious and an industrial metal, and its market is smaller than gold's. That makes it far more volatile.",
  "Investors who bought near the top after a record year may be down around 50%. Recovering from a 50% fall needs a 100% gain.",
  "Precious metals belong in portfolios as diversifiers in measured amounts — not as the main return engine, and not bought because they just rallied.",
  "A good RM checks whether a client understands the downside before discussing upside."],
 { quote: "\"Silver has crashed. I want to put ₹15 lakh in now to make back what I lost on my earlier silver investment.\"",
   context: "Client put ₹5 lakh into a silver ETF near the 2026 peak. Total investable assets ₹40 lakh." },
 [Q("d14q1", ["silver", "behaviour", "risk"], [5, 8], "What is the main concern with the client's plan?",
   ["None — buying after a fall always works.",
    "He's trying to recover a loss by increasing concentration in a very volatile asset. Putting ₹15 lakh of ₹40 lakh into silver could leave half his wealth exposed to further large swings.",
    "Silver can't fall further.",
    "Silver ETFs aren't regulated."], 1,
   "'Making back' a loss in the same asset is a common emotional trap. Allocation should be decided by the plan, not by the desire to recover.",
   ["Falls can continue. Silver is volatile in both directions.",
    null,
    "There is no floor on prices.",
    "Silver ETFs are SEBI-regulated."],
   "Loss-recovery thinking leads investors to take more risk at exactly the moment they feel least rational.",

 ["\"हाँ, पाँच फंड हमेशा काफ़ी हैं।\"", "\"फंड की गिनती से ज़्यादा मायने रखता है कि उनके अंदर क्या है। देखते हैं आपके फंड कितना ओवरलैप करते हैं और कितना कुछ थीम पर टिका है। हो सकता है आप पाँच फंड के हिसाब से ज़्यादा केंद्रित हों — या वही शेयर कई बार रखे हों।\"", "\"आपको पाँच और फंड जोड़ने चाहिए।\"", "\"सब बेचकर एक इंडेक्स फंड ले लीजिए।\""]],
d6q3: ["SEBI के फ़रवरी 2026 के कैटेगरी नियमों के बारे में कौन-सा कथन सही है?",
 ["चिल्ड्रन और रिटायरमेंट फंड अब भी अलग 'सॉल्यूशन-ओरिएंटेड' कैटेगरी में हैं।", "Life Cycle Funds नई कैटेगरी के रूप में आए, और सॉल्यूशन-ओरिएंटेड कैटेगरी हटा दी गई।", "इक्विटी फंड अब इक्विटी के अलावा कहीं निवेश नहीं कर सकते।", "फंड के नाम अब अपेक्षित रिटर्न को उजागर कर सकते हैं।"]],
d7q1: ["ऊपर वाले क्लाइंट को आप कैसे जवाब देंगे?",
 ["\"हाँ, अपने भाई वाले फंड में स्विच कर लीजिए।\"", "\"दोनों फ्लेक्सी कैप हैं, लेकिन अलग तरह से मैनेज होते हैं — उनका फंड ग्रोथ और मिड कैप की ओर झुका है, जिन्होंने इस साल अच्छा किया; आपका वैल्यू की ओर झुका है, जो दूसरे दौर में बेहतर करता है। पाँच साल में दोनों ने लगभग बराबर किया है। अपने फंड को एक साल नहीं, बल्कि उसके बेंचमार्क के मुकाबले कई अवधियों में परखते हैं।\"", "\"आपके भाई का फंड ज़्यादा जोखिम वाला है, जल्द गिरेगा।\"", "\"सभी फ्लेक्सी कैप फंड्स को एक जैसा रिटर्न देना चाहिए।\""]],
d7q2: ["किसी फंड को परखने का सबसे उचित तरीका कौन-सा है?",
 ["उसका पिछले 1 साल का रिटर्न किसी भी कैटेगरी के सबसे अच्छे फंड से तुलना करना।", "उसके रोलिंग रिटर्न की तुलना उसके बेंचमार्क और उसी कैटेगरी के फंड्स से कई अवधियों में करना।", "उसके NAV स्तर की तुलना दूसरे फंड्स के NAV से करना।", "उसके विज्ञापन की तुलना दूसरी AMC के विज्ञापन से करना।"]],
d7q3: ["क्लाइंट कहता है: \"फंड A ने पिछले साल 22% दिया और फंड B ने 12%, इसलिए फंड A बेहतर है।\" इस निष्कर्ष में क्या कमी है?",
 ["कुछ नहीं — ज़्यादा रिटर्न हमेशा बेहतर है।", "क्या दोनों फंड एक ही कैटेगरी के हैं, हर एक ने कितना जोखिम लिया, गिरावट में कैसा किया, और क्या पिछले साल का अंतर लंबी अवधि में भी रहता है।", "किस फंड का लोगो नया है।", "किस फंड में ज़्यादा SIP अकाउंट हैं।"]],
d8q1: ["ऊपर वाले क्लाइंट के लिए सबसे अच्छी व्याख्या क्या है?",
 ["\"AMC से कोई गलती हुई होगी।\"", "\"15% यह मानकर है कि आपका सारा पैसा तीन साल पहले लगा। आपका ज़्यादातर पैसा — ₹8 लाख — 14 महीने पहले लगा जब बाज़ार ऊँचा था, इसलिए आपका कुल रिटर्न उस बाद के समय को दिखाता है।\"", "\"फ़ैक्टशीट के रिटर्न हमेशा बढ़ा-चढ़ाकर होते हैं।\"", "\"आप गलत फंड में हैं।\""]],
d8q2: ["कौन-सा कारक प्रकाशित फंड रिटर्न और क्लाइंट के असली रिटर्न के अंतर को नहीं समझाता?",
 ["क्लाइंट के निवेश और निकासी का समय।", "क्लाइंट डायरेक्ट प्लान में है या रेगुलर में।", "रिडेम्पशन पर चुकाए गए एग्ज़िट लोड और टैक्स।", "फंड में कुल निवेशकों की संख्या।"]],
d8q3: ["एक क्लाइंट और उसके पड़ोसी एक ही फंड में हैं, फिर भी XIRR बहुत अलग है। दोनों ने ₹5 लाख लगाए। सबसे संभावित कारण क्या है?",
 ["किसी एक को ख़ास NAV मिला।", "उन्होंने अलग-अलग समय पर निवेश किया — शायद एक ने एकमुश्त, दूसरे ने SIP से — इसलिए उनकी औसत लागत और होल्डिंग अवधि अलग है।", "XIRR रैंडम होता है।", "पड़ोसी ज़रूर किसी दूसरी कैटेगरी में होगा।"]],
d9q1: ["ऊपर वाले क्लाइंट के लिए सबसे ज़िम्मेदार जवाब क्या है?",
 ["\"हाँ, बाज़ार 13% नीचे है, यही पक्का निचला स्तर है।\"", "\"कोई नहीं बता सकता कि बाज़ार और गिरेगा या नहीं। आपकी अवधि 12 साल है, इसलिए इक्विटी उपयुक्त है — लेकिन क्योंकि उतार-चढ़ाव से आप चिंतित हैं, हम कुछ हिस्सा अभी लगा सकते हैं और बाकी 6–12 महीने में STP से ले जा सकते हैं, ताकि सही समय पकड़ने पर निर्भर न रहना पड़े।\"", "\"बाज़ार सुधरने तक इंतज़ार कीजिए, फिर निवेश कीजिए।\"", "\"सब स्मॉल कैप फंड में डाल दीजिए क्योंकि वे गिरे हैं।\""]],
d9q2: ["अप्रैल–जून 2026 में भारत का GDP 7.8% बढ़ा, फिर भी सितंबर में Nifty लगभग 6% गिरा। कौन-सी व्याख्या सबसे उचित है?",
 ["बाज़ार का अर्थव्यवस्था से कोई संबंध नहीं, इसे नज़रअंदाज़ करें।", "शेयर के भाव उम्मीदों, वैल्यूएशन और वैश्विक पैसों के प्रवाह को दिखाते हैं — FPI बिकवाली, महँगा कच्चा तेल, कमज़ोर रुपया और ऊँची US यील्ड, मज़बूत मौजूदा ग्रोथ पर भारी पड़ सकते हैं।", "GDP का डेटा गलत होगा।", "मज़बूत GDP से अगले महीने बाज़ार हमेशा बढ़ता है।"]],
d9q3: ["एकमुश्त निवेशक के लिए STP कैसे काम करता है?",
 ["पूरी रकम तुरंत इक्विटी में लगाकर मुनाफ़ा बैंक में भेजता है।", "एकमुश्त रकम को कम उतार-चढ़ाव वाले फंड में रखता है और नियमित अंतराल पर तय रकम इक्विटी फंड में ले जाता है।", "ट्रांसफर अवधि में न्यूनतम रिटर्न की गारंटी देता है।", "यह एक तरह की फ़िक्स्ड डिपॉज़िट है।"]],
d10q1: ["कौन-सा जवाब सबसे उचित है?",
 ["\"हाँ, अभी बेच दीजिए और बाज़ार सुधरने पर वापस ख़रीद लीजिए।\"", "\"ऐसी गिरावट असहज है लेकिन सामान्य है — आपके लक्ष्य 10 से 20 साल दूर हैं और बदले नहीं हैं। अभी बेचने से नुकसान पक्का हो जाता है, और बाज़ार अक्सर हालात 'ठीक लगने' से पहले ही सुधर जाता है। पिछले कुछ हफ़्तों पर प्रतिक्रिया देने के बजाय देखते हैं कि आपका एलोकेशन अब भी आपके लिए सही है।\"", "\"बाज़ार दिवाली तक पक्का सुधर जाएगा।\"", "\"पाँच साल तक अपना पोर्टफोलियो मत देखिए।\""]],
d10q2: ["2026 में FPI ने ₹2.7 लाख करोड़ से ज़्यादा के भारतीय शेयर बेचे, लेकिन बाज़ार उतना नहीं गिरा जितना पहले ऐसी बिकवाली से गिरता। इसे सबसे अच्छी तरह क्या समझाता है?",
 ["RBI ने शेयर ख़रीदे।", "घरेलू निवेशकों — SIP के ज़रिए म्यूचुअल फंड, बीमा कंपनियाँ और अन्य — ने बिकवाली का बड़ा हिस्सा सँभाल लिया।", "FPI बिकवाली का भाव पर कोई असर नहीं होता।", "SEBI ने FPI को बेचने से रोक दिया।"]],
d10q3: ["बाज़ार गिरने के दौरान RM की सबसे असरदार आदत क्या है?",
 ["बाज़ार पर बात करने से पहले क्लाइंट के फ़ोन का इंतज़ार करना।", "क्लाइंट को ख़ुद आगे बढ़कर संदर्भ और उनकी योजना की याद दिलाते हुए फ़ोन करना, ख़ासकर जो ज़्यादा चिंतित हो सकते हैं।", "एक मैसेज भेजना कि बाज़ार जल्द सुधर जाएगा।", "सभी क्लाइंट को डेट फंड में स्विच करने की सलाह देना।"]],
d11q1: ["ऊपर वाले क्लाइंट को सही जवाब क्या है?",
 ["\"हाँ, कोई भी म्यूचुअल फंड डिस्ट्रीब्यूटर SIF बेच सकता है।\"", "\"यह Specialised Investment Fund है, जिसे बेचने के लिए अलग सर्टिफ़िकेशन चाहिए। मैं अभी इसे बेचने के लिए अधिकृत नहीं हूँ, लेकिन इसके काम करने का तरीका और जोखिम समझा सकता हूँ, और अगर यह आपके लिए सही हो तो फ़र्म के अधिकृत चैनल से करवा सकते हैं।\"", "\"SIF गैरक़ानूनी हैं।\"", "\"यह सामान्य म्यूचुअल फंड जैसा ही है, MF के रास्ते से निवेश कर दीजिए।\""]],
d11q2: ["₹60 लाख वाला क्लाइंट एक जैसी रणनीति वाले म्यूचुअल फंड और PMS में से चुन रहा है। कौन-सा ज़रूरी अंतर समझाना चाहिए?",
 ["न्यूनतम राशि ज़्यादा होने से PMS हमेशा ज़्यादा रिटर्न देता है।", "PMS में ट्रेड क्लाइंट के अपने खाते में होते हैं और होते ही टैक्स लग सकता है; म्यूचुअल फंड के अंदर के ट्रेड पर निवेशक को रिडेम्पशन तक टैक्स नहीं लगता।", "म्यूचुअल फंड इक्विटी नहीं रख सकते।", "PMS में कोई लागत नहीं होती।"]],
d11q3: ["ज़्यादा न्यूनतम राशि वाले प्रोडक्ट्स के बारे में कौन-सी धारणा गलत है?",
 ["ज़्यादा न्यूनतम राशि अक्सर ज़्यादा केंद्रित या जटिल रणनीति की अनुमति देती है।", "₹1 करोड़ का AIF, डायवर्सिफ़ाइड म्यूचुअल फंड की ₹500 की SIP से स्वाभाविक रूप से ज़्यादा सुरक्षित है।", "ज़्यादा न्यूनतम राशि वाले प्रोडक्ट्स की लिक्विडिटी शर्तें अलग हो सकती हैं।", "उपयुक्तता निवेशक की स्थिति पर निर्भर करती है, सिर्फ़ उसकी संपत्ति पर नहीं।"]],
d12q1: ["सबसे पहले किस बारे में बात करनी चाहिए?",
 ["कुछ नहीं — म्यूचुअल फंड में स्विच मुफ़्त है।", "वे स्विच क्यों करना चाहते हैं, क्या यह उनके एलोकेशन में फ़िट है, और टैक्स व एग्ज़िट लोड की लागत: 12 महीने से कम पुरानी यूनिट के मुनाफ़े पर 20% और पुरानी यूनिट पर सालाना छूट के ऊपर 12.5%।", "सिर्फ़ यह कि किस गोल्ड फंड का NAV सबसे कम है।", "क्या अगले महीने गोल्ड और बढ़ेगा।"]],
d12q2: ["एक क्लाइंट का इस साल ₹3 लाख का लॉन्ग-टर्म इक्विटी मुनाफ़ा है और वह रीबैलेंस करना चाहता है। ₹1.25 लाख की LTCG छूट कैसे मदद करती है?",
 ["इससे सारा मुनाफ़ा टैक्स-फ़्री हो जाता है।", "हर साल ₹1.25 लाख तक का लॉन्ग-टर्म इक्विटी मुनाफ़ा छूट में है, इसलिए रीबैलेंसिंग को कई सालों में बाँटकर टैक्स घटाया जा सकता है।", "यह सिर्फ़ डेट फंड पर लागू होती है।", "इसे AMC से पहले से क्लेम करना पड़ता है।"]],
d12q3: ["\"जब भी कोई दूसरा फंड बेहतर करेगा, मैं स्विच कर लूँगा — इसमें कोई ख़र्च नहीं।\" इस सोच में क्या गलत है?",
 ["कुछ नहीं; म्यूचुअल फंड स्विच मुफ़्त है।", "बार-बार स्विच करने से एग्ज़िट लोड और कैपिटल गेन्स टैक्स लग सकता है, और अक्सर पिछले साल के विजेता को उसके सबसे अच्छे दौर के बाद ख़रीदना होता है।", "SEBI निवेशकों को स्विच करने से रोकता है।", "साल में सिर्फ़ एक बार स्विच की अनुमति है।"]],
d13q1: ["सबसे संतुलित जवाब क्या है?",
 ["\"इंडेक्स फंड हमेशा ख़राब होते हैं क्योंकि उन्हें कोई मैनेज नहीं करता।\"", "\"लार्ज कैप में कम लागत वाले इंडेक्स फंड को हराना मुश्किल है और वे आपके लार्ज कैप हिस्से की जगह ले सकते हैं। मिड कैप में एक्टिव मैनेजर के पास वैल्यू जोड़ने की ज़्यादा गुंजाइश है, हालाँकि इसकी गारंटी नहीं। देखते हैं कि क्या आपके एक्टिव फंड्स ने कई सालों में अपनी अतिरिक्त लागत कमाई है।\"", "\"एक्टिव फंड हमेशा इंडेक्स फंड से बेहतर करते हैं।\"", "\"आज ही सब कुछ इंडेक्स फंड में डाल दीजिए।\""]],
d13q2: ["\"इंडेक्स फंड सुरक्षित हैं क्योंकि वे डायवर्सिफ़ाइड और कम लागत वाले हैं।\" इसमें कमी क्या है?",
 ["कोई कमी नहीं।", "कम लागत और डायवर्सिफ़िकेशन बाज़ार की गिरावट से नहीं बचाते — इंडेक्स फंड बाज़ार के साथ पूरा गिरता है।", "इंडेक्स फंड सिर्फ़ एक शेयर रखते हैं।", "इंडेक्स फंड रेगुलेटेड नहीं हैं।"]],
d13q3: ["सितंबर 2026 में इक्विटी ETF में ₹9,960 करोड़, गोल्ड ETF में ₹4,451 करोड़ और सिल्वर ETF में ₹1,974 करोड़ आए। उचित व्याख्या क्या है?",
 ["निवेशक सामान्य फंड्स के साथ-साथ कीमती धातुओं समेत अलग-अलग एसेट क्लास में ETF का इस्तेमाल कर रहे हैं।", "अगले साल एक्टिव फंड ख़त्म हो जाएँगे।", "सिल्वर ETF अब इक्विटी ETF से कम जोखिम वाले हैं।", "ETF की वैल्यू नहीं गिर सकती।"]],
d14q1: ["क्लाइंट की योजना में मुख्य चिंता क्या है?",
 ["कोई नहीं — गिरावट के बाद ख़रीदना हमेशा काम करता है।", "वह बहुत ज़्यादा उतार-चढ़ाव वाले एसेट में केंद्रीकरण बढ़ाकर नुकसान वसूलना चाहता है। ₹40 लाख में से ₹15 लाख सिल्वर में डालने से उसकी आधी संपत्ति आगे बड़े उतार-चढ़ाव के जोखिम में आ सकती है।", "सिल्वर अब और नहीं गिर सकता।", "सिल्वर ETF रेगुलेटेड नहीं हैं।"]],
d14q2: ["एक निवेशक का सिल्वर ETF 50% गिरा। मूल वैल्यू पर लौटने के लिए कितनी बढ़त चाहिए?", ["50%", "100%", "75%", "25%"]],
d14q3: ["आप एक सामान्य क्लाइंट को सिल्वर की भूमिका कैसे समझाएँगे?",
 ["\"सिल्वर बैंक डिपॉज़िट जैसा सुरक्षित ठिकाना है।\"", "\"सिल्वर पोर्टफोलियो को डायवर्सिफ़ाई कर सकता है, लेकिन यह गोल्ड से कहीं ज़्यादा उतार-चढ़ाव वाला है — 2026 के शिखर से यह लगभग आधा हो गया। अगर रखें, तो योजना का छोटा हिस्सा ही रखें।\"", "\"सोलर माँग की वजह से सिल्वर हर साल दोगुना होगा।\"", "\"सिल्वर निवेश के रूप में बेकार है।\""]],
d15q1: ["कौन-सा जवाब सटीक, नियमों के अनुसार और भरोसा देने वाला है?",
 ["\"हाँ, पाँच साल में इक्विटी हमेशा पैसा बनाती है।\"", "\"बाज़ार से जुड़े निवेश में कोई रिटर्न की गारंटी नहीं दे सकता — और जो दे, उससे सावधान रहिए। मैं यह कर सकता हूँ कि निवेश को आपके लक्ष्य और सहजता के अनुसार चुनूँ, जोखिम ईमानदारी से समझाऊँ और नियमित रूप से आपके साथ रिव्यू करूँ।\"", "\"अगर आप निवेशित रहें तो मैं सालाना 12% की गारंटी दे सकता हूँ।\"", "\"गारंटी सिर्फ़ हमारे प्रीमियम प्लान में मिलती है।\""]],
d15q2: ["क्लाइंट से बातचीत में कौन-सा कथन स्वीकार्य है?",
 ["\"यह फंड 100% सुरक्षित है।\"", "\"इतिहास में, डायवर्सिफ़ाइड इक्विटी फंड्स में लंबी अवधि तक रहने से नुकसान की संभावना कम हुई है, हालाँकि नुकसान फिर भी हो सकता है।\"", "\"SIP में पैसा डूब नहीं सकता।\"", "\"यह फंड पाँच साल में आपका पैसा दोगुना कर देगा।\""]],
d15q3: ["ऊपर वाली पहली बार की निवेशक के पास ₹8 लाख की बचत है और कोई इमरजेंसी फंड नहीं। इक्विटी फंड पर बात करने से पहले क्या होना चाहिए?",
 ["सबसे अच्छा प्रदर्शन करने वाला फंड चुनना।", "उसके लक्ष्य, अवधि और लिक्विडिटी की ज़रूरतें समझना — जिसमें इमरजेंसी रिज़र्व रखना शामिल है — फिर तय करना कि बाज़ार से जुड़े निवेश में कितना लगाया जा सकता है।", "ज़्यादा रिटर्न के लिए पूरे ₹8 लाख इक्विटी में लगाना।", "रेफ़रल माँगना।"]]
});

Object.assign(TX.gu, {
d1q1: ["છેલ્લા દસ વર્ષમાં ઇન્ડસ્ટ્રીનું AUM ઘણી ગણી વધ્યું છે. એક ક્લાયન્ટ માને છે: \"જો ઇન્ડસ્ટ્રીનું AUM આટલું ઝડપથી વધી રહ્યું છે, તો મ્યુચ્યુઅલ ફંડ રોકાણકારોને ચોક્કસ ઉત્તમ રિટર્ન મળતું હશે.\" સૌથી મહત્વનો તફાવત શું સમજાવવો જોઈએ?",
 ["AUM વધવું હંમેશા ફંડનું સારું પ્રદર્શન બતાવે છે.", "ઇન્ડસ્ટ્રીનું AUM બજારમાં વધારો અને નવા રોકાણ (નેટ ઇનફ્લો) બંનેથી વધે છે, તેથી ફક્ત ઇન્ડસ્ટ્રીની ગ્રોથથી ખબર નથી પડતી કે કોઈ રોકાણકારને કેટલું રિટર્ન મળ્યું.", "ઇન્ડસ્ટ્રીનું AUM સંપૂર્ણપણે SIP યોગદાનથી ચાલે છે.", "AUM વધવાનો અર્થ છે કે મ્યુચ્યુઅલ ફંડ ઓછા જોખમવાળા બની રહ્યા છે."]],
d1q2: ["સપ્ટેમ્બર 2026માં ઇન્ડસ્ટ્રી AUM લગભગ 5.1% ઘટ્યું, છતાં SIP યોગદાન રેકોર્ડ ₹32,490 કરોડ રહ્યું અને ઇક્વિટી ઇનફ્લો લગભગ 31% વધ્યો. તેમાંથી કયું યોગ્ય તારણ નીકળે?",
 ["રોકાણકારો ગભરાઈને મ્યુચ્યુઅલ ફંડમાંથી નીકળી રહ્યા હતા.", "રિટેલ રોકાણકારો રોકાણ કરતા રહ્યા, જ્યારે બજારના ઘટાડા અને ડેટ ફંડમાંથી ઉપાડે કુલ એસેટની વેલ્યુ ઘટાડી.", "SIP નો ડેટા ખોટો હશે, કારણ કે ઇનફ્લો વધે ત્યારે AUM ઘટી ન શકે.", "સપ્ટેમ્બરમાં ઇક્વિટી ફંડ્સે ઑગસ્ટ કરતાં સારું પ્રદર્શન કર્યું."]],
d1q3: ["વાર્તાવાળી ક્લાયન્ટ પૂછે છે કે શું તેણે પૈસા ઉપાડી લેવા જોઈએ કારણ કે \"ઇન્ડસ્ટ્રીના એસેટ ₹4 લાખ કરોડ ઘટ્યા\". કયો જવાબ સૌથી સચોટ અને મદદરૂપ છે?",
 ["\"ચિંતા ન કરો, બજાર થોડા જ મહિનામાં હંમેશા પાછું આવી જાય છે.\"", "\"આ ઘટાડો મોટે ભાગે બજારભાવ ઘટવા અને કંપનીઓના શોર્ટ-ટર્મ પૈસા ઉપાડવાથી હતો. રિટેલ રોકાણકારોએ તો રેકોર્ડ રોકાણ કર્યું. તમારી SIP ત્રણ વર્ષથી આગળના લક્ષ્ય માટે છે, તેથી ઇન્ડસ્ટ્રીના આંકડા પર પ્રતિક્રિયા આપવાને બદલે જોઈએ કે તે હજુ એ લક્ષ્ય માટે યોગ્ય છે કે નહીં.\"", "\"હા, એસેટ ફરી વધે ત્યાં સુધી અટકી જવું સમજદારી હોઈ શકે.\"", "\"ઇન્ડસ્ટ્રીના આંકડા નકામા છે, તમારે બધા સમાચાર અવગણવા જોઈએ.\""]],
d2q1: ["ઉપરના ક્લાયન્ટ પૂછે છે કે શું SIP શરૂ કરવી ભૂલ હતી. કયો જવાબ સૌથી સારી સમજ બતાવે છે?",
 ["\"લાંબા ગાળે SIPમાં ક્યારેય નુકસાન નથી થતું, તેથી આ કામચલાઉ છે.\"", "\"SIP તમારી ખરીદીને જુદા જુદા બજાર સ્તરે વહેંચે છે, પણ બજાર ઘટે ત્યારે નુકસાન રોકી શકતી નથી. તમારા મોટા ભાગના હપ્તા ઊંચા ભાવે લાગ્યા, તેથી આજે નુકસાન દેખાય છે. તમારું લક્ષ્ય 2034માં છે, અને હાલના હપ્તા ઓછા ભાવે ખરીદાઈ રહ્યા છે. બે વર્ષના આધારે નિર્ણય કરવાને બદલે જોઈએ કે ફંડ હજુ એ લક્ષ્ય માટે યોગ્ય છે.\"", "\"તમારે એ ફંડમાં સ્વિચ કરવું જોઈએ જેણે ગયા વર્ષે સારું કર્યું.\"", "\"બજાર સુધરે ત્યાં સુધી SIP બંધ કરો, પછી ફરી શરૂ કરો.\""]],
d2q2: ["એક ફંડનું 1 વર્ષનું રિટર્ન −9% છે. એ જ ફંડમાં તમારા ક્લાયન્ટની SIP નું એ જ વર્ષનું XIRR −4% છે. આ તફાવતને સૌથી સારી રીતે શું સમજાવે છે?",
 ["AMC એ કોઈ એક આંકડાની ગણતરી ખોટી કરી.", "SIP ના હપ્તા આખા વર્ષ દરમિયાન જુદા જુદા ભાવે લાગ્યા, તેથી તેનો અનુભવ એક વર્ષ પહેલાં એકસાથે લગાવેલા પૈસાથી જુદો છે.", "SIP હંમેશા એકસાથે રોકાણ કરતાં સારું કરે છે.", "XIRR બજારની ચાલને અવગણે છે."]],
d2q3: ["SIP વિશે કયું વિધાન ક્લાયન્ટને ગેરમાર્ગે દોરી શકે?",
 ["\"SIP તમને બધા પૈસા બજારની ટોચે લગાવવાથી બચાવે છે.\"", "\"ઘટાડામાં ચાલુ રાખવાથી ઓછા ભાવે વધુ યુનિટ મળે છે.\"", "\"જો તમે પાંચ વર્ષ SIP ચાલુ રાખશો, તો તમને ચોક્કસ નફો થશે.\"", "\"SIP નું રિટર્ન તે જે ફંડમાં રોકાણ કરે છે તેના પર આધાર રાખે છે.\""]],
d3q1: ["ઉપરના ક્લાયન્ટને તમે કેવી રીતે જવાબ આપશો?",
 ["પૈસા ખસેડી દો — સ્મોલ કેપનું લાંબા ગાળાનું રિટર્ન સૌથી વધુ છે.", "સમજાવો કે સ્મોલ કેપ ઊંચું રિટર્ન આપી શકે પણ ઊંડા અને લાંબા ઘટાડા પણ આવે છે; મિત્રનો ભૂતકાળનો નફો ભવિષ્યનો સંકેત નથી; અને છ વર્ષમાં નિવૃત્તિ તથા મોડરેટ પ્રોફાઇલ સાથે મોટો ફેરફાર લક્ષ્યની નજીક મોટા નુકસાનની શક્યતા વધારશે. તેના બદલે નાનો, નક્કી હિસ્સો યોગ્ય છે કે નહીં તેની ચર્ચા કરો.", "સ્મોલ કેપ વિશે વાત કરવાની જ ના પાડો.", "તેમને કહો કે હવે સ્મોલ કેપનું ઘટવું નક્કી છે."]],
d3q2: ["સ્મોલ કેપ ફંડ્સમાં સતત ત્રણ મહિના સૌથી વધુ ઇનફ્લો આવ્યો, જ્યારે સ્મોલ કેપ ઇન્ડેક્સમાં વધઘટ રહી. ફક્ત ફ્લો ડેટા પરથી તમે કયું યોગ્ય તારણ કાઢી શકો?",
 ["આવતા વર્ષે સ્મોલ કેપ સારું કરશે.", "હાલ સ્મોલ કેપ માટે રોકાણકારોની માંગ મજબૂત છે; ડેટા એ નથી કહેતો કે સમય યોગ્ય છે કે તે કોઈ ચોક્કસ રોકાણકાર માટે યોગ્ય છે.", "ફંડ મેનેજરો તેજીની અપેક્ષાએ સ્મોલ કેપ ખરીદી રહ્યા છે.", "લોકપ્રિય હોવાથી સ્મોલ કેપ ફંડ હવે ઓછા જોખમવાળા છે."]],
d3q3: ["એક ફંડે 10 વર્ષમાં વાર્ષિક 14% આપ્યું, પણ તેના સરેરાશ રોકાણકારે લગભગ 8% વાર્ષિક કમાયું. તેનું સૌથી સંભવિત કારણ શું છે?",
 ["ફંડે ખોટા આંકડા પ્રકાશિત કર્યા.", "રોકાણકારો સારા સમયગાળા પછી રોકાણ કરતા અને નબળા સમયગાળા પછી ઉપાડતા રહ્યા, તેથી તેમના પૈસા ફંડના શ્રેષ્ઠ સમયગાળાનો મોટો ભાગ ચૂકી ગયા.", "રોકાણકારોએ ફંડ કરતાં વધુ ટેક્સ ભર્યો.", "નાના રોકાણકારો હંમેશા મોટા રોકાણકારો કરતાં ઓછું કમાય છે."]],
d4q1: ["સપ્ટેમ્બરમાં લિક્વિડ ફંડ્સમાંથી ઘણી વાર ખૂબ મોટો ઉપાડ કેમ થાય છે?",
 ["રિટેલ રોકાણકારો વધતા વ્યાજદરથી ગભરાઈ જાય છે.", "કંપનીઓ એડવાન્સ ટેક્સ અને ત્રિમાસિક અંતની જરૂરિયાતો માટે શોર્ટ-ટર્મ પૈસા ઉપાડે છે.", "SEBI લિક્વિડ ફંડ્સને દર ત્રિમાસિકે પૈસા પરત કરવા ફરજ પાડે છે.", "લિક્વિડ ફંડ્સ દર સપ્ટેમ્બરે નુકસાન કરે છે."]],
d4q2: ["તમારા બિઝનેસ-ઓનર ક્લાયન્ટ ઉપાડવાળી હેડલાઇનથી ચિંતિત છે. સૌથી સચોટ જવાબ શું છે?",
 ["\"લિક્વિડ ફંડ સંપૂર્ણપણે જોખમ-મુક્ત છે, કંઈ ખોટું ન થઈ શકે.\"", "\"આ ઉપાડ મોટે ભાગે કંપનીઓના એડવાન્સ ટેક્સ માટે પૈસા ઉપાડવાથી છે — આ દર ત્રિમાસિકે થાય છે અને તેનાથી તમારા યુનિટની વેલ્યુ બદલાતી નથી. લિક્વિડ ફંડમાં થોડું ક્રેડિટ અને વ્યાજદર જોખમ જરૂર હોય છે, એટલે જ અમે સારી ગુણવત્તા અને ખૂબ ટૂંકી મુદતના હોલ્ડિંગ્સવાળું ફંડ પસંદ કર્યું છે.\"", "\"તમારે તરત જ તમારા પૈસા બેંક FDમાં મૂકી દેવા જોઈએ.\"", "\"ઉપાડનો અર્થ છે કે ફંડ બંધ થવાનું છે.\""]],
d4q3: ["છાપાની હેડલાઇન છે: \"મ્યુચ્યુઅલ ફંડમાં રેકોર્ડ ઉપાડ.\" ક્લાયન્ટ સાથે વાત કરતાં પહેલાં તમારે સૌથી પહેલા શું તપાસવું જોઈએ?",
 ["ઉપાડ કઈ કેટેગરી અને કેવા પ્રકારના રોકાણકારોમાંથી થયો, અને શું તે મોસમી સમયને કારણે છે.", "તે દિવસે Sensex વધ્યો કે નહીં.", "તે મહિને કઈ AMC ની જાહેરાત સૌથી મોટી હતી.", "કંઈ નહીં — રેકોર્ડ ઉપાડ હંમેશા ખરાબ સમાચાર છે."]],
d5q1: ["ઉપરના ક્લાયન્ટને તમે કેવી રીતે જવાબ આપશો?",
 ["\"ડાયરેક્ટ પ્લાન વધુ જોખમવાળા છે, તેથી રેગ્યુલરમાં જ રહો.\"", "\"તમારા સહકર્મી સાચા છે કે ડાયરેક્ટ પ્લાન સસ્તા છે — પોર્ટફોલિયો એ જ છે, પણ રેગ્યુલર પ્લાનમાં મારી સેવા સામેલ છે. પ્રશ્ન એ છે કે શું તમે મારા પ્લાનિંગ, રિવ્યૂ અને સહકારને મહત્વ આપો છો. જો તમે સ્વિચ કરવા માંગો, તો આપણે ટેક્સ અને એક્ઝિટ લોડ પણ જોવા પડશે, કારણ કે સ્વિચ કરવું વેચાણ ગણાય છે.\"", "\"આ ફંડ્સના ડાયરેક્ટ પ્લાન હોતા જ નથી.\"", "\"રેગ્યુલર પ્લાન હંમેશા વધુ રિટર્ન આપે છે.\""]],
d5q2: ["SEBI ના 2026 નિયમોમાં Base Expense Ratio (BER) શું દર્શાવે છે?",
 ["ટેક્સ અને સ્ટેમ્પ ડ્યૂટી સહિત દરેક ખર્ચનો કુલ સરવાળો.", "ફંડ ચલાવવાનો મૂળ ખર્ચ (મંજૂર ડિસ્ટ્રિબ્યુશન ખર્ચ સહિત), જ્યારે બ્રોકરેજ અને વૈધાનિક/નિયમનકારી શુલ્ક અલગ બતાવાય છે.", "રોકાણકાર દ્વારા સીધું ડિસ્ટ્રિબ્યુટરને ચૂકવાતું શુલ્ક.", "ફંડે ઓછામાં ઓછું કેટલું રિટર્ન આપવું પડે તે."]],
d5q3: ["એક ક્લાયન્ટ વાર્ષિક લગભગ 0.7% બચાવવા બધા ફંડ ડાયરેક્ટ પ્લાનમાં બદલવા માંગે છે. મોટા ભાગના યુનિટ 14 મહિના જૂના છે અને તેના પર મોટો નફો છે. સૌથી મહત્વની બાબત કઈ છે?",
 ["ડાયરેક્ટ પ્લાનનું NAV ઓછું છે, તેથી તે ખરીદવામાં સસ્તા છે.", "સ્વિચ એક રિડેમ્પશન છે, જેનાથી નફા પર કેપિટલ ગેઇન્સ ટેક્સ અને કદાચ એક્ઝિટ લોડ લાગી શકે — તાત્કાલિક ખર્ચ ઘણા વર્ષોની બચત કરતાં વધુ હોઈ શકે.", "એક જ AMC માં હોવાથી સ્વિચ મફત છે.", "વિચારવાની કોઈ વાત નથી; ઓછો ખર્ચ હંમેશા તરત વધુ સારો છે."]],
d6q1: ["સેક્ટોરલ/થીમેટિક ફંડ્સ પર SEBI ની 50% ઓવરલેપ મર્યાદા રોકાણકારો માટે કેમ મહત્વની છે?",
 ["તે ગેરંટી આપે છે કે થીમેટિક ફંડ સારું કરશે.", "તે સેક્ટોરલ અને થીમેટિક ફંડ્સને ડાઇવર્સિફાઇડ ફંડ્સથી ખરેખર અલગ બનાવે છે, જેથી રોકાણકારો અજાણતાં એ જ શેર બે વાર ન ખરીદે — પણ તેનાથી તે વધુ કેન્દ્રિત પણ બને છે.", "તે થીમેટિક ફંડનું જોખમ લાર્જ કેપ ફંડના સ્તરે ઘટાડી દે છે.", "તેનો અર્થ છે કે હવે રોકાણકારોને ડાઇવર્સિફાઇડ ફંડ્સની જરૂર નથી."]],
d6q2: ["ઉપરના ક્લાયન્ટ માને છે કે પાંચ ફંડ એટલે સારું ડાઇવર્સિફિકેશન. સૌથી સારો જવાબ શું છે?",
 ["\"હા, પાંચ ફંડ હંમેશા પૂરતા છે.\"", "\"ફંડની સંખ્યા કરતાં વધુ મહત્વનું છે કે તેની અંદર શું છે. જોઈએ કે તમારા ફંડ કેટલા ઓવરલેપ થાય છે અને કેટલું થોડી થીમ પર આધારિત છે. બની શકે કે તમે પાંચ ફંડ પ્રમાણે વધુ કેન્દ્રિત હો — અથવા એ જ શેર ઘણી વાર રાખ્યા હોય.\"", "\"તમારે બીજા પાંચ ફંડ ઉમેરવા જોઈએ.\"", "\"બધું વેચીને એક ઇન્ડેક્સ ફંડ લઈ લો.\""]],
d6q3: ["SEBI ના ફેબ્રુઆરી 2026ના કેટેગરી નિયમો વિશે કયું વિધાન સાચું છે?",
 ["ચિલ્ડ્રન અને રિટાયરમેન્ટ ફંડ હજુ અલગ 'સોલ્યુશન-ઓરિએન્ટેડ' કેટેગરીમાં છે.", "Life Cycle Funds નવી કેટેગરી તરીકે આવ્યા, અને સોલ્યુશન-ઓરિએન્ટેડ કેટેગરી દૂર કરાઈ.", "ઇક્વિટી ફંડ હવે ઇક્વિટી સિવાય ક્યાંય રોકાણ ન કરી શકે.", "ફંડના નામ હવે અપેક્ષિત રિટર્નને મહત્વ આપી શકે છે."]],
d7q1: ["ઉપરના ક્લાયન્ટને તમે કેવી રીતે જવાબ આપશો?",
 ["\"હા, તમારા ભાઈવાળા ફંડમાં સ્વિચ કરી લો.\"", "\"બંને ફ્લેક્સી કેપ છે, પણ જુદી રીતે મેનેજ થાય છે — તેમનું ફંડ ગ્રોથ અને મિડ કેપ તરફ ઝૂકેલું છે, જેમણે આ વર્ષે સારું કર્યું; તમારું વેલ્યુ તરફ ઝૂકેલું છે, જે બીજા તબક્કામાં સારું કરે છે. પાંચ વર્ષમાં બંનેએ લગભગ સરખું કર્યું છે. તમારા ફંડને એક વર્ષ નહીં, પણ તેના બેન્ચમાર્ક સામે ઘણા સમયગાળામાં પરખીએ.\"", "\"તમારા ભાઈનું ફંડ વધુ જોખમવાળું છે, જલ્દી તૂટશે.\"", "\"બધા ફ્લેક્સી કેપ ફંડ્સે સરખું રિટર્ન આપવું જોઈએ.\""]],
d7q2: ["કોઈ ફંડને પરખવાની સૌથી યોગ્ય રીત કઈ છે?",
 ["તેનું ગયા 1 વર્ષનું રિટર્ન કોઈપણ કેટેગરીના સૌથી સારા ફંડ સાથે સરખાવવું.", "તેના રોલિંગ રિટર્નની સરખામણી તેના બેન્ચમાર્ક અને એ જ કેટેગરીના ફંડ્સ સાથે ઘણા સમયગાળામાં કરવી.", "તેના NAV સ્તરની સરખામણી બીજા ફંડ્સના NAV સાથે કરવી.", "તેની જાહેરાતની સરખામણી બીજી AMC ની જાહેરાત સાથે કરવી."]],
d7q3: ["ક્લાયન્ટ કહે છે: \"ફંડ A એ ગયા વર્ષે 22% આપ્યું અને ફંડ B એ 12%, તેથી ફંડ A વધુ સારું છે.\" આ તારણમાં શું ખૂટે છે?",
 ["કંઈ નહીં — વધુ રિટર્ન હંમેશા વધુ સારું છે.", "શું બંને ફંડ એક જ કેટેગરીના છે, દરેકે કેટલું જોખમ લીધું, ઘટાડામાં કેવું કર્યું, અને શું ગયા વર્ષનો તફાવત લાંબા ગાળે પણ ટકે છે.", "કયા ફંડનો લોગો નવો છે.", "કયા ફંડમાં વધુ SIP એકાઉન્ટ છે."]],
d8q1: ["ઉપરના ક્લાયન્ટ માટે સૌથી સારી સમજૂતી કઈ છે?",
 ["\"AMC થી કોઈ ભૂલ થઈ હશે.\"", "\"15% એ ધારીને છે કે તમારા બધા પૈસા ત્રણ વર્ષ પહેલાં લાગ્યા. તમારા મોટા ભાગના પૈસા — ₹8 લાખ — 14 મહિના પહેલાં લાગ્યા જ્યારે બજાર ઊંચું હતું, તેથી તમારું કુલ રિટર્ન એ પછીના સમયને બતાવે છે.\"", "\"ફેક્ટશીટના રિટર્ન હંમેશા વધારીને બતાવેલા હોય છે.\"", "\"તમે ખોટા ફંડમાં છો.\""]],
d8q2: ["કયું પરિબળ પ્રકાશિત ફંડ રિટર્ન અને ક્લાયન્ટના વાસ્તવિક રિટર્ન વચ્ચેનો તફાવત નથી સમજાવતું?",
 ["ક્લાયન્ટના રોકાણ અને ઉપાડનો સમય.", "ક્લાયન્ટ ડાયરેક્ટ પ્લાનમાં છે કે રેગ્યુલરમાં.", "રિડેમ્પશન પર ચૂકવેલા એક્ઝિટ લોડ અને ટેક્સ.", "ફંડમાં કુલ રોકાણકારોની સંખ્યા."]],
d8q3: ["એક ક્લાયન્ટ અને તેમના પાડોશી એક જ ફંડમાં છે, છતાં XIRR ઘણું જુદું છે. બંનેએ ₹5 લાખ રોક્યા. સૌથી સંભવિત કારણ શું છે?",
 ["કોઈ એકને ખાસ NAV મળ્યું.", "તેમણે જુદા જુદા સમયે રોકાણ કર્યું — કદાચ એકે એકસાથે, બીજાએ SIP થી — તેથી તેમનો સરેરાશ ખર્ચ અને હોલ્ડિંગ સમયગાળો જુદો છે.", "XIRR રેન્ડમ હોય છે.", "પાડોશી જરૂર બીજી કેટેગરીમાં હશે."]],
d9q1: ["ઉપરના ક્લાયન્ટ માટે સૌથી જવાબદાર જવાબ કયો છે?",
 ["\"હા, બજાર 13% નીચે છે, આ જ ચોક્કસ તળિયું છે.\"", "\"કોઈ કહી શકતું નથી કે બજાર વધુ ઘટશે કે નહીં. તમારો સમયગાળો 12 વર્ષનો છે, તેથી ઇક્વિટી યોગ્ય છે — પણ વધઘટથી તમે ચિંતિત છો, એટલે આપણે થોડો ભાગ હમણાં લગાવી શકીએ અને બાકીનો 6–12 મહિનામાં STP થી લઈ જઈ શકીએ, જેથી યોગ્ય સમય પકડવા પર આધાર ન રાખવો પડે.\"", "\"બજાર સુધરે ત્યાં સુધી રાહ જુઓ, પછી રોકાણ કરો.\"", "\"બધું સ્મોલ કેપ ફંડમાં મૂકી દો કારણ કે તે ઘટ્યા છે.\""]],
d9q2: ["એપ્રિલ–જૂન 2026માં ભારતનો GDP 7.8% વધ્યો, છતાં સપ્ટેમ્બરમાં Nifty લગભગ 6% ઘટ્યો. કઈ સમજૂતી સૌથી યોગ્ય છે?",
 ["બજારનો અર્થતંત્ર સાથે કોઈ સંબંધ નથી, તેને અવગણો.", "શેરના ભાવ અપેક્ષાઓ, વેલ્યુએશન અને વૈશ્વિક નાણાપ્રવાહ દર્શાવે છે — FPI વેચવાલી, મોંઘું ક્રૂડ, નબળો રૂપિયો અને ઊંચી US યીલ્ડ, મજબૂત વર્તમાન ગ્રોથ પર ભારે પડી શકે.", "GDP નો ડેટા ખોટો હશે.", "મજબૂત GDP થી આવતા મહિને બજાર હંમેશા વધે છે."]],
d9q3: ["એકસાથે રોકાણ કરનાર માટે STP કેવી રીતે કામ કરે છે?",
 ["આખી રકમ તરત ઇક્વિટીમાં લગાવીને નફો બેંકમાં મોકલે છે.", "એકસાથેની રકમને ઓછી વધઘટવાળા ફંડમાં રાખે છે અને નિયમિત અંતરે નક્કી રકમ ઇક્વિટી ફંડમાં લઈ જાય છે.", "ટ્રાન્સફર સમયગાળામાં લઘુતમ રિટર્નની ગેરંટી આપે છે.", "તે એક પ્રકારની ફિક્સ્ડ ડિપોઝિટ છે."]],
d10q1: ["કયો જવાબ સૌથી યોગ્ય છે?",
 ["\"હા, હમણાં વેચી દો અને બજાર સુધરે ત્યારે પાછું ખરીદી લો.\"", "\"આવો ઘટાડો અસહજ છે પણ સામાન્ય છે — તમારા લક્ષ્યો 10 થી 20 વર્ષ દૂર છે અને બદલાયા નથી. હમણાં વેચવાથી નુકસાન પાકું થઈ જાય છે, અને બજાર ઘણી વાર પરિસ્થિતિ 'સ્થિર લાગે' તે પહેલાં જ સુધરી જાય છે. છેલ્લા થોડા અઠવાડિયા પર પ્રતિક્રિયા આપવાને બદલે જોઈએ કે તમારું એલોકેશન હજુ તમારા માટે યોગ્ય છે.\"", "\"બજાર દિવાળી સુધીમાં ચોક્કસ સુધરી જશે.\"", "\"પાંચ વર્ષ સુધી તમારો પોર્ટફોલિયો ન જુઓ.\""]],
d10q2: ["2026માં FPI એ ₹2.7 લાખ કરોડથી વધુના ભારતીય શેર વેચ્યા, પણ બજાર એટલું ન ઘટ્યું જેટલું પહેલાં આવી વેચવાલીથી ઘટતું. તેને સૌથી સારી રીતે શું સમજાવે છે?",
 ["RBI એ શેર ખરીદ્યા.", "સ્થાનિક રોકાણકારો — SIP મારફતે મ્યુચ્યુઅલ ફંડ, વીમા કંપનીઓ અને અન્ય — એ વેચવાલીનો મોટો ભાગ સંભાળી લીધો.", "FPI વેચવાલીની ભાવ પર કોઈ અસર નથી થતી.", "SEBI એ FPI ને વેચતા અટકાવ્યા."]],
d10q3: ["બજાર ઘટે ત્યારે RM ની સૌથી અસરકારક ટેવ કઈ છે?",
 ["બજાર વિશે વાત કરતાં પહેલાં ક્લાયન્ટના ફોનની રાહ જોવી.", "ક્લાયન્ટને જાતે આગળ વધીને સંદર્ભ અને તેમની યોજનાની યાદ સાથે ફોન કરવો, ખાસ કરીને જે વધુ ચિંતિત હોઈ શકે.", "એક મેસેજ મોકલવો કે બજાર જલ્દી સુધરી જશે.", "બધા ક્લાયન્ટને ડેટ ફંડમાં સ્વિચ કરવાની સલાહ આપવી."]],
d11q1: ["ઉપરના ક્લાયન્ટને સાચો જવાબ કયો છે?",
 ["\"હા, કોઈપણ મ્યુચ્યુઅલ ફંડ ડિસ્ટ્રિબ્યુટર SIF વેચી શકે.\"", "\"આ Specialised Investment Fund છે, જે વેચવા અલગ સર્ટિફિકેશન જોઈએ. હું હાલ તે વેચવા અધિકૃત નથી, પણ તે કેવી રીતે કામ કરે છે અને તેના જોખમો સમજાવી શકું, અને જો તમારા માટે યોગ્ય હોય તો ફર્મની અધિકૃત ચેનલ મારફતે કરાવી શકીએ.\"", "\"SIF ગેરકાયદે છે.\"", "\"તે સામાન્ય મ્યુચ્યુઅલ ફંડ જેવું જ છે, MF ના રસ્તે રોકાણ કરી દો.\""]],
d11q2: ["₹60 લાખવાળા ક્લાયન્ટ સરખી રણનીતિવાળા મ્યુચ્યુઅલ ફંડ અને PMS માંથી પસંદ કરી રહ્યા છે. કયો મહત્વનો તફાવત સમજાવવો જોઈએ?",
 ["લઘુતમ રકમ વધુ હોવાથી PMS હંમેશા વધુ રિટર્ન આપે છે.", "PMS માં ટ્રેડ ક્લાયન્ટના પોતાના ખાતામાં થાય છે અને થતાં જ ટેક્સ લાગી શકે; મ્યુચ્યુઅલ ફંડની અંદરના ટ્રેડ પર રોકાણકારને રિડેમ્પશન સુધી ટેક્સ લાગતો નથી.", "મ્યુચ્યુઅલ ફંડ ઇક્વિટી રાખી ન શકે.", "PMS માં કોઈ ખર્ચ નથી."]],
d11q3: ["વધુ લઘુતમ રકમવાળા પ્રોડક્ટ્સ વિશે કઈ માન્યતા ખોટી છે?",
 ["વધુ લઘુતમ રકમ ઘણી વાર વધુ કેન્દ્રિત અથવા જટિલ રણનીતિની મંજૂરી આપે છે.", "₹1 કરોડનું AIF, ડાઇવર્સિફાઇડ મ્યુચ્યુઅલ ફંડની ₹500 ની SIP કરતાં સ્વાભાવિક રીતે વધુ સુરક્ષિત છે.", "વધુ લઘુતમ રકમવાળા પ્રોડક્ટ્સની લિક્વિડિટી શરતો જુદી હોઈ શકે.", "યોગ્યતા રોકાણકારની પરિસ્થિતિ પર આધાર રાખે છે, ફક્ત તેની સંપત્તિ પર નહીં."]],
d12q1: ["સૌથી પહેલા શેના વિશે વાત કરવી જોઈએ?",
 ["કંઈ નહીં — મ્યુચ્યુઅલ ફંડમાં સ્વિચ મફત છે.", "તેઓ સ્વિચ કેમ કરવા માંગે છે, શું તે તેમના એલોકેશનમાં બંધબેસે છે, અને ટેક્સ તથા એક્ઝિટ લોડનો ખર્ચ: 12 મહિનાથી ઓછા જૂના યુનિટના નફા પર 20% અને જૂના યુનિટ પર વાર્ષિક છૂટ ઉપર 12.5%.", "ફક્ત એ કે કયા ગોલ્ડ ફંડનું NAV સૌથી ઓછું છે.", "શું આવતા મહિને ગોલ્ડ વધુ વધશે."]],
d12q2: ["એક ક્લાયન્ટનો આ વર્ષે ₹3 લાખનો લોંગ-ટર્મ ઇક્વિટી નફો છે અને તે રીબેલેન્સ કરવા માંગે છે. ₹1.25 લાખની LTCG છૂટ કેવી રીતે મદદ કરે?",
 ["તેનાથી બધો નફો ટેક્સ-ફ્રી થઈ જાય છે.", "દર વર્ષે ₹1.25 લાખ સુધીનો લોંગ-ટર્મ ઇક્વિટી નફો છૂટમાં છે, તેથી રીબેલેન્સિંગ ઘણા વર્ષોમાં વહેંચીને ટેક્સ ઘટાડી શકાય.", "તે ફક્ત ડેટ ફંડ પર લાગુ પડે છે.", "તેને AMC પાસે અગાઉથી ક્લેમ કરવી પડે."]],
d12q3: ["\"જ્યારે પણ બીજું ફંડ સારું કરશે, હું સ્વિચ કરી લઈશ — એમાં કોઈ ખર્ચ નથી.\" આ વિચારમાં શું ખોટું છે?",
 ["કંઈ નહીં; મ્યુચ્યુઅલ ફંડ સ્વિચ મફત છે.", "વારંવાર સ્વિચ કરવાથી એક્ઝિટ લોડ અને કેપિટલ ગેઇન્સ ટેક્સ લાગી શકે, અને ઘણી વાર ગયા વર્ષના વિજેતાને તેના શ્રેષ્ઠ સમય પછી ખરીદવો પડે.", "SEBI રોકાણકારોને સ્વિચ કરતા અટકાવે છે.", "વર્ષમાં ફક્ત એક વાર સ્વિચની મંજૂરી છે."]],
d13q1: ["સૌથી સંતુલિત જવાબ કયો છે?",
 ["\"ઇન્ડેક્સ ફંડ હંમેશા ખરાબ હોય છે કારણ કે તેને કોઈ મેનેજ નથી કરતું.\"", "\"લાર્જ કેપમાં ઓછા ખર્ચવાળા ઇન્ડેક્સ ફંડને હરાવવું મુશ્કેલ છે અને તે તમારા લાર્જ કેપ હિસ્સાનું સ્થાન લઈ શકે. મિડ કેપમાં એક્ટિવ મેનેજર પાસે વેલ્યુ ઉમેરવાની વધુ તક છે, જોકે તેની ગેરંટી નથી. જોઈએ કે શું તમારા એક્ટિવ ફંડ્સે ઘણા વર્ષોમાં તેમનો વધારાનો ખર્ચ કમાયો છે.\"", "\"એક્ટિવ ફંડ હંમેશા ઇન્ડેક્સ ફંડ કરતાં સારું કરે છે.\"", "\"આજે જ બધું ઇન્ડેક્સ ફંડમાં મૂકી દો.\""]],
d13q2: ["\"ઇન્ડેક્સ ફંડ સુરક્ષિત છે કારણ કે તે ડાઇવર્સિફાઇડ અને ઓછા ખર્ચવાળા છે.\" તેમાં ખામી શું છે?",
 ["કોઈ ખામી નથી.", "ઓછો ખર્ચ અને ડાઇવર્સિફિકેશન બજારના ઘટાડાથી બચાવતા નથી — ઇન્ડેક્સ ફંડ બજાર સાથે પૂરેપૂરું ઘટે છે.", "ઇન્ડેક્સ ફંડ ફક્ત એક શેર રાખે છે.", "ઇન્ડેક્સ ફંડ રેગ્યુલેટેડ નથી."]],
d13q3: ["સપ્ટેમ્બર 2026માં ઇક્વિટી ETF માં ₹9,960 કરોડ, ગોલ્ડ ETF માં ₹4,451 કરોડ અને સિલ્વર ETF માં ₹1,974 કરોડ આવ્યા. યોગ્ય અર્થઘટન શું છે?",
 ["રોકાણકારો સામાન્ય ફંડ્સની સાથે કિંમતી ધાતુઓ સહિત જુદા જુદા એસેટ ક્લાસમાં ETF નો ઉપયોગ કરી રહ્યા છે.", "આવતા વર્ષે એક્ટિવ ફંડ ખતમ થઈ જશે.", "સિલ્વર ETF હવે ઇક્વિટી ETF કરતાં ઓછા જોખમવાળા છે.", "ETF ની વેલ્યુ ઘટી ન શકે."]],
d14q1: ["ક્લાયન્ટની યોજનામાં મુખ્ય ચિંતા શું છે?",
 ["કોઈ નહીં — ઘટાડા પછી ખરીદવું હંમેશા કામ કરે છે.", "તે ખૂબ વધઘટવાળા એસેટમાં કેન્દ્રીકરણ વધારીને નુકસાન વસૂલવા માંગે છે. ₹40 લાખમાંથી ₹15 લાખ સિલ્વરમાં મૂકવાથી તેમની અડધી સંપત્તિ આગળ મોટી વધઘટના જોખમમાં આવી શકે.", "સિલ્વર હવે વધુ ઘટી ન શકે.", "સિલ્વર ETF રેગ્યુલેટેડ નથી."]],
d14q2: ["એક રોકાણકારનો સિલ્વર ETF 50% ઘટ્યો. મૂળ વેલ્યુ પર પાછા આવવા કેટલો વધારો જોઈએ?", ["50%", "100%", "75%", "25%"]],
d14q3: ["તમે સામાન્ય ક્લાયન્ટને સિલ્વરની ભૂમિકા કેવી રીતે સમજાવશો?",
 ["\"સિલ્વર બેંક ડિપોઝિટ જેવું સુરક્ષિત સ્થાન છે.\"", "\"સિલ્વર પોર્ટફોલિયોને ડાઇવર્સિફાઇ કરી શકે, પણ તે ગોલ્ડ કરતાં ઘણું વધુ વધઘટવાળું છે — 2026ની ટોચથી તે લગભગ અડધું થઈ ગયું. રાખો તો યોજનાનો નાનો હિસ્સો જ રાખો.\"", "\"સોલર માંગને કારણે સિલ્વર દર વર્ષે બમણું થશે.\"", "\"સિલ્વર રોકાણ તરીકે નકામું છે.\""]],
d15q1: ["કયો જવાબ સચોટ, નિયમો મુજબ અને ભરોસો આપનારો છે?",
 ["\"હા, પાંચ વર્ષમાં ઇક્વિટી હંમેશા પૈસા બનાવે છે.\"", "\"બજાર સાથે જોડાયેલા રોકાણમાં કોઈ રિટર્નની ગેરંટી ન આપી શકે — અને જે આપે, તેનાથી સાવધ રહો. હું એ કરી શકું કે રોકાણને તમારા લક્ષ્ય અને સહજતા મુજબ પસંદ કરું, જોખમો પ્રામાણિકતાથી સમજાવું અને નિયમિત રીતે તમારી સાથે રિવ્યૂ કરું.\"", "\"જો તમે રોકાણમાં રહો તો હું વાર્ષિક 12% ની ગેરંટી આપી શકું.\"", "\"ગેરંટી ફક્ત અમારા પ્રીમિયમ પ્લાનમાં મળે છે.\""]],
d15q2: ["ક્લાયન્ટ સાથેની વાતચીતમાં કયું વિધાન સ્વીકાર્ય છે?",
 ["\"આ ફંડ 100% સુરક્ષિત છે.\"", "\"ઇતિહાસમાં, ડાઇવર્સિફાઇડ ઇક્વિટી ફંડ્સમાં લાંબો સમય રહેવાથી નુકસાનની શક્યતા ઘટી છે, જોકે નુકસાન હજુ થઈ શકે.\"", "\"SIP માં પૈસા ડૂબી ન શકે.\"", "\"આ ફંડ પાંચ વર્ષમાં તમારા પૈસા બમણા કરી દેશે.\""]],
d15q3: ["ઉપરની પહેલી વાર રોકાણ કરનાર પાસે ₹8 લાખની બચત છે અને કોઈ ઇમરજન્સી ફંડ નથી. ઇક્વિટી ફંડ વિશે વાત કરતાં પહેલાં શું થવું જોઈએ?",
