name: Update headlines

# Every 30 minutes: read the public RSS feeds (ET, Mint, Business Standard, SEBI), add the new headlines to the archive
# and publish it on the "news-data" branch. The Market Desk page reads it from there.
#   news.json                 the newest headlines (last 7 days)
#   archive/YYYY-MM-DD.json   every headline of that day, kept for 90 days
#   archive/index.json        the list of archived days
# Scheduled runs only start once this file is on the default branch (main). Run it by hand from the Actions tab to test.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-headlines
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATA_BRANCH: news-data
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Get the current headlines and archive, if any
        run: |
          mkdir "$RUNNER_TEMP/data"
          if git fetch --depth=1 origin "$DATA_BRANCH"; then
            git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/data"
          fi

      - name: Add the new headlines
        id: build
        run: python3 scripts/fetch_news.py --dir "$RUNNER_TEMP/data"

      - name: Publish to the data branch
        if: steps.build.outputs.changed == 'true'
        run: |
          cd "$RUNNER_TEMP/data"
          git init -q -b "$DATA_BRANCH"
          git config user.name "ucwacademy-bot"
          git config user.email "ucwacademy-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Update headlines"
          # one commit only: the branch is replaced each time, and unchanged files are not uploaded again
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$DATA_BRANCH"
