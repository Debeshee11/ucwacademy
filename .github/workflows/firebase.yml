name: Deploy backend

# Publishes the Cloud Functions to Firebase whenever they change. Firestore rules are published by hand in the Firebase console (see PUSH-GUIDE.md).
# One-time setup: add the repository secret FIREBASE_SERVICE_ACCOUNT (see SETUP-BACKEND.md).
on:
  push:
    branches: [main]
    paths: ["functions/**", "firebase.json"]
  workflow_dispatch:

concurrency:
  group: firebase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Test the marking logic
        working-directory: functions
        run: npm install --no-audit --no-fund && npm test
      - name: Deploy functions and rules
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy --only functions --project ucwacademy --non-interactive
