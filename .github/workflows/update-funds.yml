name: Update funds

# Every week: list every open-ended mutual fund (Regular plan, Growth) from AMFI data,
# refresh NAV, returns and rank, and publish funds-live.json on the "funds-data" branch. The Library page reads it from there.
# Scheduled runs only start once this file is on the default branch (main). Run it by hand from the Actions tab to test.
on:
  schedule:
    - cron: "30 22 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-funds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATA_BRANCH: funds-data
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Get the current data, if any
        run: |
          mkdir "$RUNNER_TEMP/data"
          if git fetch --depth=1 origin "$DATA_BRANCH"; then
            git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/data"
          fi

      - name: Refresh funds
        id: build
        run: python3 scripts/update_funds.py --out "$RUNNER_TEMP/data"

      - name: Publish to the data branch
        if: steps.build.outputs.changed == 'true'
        run: |
          cd "$RUNNER_TEMP/data"
          git init -q -b "$DATA_BRANCH"
          git config user.name "ucwacademy-bot"
          git config user.email "ucwacademy-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Update funds"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$DATA_BRANCH"
