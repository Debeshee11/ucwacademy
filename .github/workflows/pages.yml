name: Deploy site

# Publishes the website to GitHub Pages. Settings > Pages > Source must be "GitHub Actions".
# Only the files the site needs are published: not the backend, build tools, scripts, private keys or workflows.
on:
  push:
    branches: [main]
    paths: ["index.html", "one/**", "assets/**", "CNAME", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site files
        run: |
          mkdir _site
          cp -r index.html one assets CNAME _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
