name: Deploy site

# Publishes the website to GitHub Pages. Settings > Pages > Source must be "GitHub Actions".
# Only the files the site needs are published: not the backend, build tools, scripts, private keys or workflows.
on:
  push:
    branches: [main]
    paths: ["index.html", "one/**", "scripts/stamp.py", "assets/**", "learn/**", "sitemap.xml", "robots.txt", "404.html", "CNAME", "sw.js", "manifest.webmanifest", "functions/content/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site files
        run: |
          mkdir _site
          cp -r index.html one assets learn sitemap.xml robots.txt 404.html CNAME sw.js manifest.webmanifest _site/
          # Lessons and practice are open to everyone: publish the course files so the browser and the offline cache can keep them.
          # Exam and mock answer keys are not in these files; they stay in the database, behind the backend.
          cp -r functions/content _site/one/content
          # Speed: join the sixty script modules into one small file. If this step ever fails, the site is published
          # with the separate modules exactly as before, so a bundling problem can never block a release.
          if npx --yes esbuild@0.24.0 _site/one/js/app.js --bundle --format=esm --minify --target=es2022 --legal-comments=none --outfile=_site/one/js/app.bundle.js; then
            sed -i 's#src="one/js/app.js"#src="one/js/app.bundle.js"#' _site/index.html
          else
            echo "::warning::Bundling was skipped; the unbundled modules are being served."; rm -f _site/one/js/app.bundle.js
          fi
          python3 scripts/stamp.py _site "$GITHUB_SHA"
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
